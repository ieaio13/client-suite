            avatarHtml(STATE.user) +
            '<span class="user-name" style="font-weight:600">' + esc(STATE.user.name) + '</span>' +
            '<span class="user-role" style="color:var(--text-soft);font-size:12px">(' + esc(STATE.user.role) + ')</span>' +
          '</button>' +
        '</div>' +
      '</header>';
    }

    function renderSidebar() {
      var reorder = Boolean(STATE.reorderMode && STATE.isBilling);
      var parents = sortClients(STATE.clients.filter(function(c) {
        return !c.parentId && (STATE.showArchived || !c.archived);
      }));

      var treeHtml = '';
      if (parents.length === 0) {
        treeHtml = '<div style="padding:14px 8px;color:var(--text-soft);font-size:13px">No clients yet. Add a parent client to begin organizing content.</div>';
      } else {
        for (var i = 0; i < parents.length; i++) {
          var p = parents[i];
          var subs = sortClients(STATE.clients.filter(function(s) {
            return s.parentId === p.id && (STATE.showArchived || !s.archived);
          }));
          treeHtml += '<div class="tree-parent-group">' + treeItemHtml(p, false, reorder, i, parents.length) + '<div class="tree-sub-list">';
          for (var j = 0; j < subs.length; j++) {
            treeHtml += treeItemHtml(subs[j], true, reorder, j, subs.length);
          }
          if (STATE.isBilling && !p.archived && !reorder) {
            treeHtml += '<button class="tree-item tree-sub-item" style="color:var(--text-soft);font-size:12.5px" onclick="openClientModal(null, \'' + esc(p.id) + '\')">+ Add sub-client</button>';
          }
          treeHtml += '</div></div>';
        }
      }

      return '<aside class="sidebar' + (STATE.sidebarOpen ? ' open' : '') + '">' +
        '<div class="sidebar-section-header">' +
          '<span>Clients</span>' +
          '<div style="display:flex;gap:6px">' +
            (STATE.isBilling && parents.length > 0 ? '<button class="btn-sm ' + (reorder ? 'btn-primary' : '') + '" onclick="toggleReorder()">' + (reorder ? 'Done' : '↕ Reorder') + '</button>' : '') +
            (STATE.isBilling && !reorder ? '<button class="btn-sm" onclick="openClientModal(null, \'\')">+ Add</button>' : '') +
          '</div>' +
        '</div>' +
        (reorder ? '<div class="info-note">Use the arrows to change the order everyone sees.</div>' : '') +
        '<div class="client-tree">' + treeHtml + '</div>' +
        '<div style="border-top:1px solid var(--border);padding-top:10px;display:flex;align-items:center;justify-content:space-between;font-size:12.5px;color:var(--text-muted)">' +
          '<label style="display:flex;align-items:center;gap:6px;cursor:pointer">' +
            '<input type="checkbox" ' + (STATE.showArchived ? 'checked' : '') + ' onchange="toggleShowArchived(this.checked)"> Show archived' +
          '</label>' +
        '</div>' +
      '</aside>';
    }

    function treeItemHtml(c, isSub, reorder, idx, count) {
      var label = '<span class="tree-label">' + clientDot(c) + '<span class="nm">' + esc(c.name) + (c.archived ? ' (Archived)' : '') + '</span></span>';
      var cls = 'tree-item' + (isSub ? ' tree-sub-item' : '');
      if (reorder) {
        return '<div class="' + cls + '">' + label +
          '<span class="reorder-btns">' +
            '<button class="btn-sm" onclick="moveClient(\'' + esc(c.id) + '\', -1)" ' + (idx === 0 ? 'disabled' : '') + ' aria-label="Move ' + esc(c.name) + ' up">↑</button>' +
            '<button class="btn-sm" onclick="moveClient(\'' + esc(c.id) + '\', 1)" ' + (idx === count - 1 ? 'disabled' : '') + ' aria-label="Move ' + esc(c.name) + ' down">↓</button>' +
          '</span></div>';
      }
      var active = (STATE.nav === 'client' && STATE.selectedClientId === c.id) ? ' active' : '';
      return '<button class="' + cls + active + '" onclick="selectClient(\'' + esc(c.id) + '\')">' + label + '</button>';
    }

    function toggleReorder() {
      STATE.reorderMode = !STATE.reorderMode;
      renderApp();
    }

    function moveClient(id, dir) {
      var c = getClient(id);
      if (!c) return;
      var sameGroup = function(x) { return (x.parentId || '') === (c.parentId || ''); };
      var visible = sortClients(STATE.clients.filter(function(x) { return sameGroup(x) && (STATE.showArchived || !x.archived); }));
      var idx = visible.indexOf(c);
      var target = idx + dir;
      if (idx === -1 || target < 0 || target >= visible.length) return;
      visible.splice(idx, 1);
      visible.splice(target, 0, c);
      var hidden = sortClients(STATE.clients.filter(function(x) { return sameGroup(x) && visible.indexOf(x) === -1; }));
      var ordered = visible.concat(hidden);
      for (var i = 0; i < ordered.length; i++) ordered[i].sortOrder = i;
      renderApp();
      callApi('reorderClients', { ids: ordered.map(function(x) { return x.id; }) })
        .catch(function(err) {
          showToast(err.message, 'error');
          callApi('boot', {}).then(applyBootState);
        });
    }

    function switchNav(nav) {
      STATE.nav = nav;
      STATE.sidebarOpen = false;
      renderApp();
    }

    function openSettings(tab) {
      STATE.nav = 'settings';
      STATE.settingsTab = tab || 'profile';
      STATE.sidebarOpen = false;
      PROFILE_DRAFT = null;
      DRAFT_TAGS = null;
      DRAFT_TEAM = null;
      closeModal(true);
      renderApp();
    }

    function selectClient(clientId) {
      STATE.nav = 'client';
      STATE.selectedClientId = clientId;
      STATE.sidebarOpen = false;
      if (STATE.subView === 'invoices') {
        STATE.subView = 'calendar';
      }
      renderApp();
    }

    function toggleShowArchived(checked) {
      STATE.showArchived = Boolean(checked);
      renderApp();
    }

    function renderAgencyMainContent() {
      if (STATE.nav === 'settings') {
        return renderSettingsView();
      }
      if (STATE.nav === 'client' && STATE.selectedClientId) {
        var client = getClient(STATE.selectedClientId);
        if (client) {
          return client.parentId ? renderSubClientView(client) : renderParentClientView(client);
        }
      }
      return renderOverviewDashboard();
    }

    /* ========================================================================
       1. OVERVIEW DASHBOARD
       ======================================================================== */
    function renderOverviewDashboard() {
      var activeClientMap = {};
      for (var i = 0; i < STATE.clients.length; i++) {
        if (!STATE.clients[i].archived) activeClientMap[STATE.clients[i].id] = STATE.clients[i];
      }

      var inReviewPosts = STATE.posts.filter(function(p) {
        return activeClientMap[p.clientId] && p.status === 'In Review';
      });
      var today = STATE.today;
      var in7Days = addDaysToDateStr(today, 7);
      var upcomingPosts = STATE.posts.filter(function(p) {
        return activeClientMap[p.clientId] && p.date && p.date >= today && p.date <= in7Days;
      });
      upcomingPosts.sort(function(a, b) { return (a.date + a.time).localeCompare(b.date + b.time); });

      var html = '<div style="margin-bottom:20px">' +
        '<h1 style="font-size:22px;margin:0 0 4px 0">Overview</h1>' +
        '<p style="color:var(--text-muted);margin:0">Agency-wide content schedule, pending client approvals' + (STATE.isBilling ? ', and billing health.' : '.') + '</p>' +
      '</div>';

      // Billing Summary Cards for Admin / Account Manager
      if (STATE.isBilling) {
        var outstandingByCurr = {};
        var overdueInvoices = [];
        for (var iv = 0; iv < STATE.invoices.length; iv++) {
          var inv = STATE.invoices[iv];
          if (!activeClientMap[inv.clientId]) continue;
          if (inv.status !== 'Paid') {
            var tot = computeInvoiceTotals(inv).total;
            outstandingByCurr[inv.currency] = (outstandingByCurr[inv.currency] || 0) + tot;
            if (isInvoiceOverdue(inv)) overdueInvoices.push(inv);
          }
        }
        var currKeys = Object.keys(outstandingByCurr);
        var outStr = currKeys.length === 0 ? 'None outstanding' : currKeys.map(function(k) { return formatCurrency(outstandingByCurr[k], k); }).join(' · ');

        html += '<div class="grid-cards" style="margin-bottom:22px">' +
          '<div class="card"><div style="color:var(--text-muted);font-size:12.5px;font-weight:600">Waiting on client review</div><div style="font-size:24px;font-weight:700;margin-top:6px;color:var(--st-review)">' + inReviewPosts.length + '</div></div>' +
          '<div class="card"><div style="color:var(--text-muted);font-size:12.5px;font-weight:600">Scheduled in next 7 days</div><div style="font-size:24px;font-weight:700;margin-top:6px;color:var(--accent)">' + upcomingPosts.length + '</div></div>' +
          '<div class="card"><div style="color:var(--text-muted);font-size:12.5px;font-weight:600">Outstanding invoices</div><div style="font-size:20px;font-weight:700;margin-top:6px">' + esc(outStr) + '</div></div>' +
          '<div class="card"><div style="color:var(--text-muted);font-size:12.5px;font-weight:600">Overdue invoices</div><div style="font-size:24px;font-weight:700;margin-top:6px;color:' + (overdueInvoices.length > 0 ? 'var(--danger)' : 'var(--st-published)') + '">' + overdueInvoices.length + '</div></div>' +
        '</div>';
      }

      // Waiting on client review table
      html += '<div class="card" style="margin-bottom:20px">' +
        '<h2 style="font-size:16px;margin:0 0 12px 0">Posts waiting on client review (' + inReviewPosts.length + ')</h2>';
      if (inReviewPosts.length === 0) {
        html += '<div style="color:var(--text-soft);padding:12px 0">No posts are currently waiting on client review.</div>';
      } else {
        html += '<div class="table-wrap"><table class="data-table"><thead><tr><th>Client</th><th>Copy</th><th>Platforms</th><th>Scheduled</th><th>Assignee</th></tr></thead><tbody>';
        for (var r = 0; r < inReviewPosts.length; r++) {
          var rp = inReviewPosts[r];
          var rc = activeClientMap[rp.clientId];
          html += '<tr class="clickable" onclick="jumpToPost(\'' + esc(rp.clientId) + '\', \'' + esc(rp.id) + '\')">' +
            '<td style="font-weight:600;white-space:nowrap">' + (rc ? clientDot(rc) + ' ' + esc(rc.name) : '') + '</td>' +
            '<td>' + esc((rp.text || '(No copy)').substring(0, 90)) + '</td>' +
            '<td>' + esc(rp.platforms.join(', ') || '—') + '</td>' +
            '<td style="white-space:nowrap">' + esc((rp.date || 'Unscheduled') + (rp.time ? ' ' + rp.time : '')) + '</td>' +
            '<td>' + esc(rp.assignee || 'Unassigned') + '</td>' +
          '</tr>';
        }
        html += '</tbody></table></div>';
      }
      html += '</div>';

      // Next 7 days table
      html += '<div class="card" style="margin-bottom:20px">' +
        '<h2 style="font-size:16px;margin:0 0 12px 0">Posts in the next 7 days (' + upcomingPosts.length + ')</h2>';
      if (upcomingPosts.length === 0) {
        html += '<div style="color:var(--text-soft);padding:12px 0">No posts scheduled in the next 7 days.</div>';
      } else {
        html += '<div class="table-wrap"><table class="data-table"><thead><tr><th>Date &amp; time</th><th>Client</th><th>Status</th><th>Copy</th><th>Platforms</th></tr></thead><tbody>';
        for (var u = 0; u < upcomingPosts.length; u++) {
          var up = upcomingPosts[u];
          var uc = activeClientMap[up.clientId];
          html += '<tr class="clickable" onclick="jumpToPost(\'' + esc(up.clientId) + '\', \'' + esc(up.id) + '\')">' +
            '<td style="white-space:nowrap;font-weight:600">' + esc(up.date + (up.time ? ' ' + up.time : '')) + '</td>' +
            '<td style="white-space:nowrap">' + (uc ? clientDot(uc) + ' ' + esc(uc.name) : '') + '</td>' +
            '<td><span class="status-pill st-bg-' + statusClass(up.status) + '">' + esc(up.status) + '</span></td>' +
            '<td>' + esc((up.text || '(No copy)').substring(0, 80)) + '</td>' +
            '<td>' + esc(up.platforms.join(', ') || '—') + '</td>' +
          '</tr>';
        }
        html += '</tbody></table></div>';
      }
      html += '</div>';

      // Overdue invoices table for billing roles
      if (STATE.isBilling) {
        var overdueList = STATE.invoices.filter(function(inv) {
          return activeClientMap[inv.clientId] && isInvoiceOverdue(inv);
        });
        html += '<div class="card">' +
          '<h2 style="font-size:16px;margin:0 0 12px 0">Overdue invoices (' + overdueList.length + ')</h2>';
        if (overdueList.length === 0) {
          html += '<div style="color:var(--text-soft);padding:12px 0">No overdue invoices across active clients.</div>';
        } else {
          html += '<div class="table-wrap"><table class="data-table"><thead><tr><th>Invoice #</th><th>Client</th><th>Due date</th><th>Total</th></tr></thead><tbody>';
          for (var od = 0; od < overdueList.length; od++) {
            var oInv = overdueList[od];
            var oc = activeClientMap[oInv.clientId];
            html += '<tr class="clickable" onclick="jumpToClientInvoices(\'' + esc(oInv.clientId) + '\')">' +
              '<td style="font-weight:600">' + esc(oInv.number) + '</td>' +
              '<td style="white-space:nowrap">' + (oc ? clientDot(oc) + ' ' + esc(oc.name) : '') + '</td>' +
              '<td style="color:var(--danger);font-weight:600">' + esc(oInv.dueDate) + '</td>' +
              '<td style="font-weight:600">' + esc(formatCurrency(computeInvoiceTotals(oInv).total, oInv.currency)) + '</td>' +
            '</tr>';
          }
          html += '</tbody></table></div>';
        }
        html += '</div>';
      }

      return html;
    }

    function jumpToPost(clientId, postId) {
      STATE.nav = 'client';
      STATE.selectedClientId = clientId;
      renderApp();
      openPostModal(postId);
    }

    function jumpToClientInvoices(clientId) {
      var c = getClient(clientId);
      STATE.nav = 'client';
      STATE.selectedClientId = c && c.parentId ? c.parentId : clientId;
      STATE.sidebarOpen = false;
      renderApp();
      var el = document.getElementById('invoices');
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    /* ========================================================================
       2. PARENT CLIENT PAGE
       ======================================================================== */
    function renderParentClientView(parent) {
      var subs = STATE.clients.filter(function(c) {
        return c.parentId === parent.id && (STATE.showArchived || !c.archived);
      });
      subs = sortClients(subs);

      var html = '<div class="view-header">' +
        '<div>' +
          '<div style="font-size:12px;color:var(--text-soft);font-weight:600;text-transform:uppercase">Parent Client</div>' +
          '<h1 style="font-size:22px;margin:2px 0 0 0;display:flex;align-items:center;gap:10px">' + clientDot(parent) + esc(parent.name) + (parent.archived ? ' <span class="mini-chip">Archived</span>' : '') + '</h1>' +
        '</div>' +
        '<div style="display:flex;gap:8px;flex-wrap:wrap">' +
          (STATE.isBilling ? '<button onclick="openShareModal(\'' + esc(parent.id) + '\')">Share portal link</button>' : '') +
          (STATE.isBilling ? '<button onclick="openClientModal(\'' + esc(parent.id) + '\')">Edit client</button>' : '') +
          (STATE.isBilling && !parent.archived ? '<button class="btn-primary" onclick="openClientModal(null, \'' + esc(parent.id) + '\')">+ Add sub-client</button>' : '') +
        '</div>' +
      '</div>';

      // Sub-client cards with post counts per status
      html += '<h2 style="font-size:16px;margin:16px 0 12px 0">Sub-clients (' + subs.length + ')</h2>';
      if (subs.length === 0) {
        html += '<div class="card" style="color:var(--text-soft)">No sub-clients under ' + esc(parent.name) + ' yet. Add a sub-client to plan its content.</div>';
      } else {
        html += '<div class="grid-cards">';
        var statuses = ['Draft', 'In Review', 'Approved', 'Scheduled', 'Published'];
        for (var i = 0; i < subs.length; i++) {
          var sub = subs[i];
          var counts = { 'Draft': 0, 'In Review': 0, 'Approved': 0, 'Scheduled': 0, 'Published': 0 };
          for (var p = 0; p < STATE.posts.length; p++) {
            if (STATE.posts[p].clientId === sub.id) {
              counts[STATE.posts[p].status] = (counts[STATE.posts[p].status] || 0) + 1;
            }
          }
          html += '<div class="card" style="cursor:pointer" onclick="selectClient(\'' + esc(sub.id) + '\')">' +
            '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">' +
              '<strong style="font-size:16px;display:flex;align-items:center;gap:8px">' + clientDot(sub) + esc(sub.name) + '</strong>' +
              (sub.archived ? '<span class="mini-chip">Archived</span>' : '') +
            '</div>' +
            '<div style="display:flex;flex-wrap:wrap;gap:6px">';
          for (var st = 0; st < statuses.length; st++) {
            var sName = statuses[st];
            html += '<span class="mini-chip" style="border-left:3px solid var(--st-' + sName.toLowerCase().replace('in review', 'review') + ')">' + esc(sName) + ': <strong>' + counts[sName] + '</strong></span>';
          }
          html += '</div></div>';
        }
        html += '</div>';
      }

      // Invoices are billed to the main client (older sub-client invoices are listed here too)
      if (STATE.isBilling) {
        html += '<div id="invoices" style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:28px 0 12px 0">' +
          '<h2 style="font-size:16px;margin:0">Invoices</h2>' +
          '<button class="btn-primary" onclick="openInvoiceModal(null)">+ Add invoice</button>' +
        '</div>' +
        renderClientInvoicesView(parent);
      }

      return html;
    }

    /* ========================================================================
       3. SUB-CLIENT PAGE (CALENDAR | BOARD | TABLE | INVOICES)
       ======================================================================== */
    function renderSubClientView(client) {
      var parent = client.parentId ? getClient(client.parentId) : null;
      var html = '<div class="view-header">' +
        '<div>' +
          '<div style="font-size:12px;color:var(--text-soft);font-weight:600">' +
            (parent ? '<a href="javascript:void(0)" onclick="selectClient(\'' + esc(parent.id) + '\')" style="color:var(--text-soft);text-decoration:none">' + esc(parent.name) + '</a> / ' : '') +
            'Sub-client' +
          '</div>' +
          '<h1 style="font-size:22px;margin:2px 0 0 0;display:flex;align-items:center;gap:10px">' + clientDot(client) + esc(client.name) + (client.archived ? ' <span class="mini-chip">Archived</span>' : '') + '</h1>' +
        '</div>' +
        '<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">' +
          '<div class="sub-tabs">' +
            '<button class="sub-tab ' + (STATE.subView === 'calendar' ? 'active' : '') + '" onclick="setSubView(\'calendar\')">Calendar</button>' +
            '<button class="sub-tab ' + (STATE.subView === 'board' ? 'active' : '') + '" onclick="setSubView(\'board\')">Board</button>' +
            '<button class="sub-tab ' + (STATE.subView === 'table' ? 'active' : '') + '" onclick="setSubView(\'table\')">Table</button>' +
          '</div>' +
          (STATE.isBilling ? '<button onclick="openShareModal(\'' + esc(client.id) + '\')">Share</button>' : '') +
          (STATE.isBilling ? '<button onclick="openClientModal(\'' + esc(client.id) + '\')">Settings</button>' : '') +
          '<button class="btn-primary" onclick="openPostModal(null, \'' + esc(STATE.today) + '\')">+ New post</button>' +
        '</div>' +
      '</div>';

      var allClientPosts = STATE.posts.filter(function(p) { return p.clientId === client.id; });
      var filteredPosts = filterPostsList(allClientPosts, false);

      html += renderContentFilterBar(allClientPosts, filteredPosts.length, false);

      if (STATE.subView === 'board') {
        html += renderBoardView(filteredPosts, false);
      } else if (STATE.subView === 'table') {
        html += renderTableView(filteredPosts);
      } else {
        html += renderCalendarView(filteredPosts, false);
      }
      return html;
    }

    function setSubView(v) {
      STATE.subView = v;
      renderApp();
    }

    function filterPostsList(posts, isPortal) {
      var f = STATE.filters;
      var q = String(f.search || '').trim().toLowerCase();
      return posts.filter(function(p) {
        if (isPortal && STATE.portalOnlyReview && p.status !== 'In Review') return false;
        if (f.status && p.status !== f.status) return false;
        if (f.platform && p.platforms.indexOf(f.platform) === -1) return false;
        if (f.tag && p.tags.indexOf(f.tag) === -1) return false;
        if (!isPortal && f.assignee) {
          if (f.assignee === '__UNASSIGNED__' && p.assignee) return false;
          if (f.assignee !== '__UNASSIGNED__' && p.assignee !== f.assignee) return false;
        }
        if (q) {
          var hay = (p.text || '').toLowerCase() + ' ' + p.tags.join(' ').toLowerCase();
          if (hay.indexOf(q) === -1) return false;
        }
        return true;
      });
    }

    function renderContentFilterBar(allClientPosts, shownCount, isPortal) {
      var tagSet = {};
      for (var i = 0; i < allClientPosts.length; i++) {
        var tArr = allClientPosts[i].tags || [];
        for (var j = 0; j < tArr.length; j++) tagSet[tArr[j]] = true;
      }
      var allTags = Object.keys(tagSet).sort();
      var statuses = ['Draft', 'In Review', 'Approved', 'Scheduled', 'Published'];
      var platforms = ['Instagram', 'Facebook', 'LinkedIn', 'TikTok', 'YouTube', 'X'];

      var f = STATE.filters;
      var hasActive = Boolean(f.search || f.status || f.platform || f.tag || f.assignee || (isPortal && STATE.portalOnlyReview));

      var html = '<div class="filter-bar">' +
        '<input type="text" placeholder="Search copy or tags…" value="' + esc(f.search) + '" oninput="updateFilter(\'search\', this.value)">' +
        '<select aria-label="Filter by status" onchange="updateFilter(\'status\', this.value)">' +
          '<option value="">All statuses</option>' +
          statuses.map(function(s) { return '<option value="' + esc(s) + '" ' + (f.status === s ? 'selected' : '') + '>' + esc(s) + '</option>'; }).join('') +
        '</select>' +
        '<select aria-label="Filter by platform" onchange="updateFilter(\'platform\', this.value)">' +
          '<option value="">All platforms</option>' +
          platforms.map(function(pl) { return '<option value="' + esc(pl) + '" ' + (f.platform === pl ? 'selected' : '') + '>' + esc(pl) + '</option>'; }).join('') +
        '</select>' +
        '<select aria-label="Filter by tag" onchange="updateFilter(\'tag\', this.value)">' +
          '<option value="">All tags</option>' +
          allTags.map(function(tg) { return '<option value="' + esc(tg) + '" ' + (f.tag === tg ? 'selected' : '') + '>' + esc(tg) + '</option>'; }).join('') +
        '</select>';

      if (!isPortal) {
        html += '<select aria-label="Filter by assignee" onchange="updateFilter(\'assignee\', this.value)">' +
          '<option value="">All assignees</option>' +
          '<option value="__UNASSIGNED__" ' + (f.assignee === '__UNASSIGNED__' ? 'selected' : '') + '>Unassigned</option>' +
          STATE.team.map(function(tm) { return '<option value="' + esc(tm.email) + '" ' + (f.assignee === tm.email ? 'selected' : '') + '>' + esc(tm.name) + '</option>'; }).join('') +
        '</select>';
      }

      if (hasActive) {
        html += '<button class="btn-sm btn-ghost" onclick="clearAllFilters()">Clear filters</button>';
      }
      html += '<span style="margin-left:auto;font-size:12.5px;color:var(--text-muted);font-weight:600">' + shownCount + ' of ' + allClientPosts.length + ' posts</span>' +
      '</div>';
      return html;
    }

    function updateFilter(key, val) {
      STATE.filters[key] = val;
      renderApp();
    }

    function clearAllFilters() {
      STATE.filters = { search: '', status: '', platform: '', tag: '', assignee: '' };
      STATE.portalOnlyReview = false;
      renderApp();
    }

    /* ========================================================================
       CALENDAR VIEW (MONTH / WEEK / LIST + DRAG RESCHEDULE)
       ======================================================================== */
    function parseDateParts(str) {
      var p = String(str || STATE.today || '2026-01-01').split('-');
      return new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]), 12, 0, 0);
    }
    function formatDateYmd(d) {
      var y = d.getFullYear();
      var m = ('0' + (d.getMonth() + 1)).slice(-2);
      var day = ('0' + d.getDate()).slice(-2);
      return y + '-' + m + '-' + day;
    }
    function addDaysToDateStr(str, days) {
      var d = parseDateParts(str);
      d.setDate(d.getDate() + days);
      return formatDateYmd(d);
    }

    function navigateCalendar(dir) {
      var cur = parseDateParts(STATE.calCursor || STATE.today);
      if (dir === 0) {
        STATE.calCursor = STATE.today;
      } else if (STATE.calMode === 'week') {
        cur.setDate(cur.getDate() + (dir * 7));
        STATE.calCursor = formatDateYmd(cur);
      } else {
        cur.setMonth(cur.getMonth() + dir);
        STATE.calCursor = formatDateYmd(cur);
      }
      renderApp();
    }

    function setCalMode(m) {
      STATE.calMode = m;
      renderApp();
    }

    function renderCalendarView(posts, isPortal) {
      var cursorDate = parseDateParts(STATE.calCursor || STATE.today);
      var monthNames = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
      var titleLabel = monthNames[cursorDate.getMonth()] + ' ' + cursorDate.getFullYear();

      var html = '<div class="cal-controls">' +
        '<div style="display:flex;align-items:center;gap:8px">' +
          '<button class="btn-sm" onclick="navigateCalendar(-1)">Prev</button>' +
          '<button class="btn-sm" onclick="navigateCalendar(0)">Today</button>' +
          '<button class="btn-sm" onclick="navigateCalendar(1)">Next</button>' +
          '<strong style="font-size:16px;margin-left:6px">' + esc(titleLabel) + '</strong>' +
        '</div>' +
        '<div class="sub-tabs">' +
          '<button class="sub-tab ' + (STATE.calMode === 'month' ? 'active' : '') + '" onclick="setCalMode(\'month\')">Month</button>' +
          '<button class="sub-tab ' + (STATE.calMode === 'week' ? 'active' : '') + '" onclick="setCalMode(\'week\')">Week</button>' +
          '<button class="sub-tab ' + (STATE.calMode === 'list' ? 'active' : '') + '" onclick="setCalMode(\'list\')">List</button>' +
        '</div>' +
      '</div>';

      if (STATE.calMode === 'list') {
        var sorted = posts.slice().sort(function(a, b) { return (a.date + a.time).localeCompare(b.date + b.time); });
        if (sorted.length === 0) {
          return html + '<div class="card" style="color:var(--text-soft);text-align:center;padding:32px">No posts match your current filters.</div>';
        }
        html += '<div class="table-wrap"><table class="data-table"><thead><tr><th>Date &amp; time</th><th>Status</th><th>Copy</th><th>Platforms</th></tr></thead><tbody>';
        for (var i = 0; i < sorted.length; i++) {
          var p = sorted[i];
          html += '<tr class="clickable" onclick="openPostModal(\'' + esc(p.id) + '\')">' +
            '<td style="white-space:nowrap;font-weight:600">' + esc((p.date || 'Unscheduled') + (p.time ? ' ' + p.time : '')) + '</td>' +
            '<td><span class="status-pill st-bg-' + statusClass(p.status) + '">' + esc(p.status) + '</span></td>' +
            '<td>' + esc((p.text || '(No copy)').substring(0, 100)) + '</td>' +
            '<td>' + esc(p.platforms.join(', ') || '—') + '</td>' +
          '</tr>';
        }
        html += '</tbody></table></div>';
        return html;
      }

      // Build day cells for Month or Week
      var days = [];
      if (STATE.calMode === 'week') {
        var startW = new Date(cursorDate.getTime());
        startW.setDate(startW.getDate() - startW.getDay());
        for (var w = 0; w < 7; w++) {
          var wd = new Date(startW.getTime());
          wd.setDate(wd.getDate() + w);
          days.push({ dateStr: formatDateYmd(wd), dayNum: wd.getDate(), outside: false });
        }
      } else {
        var firstDay = new Date(cursorDate.getFullYear(), cursorDate.getMonth(), 1, 12, 0, 0);
        var startM = new Date(firstDay.getTime());
        startM.setDate(startM.getDate() - startM.getDay());
        for (var m = 0; m < 42; m++) {
          var md = new Date(startM.getTime());
          md.setDate(md.getDate() + m);
          days.push({
            dateStr: formatDateYmd(md),
            dayNum: md.getDate(),
            outside: md.getMonth() !== cursorDate.getMonth()
          });
        }
      }

      var postsByDate = {};
      for (var pIdx = 0; pIdx < posts.length; pIdx++) {
        var pt = posts[pIdx];
        if (!pt.date) continue;
        if (!postsByDate[pt.date]) postsByDate[pt.date] = [];
        postsByDate[pt.date].push(pt);
      }

      var dows = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
      html += '<div class="cal-grid">';
      for (var d = 0; d < 7; d++) {
        html += '<div class="cal-dow">' + dows[d] + '</div>';
      }

      for (var c = 0; c < days.length; c++) {
        var cell = days[c];
        var isToday = (cell.dateStr === STATE.today);
        var dayPosts = (postsByDate[cell.dateStr] || []).slice().sort(function(a, b) {
          return (a.time || '').localeCompare(b.time || '');
        });

        var dragAttrs = isPortal ? '' : ' ondragover="onCalDragOver(event, this)" ondragleave="onCalDragLeave(this)" ondrop="onCalDrop(event, \'' + esc(cell.dateStr) + '\')"';
        html += '<div class="cal-cell ' + (cell.outside ? 'outside ' : '') + (isToday ? 'today' : '') + '"' + dragAttrs + '>' +
          '<div class="cal-cell-top">' +
            '<span class="cal-day-num ' + (isToday ? 'is-today' : '') + '">' + cell.dayNum + '</span>' +
            (!isPortal || canPortalEdit(null) ? '<button class="cal-add-btn" title="Create post on ' + esc(cell.dateStr) + '" onclick="openPostModal(null, \'' + esc(cell.dateStr) + '\')">+</button>' : '') +
          '</div>';

        for (var dp = 0; dp < dayPosts.length; dp++) {
          var item = dayPosts[dp];
          var cover = postCover(item);
          var thumb = !cover ? '' : (cover.asset.thumbUrl
            ? '<img class="cal-chip-thumb" src="' + esc(cover.asset.thumbUrl) + '" alt="" loading="lazy">'
            : '<div class="cal-chip-video">▶ Video</div>');
          var draggableAttr = isPortal ? '' : ' draggable="true" ondragstart="onPostDragStart(event, \'' + esc(item.id) + '\')"';
          html += '<div class="cal-chip st-border-' + statusClass(item.status) + '"' + draggableAttr + ' onclick="openPostModal(\'' + esc(item.id) + '\')" title="' + esc(item.status + ' — ' + (item.text || '')) + '">' +
            thumb +
            '<span class="status-pill st-bg-' + statusClass(item.status) + '">' + esc(item.status) + '</span>' +
            '<span class="cal-chip-text">' + esc(item.text || '(No copy)') + '</span>' +
          '</div>';
        }
        html += '</div>';
      }
      html += '</div>';
      return html;
    }

    function onPostDragStart(e, postId) {
      e.dataTransfer.setData('text/plain', postId);
    }
    function onCalDragOver(e, el) {
      e.preventDefault();
      el.classList.add('drag-over');
    }
    function onCalDragLeave(el) {
      el.classList.remove('drag-over');
    }
    function onCalDrop(e, newDateStr) {
      e.preventDefault();
      if (e.currentTarget) e.currentTarget.classList.remove('drag-over');
      var postId = e.dataTransfer.getData('text/plain');
      if (!postId) return;
      callApi('movePost', { postId: postId, date: newDateStr })
        .then(function(res) {
          upsertLocalPost(res.post, res.activity);
          renderApp();
          showToast('Rescheduled to ' + newDateStr, 'success');
        })
        .catch(function(err) { showToast(err.message, 'error'); });
    }

    /* ========================================================================
       BOARD VIEW (KANBAN COLUMNS + DRAG STATUS CHANGE)
       ======================================================================== */
    function renderBoardView(posts, isPortal) {
      var statuses = ['Draft', 'In Review', 'Approved', 'Scheduled', 'Published'];
      var commentCounts = {};
      for (var cm = 0; cm < STATE.comments.length; cm++) {
        var pid = STATE.comments[cm].postId;
        commentCounts[pid] = (commentCounts[pid] || 0) + 1;
      }

      var html = '<div class="board-wrap">';
      for (var s = 0; s < statuses.length; s++) {
        var st = statuses[s];
        var colPosts = posts.filter(function(p) { return p.status === st; });
        var borderVar = 'var(--st-' + st.toLowerCase().replace('in review', 'review') + ')';
        var dragAttrs = isPortal ? '' : ' ondragover="onBoardDragOver(event, this)" ondragleave="onBoardDragLeave(this)" ondrop="onBoardDrop(event, \'' + esc(st) + '\')"';

        html += '<div class="board-col" style="border-top-color:' + borderVar + '"' + dragAttrs + '>' +
          '<div class="board-col-header">' +
            '<span>' + esc(st) + '</span>' +
            '<span class="mini-chip">' + colPosts.length + '</span>' +
          '</div>' +
          '<div class="board-col-body">';

        for (var i = 0; i < colPosts.length; i++) {
          var p = colPosts[i];
          var cover = postCover(p);
          var firstAsset = cover ? cover.asset : null;
          var badge = cover && cover.isRef ? '<span class="media-badge ref">Reference</span>' : '';
          if (cover && cover.count > 1) {
            badge += '<span class="media-badge">' + cover.count + ' items</span>';
          } else if (firstAsset && firstAsset.type === 'video') {
            badge += '<span class="media-badge">Video</span>';
          }

          var draggableAttr = isPortal ? '' : ' draggable="true" ondragstart="onPostDragStart(event, \'' + esc(p.id) + '\')"';
          html += '<div class="board-card"' + draggableAttr + ' onclick="openPostModal(\'' + esc(p.id) + '\')">';
          if (firstAsset) {
            html += '<div class="board-card-media">' +
              (firstAsset.thumbUrl ? '<img src="' + esc(firstAsset.thumbUrl) + '" alt="" loading="lazy">' : '<div class="video-placeholder">▶ Video</div>') +
              badge + '</div>';
          }
          html += '<div class="board-card-body">' +
            '<div style="font-size:13px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden">' + esc(p.text || '(No copy)') + '</div>';

          if (p.platforms.length > 0 || p.tags.length > 0) {
            html += '<div class="chip-row">';
            for (var pl = 0; pl < p.platforms.length; pl++) {
              html += '<span class="mini-chip" style="font-weight:600">' + esc(p.platforms[pl]) + '</span>';
            }
            for (var tg = 0; tg < p.tags.length; tg++) {
              html += tagChip(p.tags[tg]);
            }
            html += '</div>';
          }

          html += '<div style="display:flex;align-items:center;justify-content:space-between;font-size:11.5px;color:var(--text-soft);margin-top:2px">' +
            '<span>' + esc((p.date || 'No date') + (p.time ? ' ' + p.time : '')) + (p.createdBy ? ' · ' + esc(p.createdBy) : '') + '</span>' +
            '<div style="display:flex;align-items:center;gap:8px">' +
              (commentCounts[p.id] ? '<span>💬 ' + commentCounts[p.id] + '</span>' : '') +
              (!isPortal && p.assignee ? '<span class="avatar-circle" title="' + esc(p.assignee) + '">' + esc(initials(p.assignee)) + '</span>' : '') +
            '</div>' +
          '</div></div></div>';
        }
        html += '</div></div>';
      }
      html += '</div>';
      return html;
    }

    function onBoardDragOver(e, el) {
      e.preventDefault();
      el.classList.add('drag-over');
    }
    function onBoardDragLeave(el) {
      el.classList.remove('drag-over');
    }
    function onBoardDrop(e, newStatus) {
      e.preventDefault();
      if (e.currentTarget) e.currentTarget.classList.remove('drag-over');
      var postId = e.dataTransfer.getData('text/plain');
      if (!postId) return;
      callApi('movePost', { postId: postId, status: newStatus })
        .then(function(res) {
          upsertLocalPost(res.post, res.activity);
          renderApp();
          showToast('Moved to ' + newStatus, 'success');
        })
        .catch(function(err) { showToast(err.message, 'error'); });
    }

    /* ========================================================================
       TABLE VIEW
       ======================================================================== */
    function renderTableView(posts) {
      if (posts.length === 0) {
        return '<div class="card" style="color:var(--text-soft);text-align:center;padding:32px">No posts match your current filters.</div>';
      }
      var html = '<div class="table-wrap"><table class="data-table"><thead><tr>' +
        '<th style="width:52px">Media</th><th>Copy</th><th>Status</th><th>Platforms</th><th>Tags</th><th>Date</th><th>Time</th><th>Assignee</th><th>Added by</th>' +
      '</tr></thead><tbody>';

      for (var i = 0; i < posts.length; i++) {
        var p = posts[i];
        var tCover = postCover(p);
        var thumb = (tCover && tCover.asset.thumbUrl)
          ? '<img src="' + esc(tCover.asset.thumbUrl) + '" alt="" style="width:38px;height:38px;object-fit:cover;border-radius:6px;background:var(--surface-muted)">'
          : (tCover
            ? '<div style="width:38px;height:38px;border-radius:6px;background:#0f172a;color:#cbd5e1;display:flex;align-items:center;justify-content:center;font-size:11px">▶</div>'
            : '<div style="width:38px;height:38px;border-radius:6px;background:var(--surface-subtle);border:1px solid var(--border)"></div>');
        var tm = getTeamMember(p.assignee);
        html += '<tr class="clickable" onclick="openPostModal(\'' + esc(p.id) + '\')">' +
          '<td>' + thumb + '</td>' +
          '<td style="max-width:320px"><div style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + esc(p.text || '(No copy)') + '</div></td>' +
          '<td><span class="status-pill st-bg-' + statusClass(p.status) + '">' + esc(p.status) + '</span></td>' +
          '<td>' + esc(p.platforms.join(', ') || '—') + '</td>' +
          '<td><div class="chip-row">' + (p.tags.length ? p.tags.map(tagChip).join('') : '—') + '</div></td>' +
          '<td style="white-space:nowrap">' + esc(p.date || '—') + '</td>' +
          '<td style="white-space:nowrap">' + esc(p.time || '—') + '</td>' +
          '<td>' + esc(tm ? tm.name : (p.assignee || 'Unassigned')) + '</td>' +
          '<td style="white-space:nowrap">' + esc(p.createdBy ? p.createdBy + (p.createdByType === 'client' ? ' (client)' : '') : '—') + '</td>' +
        '</tr>';
      }
      html += '</tbody></table></div>';
      return html;
    }

    /* ========================================================================
       4. POST EDITOR MODAL (UPLOADS, PASTE, DRIVE LINK, COMMENTS, HISTORY)
       ======================================================================== */
    var EDITOR_POST = null;

    function openPostModal(postId, defaultDate) {
      var existing = null;
      if (postId) {
        for (var i = 0; i < STATE.posts.length; i++) {
          if (STATE.posts[i].id === postId) {
            existing = STATE.posts[i];
            break;
          }
        }
        if (!existing) return;
      }
      if (STATE.mode === 'portal' && !canPortalEdit(existing)) {
        if (existing) openPortalPostModal(postId);
        return;
      }

      EDITOR_POST = existing ? JSON.parse(JSON.stringify(existing)) : {
        id: '',
        clientId: STATE.selectedClientId,
        text: '',
        status: 'Draft',
        tags: [],
        platforms: [],
        date: defaultDate || STATE.today,
        time: '10:00',
        assets: [],
        refAssets: [],
        liveUrl: '',
        metrics: { reach: '', likes: '', comments: '', shares: '' },
        assignee: ''
      };
      if (!EDITOR_POST.refAssets) EDITOR_POST.refAssets = [];
      STATE.pasteTarget = STATE.mode === 'portal' ? 'ref' : 'final';
      STATE.editorDirty = false;
      STATE.activeModal = 'postEditor';
      STATE.sideTab = 'comments';
      STATE.confirmDeletePost = false;
      STATE.sidebarOpen = false;
      renderPostEditorModal();
    }

    function renderPostEditorModal() {
      var p = EDITOR_POST;
      var portal = STATE.mode === 'portal';
      var client = getClient(p.clientId);
      var parent = (!portal && client && client.parentId) ? getClient(client.parentId) : null;
      var notifyEmail = (client && client.notifyEmail) ? client.notifyEmail : (parent && parent.notifyEmail ? parent.notifyEmail : '');

      var statuses = ['Draft', 'In Review', 'Approved', 'Scheduled', 'Published'];
      var platforms = ['Instagram', 'Facebook', 'LinkedIn', 'TikTok', 'YouTube', 'X'];

      var hint = '';
      if (portal && !p.id) {
        hint = '<div class="info-note">Your post is saved as a <strong>Draft</strong> and the agency team is notified by email.</div>';
      } else if (!portal && p.status === 'In Review') {
        hint = notifyEmail
          ? '<div style="background:var(--warn-bg);border:1px solid var(--warn-border);color:var(--warn-text);padding:8px 12px;border-radius:var(--radius);font-size:12.5px">Saving in <strong>In Review</strong> will email the client portal link to <strong>' + esc(notifyEmail) + '</strong>.</div>'
          : '<div style="background:var(--warn-bg);border:1px solid var(--warn-border);color:var(--warn-text);padding:8px 12px;border-radius:var(--radius);font-size:12.5px">No client notification email is set for ' + esc(client ? client.name : 'this client') + '. You can still share the portal link manually.</div>';
      }

      var portalCanEdit = canPortalEdit(p);
      var refSection = assetSectionHtml('ref', p, !portal || portalCanEdit);
      var finalSection = assetSectionHtml('final', p, !portal);

      var publishedHtml = '';
      if (!portal && p.status === 'Published') {
        var m = p.metrics || {};
        publishedHtml = '<div style="background:var(--surface-subtle);border:1px solid var(--border);border-radius:var(--radius);padding:12px">' +
          '<div style="margin-bottom:10px"><label class="field-label">Live post URL</label><input type="url" value="' + esc(p.liveUrl) + '" placeholder="https://instagram.com/p/..." oninput="syncEditorField(\'liveUrl\', this.value)"></div>' +
          '<div class="grid-4">' +
            '<div><label class="field-label">Reach</label><input type="number" value="' + esc(m.reach) + '" oninput="syncEditorMetric(\'reach\', this.value)"></div>' +
            '<div><label class="field-label">Likes</label><input type="number" value="' + esc(m.likes) + '" oninput="syncEditorMetric(\'likes\', this.value)"></div>' +
            '<div><label class="field-label">Comments</label><input type="number" value="' + esc(m.comments) + '" oninput="syncEditorMetric(\'comments\', this.value)"></div>' +
            '<div><label class="field-label">Shares</label><input type="number" value="' + esc(m.shares) + '" oninput="syncEditorMetric(\'shares\', this.value)"></div>' +
          '</div>' +
        '</div>';
      }

      var brandPicker = '';
      if (portal && !p.id && STATE.clients.length > 1) {
        brandPicker = '<div><label class="field-label">Brand</label><select onchange="syncEditorField(\'clientId\', this.value)">' +
          STATE.clients.map(function(c) { return '<option value="' + esc(c.id) + '" ' + (c.id === p.clientId ? 'selected' : '') + '>' + esc(c.name) + '</option>'; }).join('') +
        '</select></div>';
      }

      var statusField = portal
        ? '<div><label class="field-label">Status</label><div style="padding:7px 0"><span class="status-pill st-bg-' + statusClass(p.status) + '">' + esc(p.status) + '</span></div></div>'
        : '<div><label class="field-label">Status</label><select onchange="syncEditorField(\'status\', this.value);renderPostEditorModal()">' +
            statuses.map(function(s) { return '<option value="' + esc(s) + '" ' + (p.status === s ? 'selected' : '') + '>' + esc(s) + '</option>'; }).join('') +
          '</select></div>' +
          '<div><label class="field-label">Assignee</label><select onchange="syncEditorField(\'assignee\', this.value)">' +
            '<option value="">Unassigned</option>' +
            STATE.team.map(function(tm) { return '<option value="' + esc(tm.email) + '" ' + (p.assignee === tm.email ? 'selected' : '') + '>' + esc(tm.name) + '</option>'; }).join('') +
          '</select></div>';

      var decisionBox = '';
      if (portal && p.id && p.status === 'In Review') {
        decisionBox = '<div style="background:var(--warn-bg);border:1px solid var(--warn-border);border-radius:var(--radius);padding:12px">' +
          '<div style="font-weight:700;margin-bottom:8px;color:var(--warn-text)">This post is ready for your approval</div>' +
          '<textarea id="portal-decision-comment" rows="2" placeholder="Optional note (required if requesting changes)…" style="margin-bottom:8px;min-height:60px"></textarea>' +
          '<div style="display:flex;gap:8px;flex-wrap:wrap">' +
            '<button type="button" class="btn-primary" style="background:var(--st-published);border-color:var(--st-published)" onclick="submitPortalDecision(\'' + esc(p.id) + '\', \'approve\')">Approve post</button>' +
            '<button type="button" onclick="submitPortalDecision(\'' + esc(p.id) + '\', \'changes\')">Request changes</button>' +
          '</div>' +
        '</div>';
      }

      var sidePanelHtml = '';
      if (p.id) {
        var postComments = STATE.comments.filter(function(c) { return c.postId === p.id; });
        var postActivity = portal ? [] : STATE.activity.filter(function(ac) { return ac.postId === p.id; }).slice().reverse();
        var sideTab = portal ? 'comments' : STATE.sideTab;

        sidePanelHtml = '<div class="editor-side">' +
          (portal
            ? '<h4 style="margin:0 0 10px 0">Comments (' + postComments.length + ')</h4>'
            : '<div class="sub-tabs" style="margin-bottom:12px">' +
                '<button type="button" class="sub-tab ' + (sideTab === 'comments' ? 'active' : '') + '" onclick="STATE.sideTab=\'comments\';renderPostEditorModal()">Comments (' + postComments.length + ')</button>' +
                '<button type="button" class="sub-tab ' + (sideTab === 'history' ? 'active' : '') + '" onclick="STATE.sideTab=\'history\';renderPostEditorModal()">History (' + postActivity.length + ')</button>' +
              '</div>');

        if (sideTab === 'comments') {
          sidePanelHtml += '<div style="flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px;margin-bottom:10px">';
          if (postComments.length === 0) {
            sidePanelHtml += '<div style="color:var(--text-soft);font-size:13px">No comments yet.</div>';
          } else {
            for (var cm = 0; cm < postComments.length; cm++) {
              var cObj = postComments[cm];
              sidePanelHtml += '<div style="background:var(--surface-subtle);border:1px solid var(--border);border-radius:var(--radius);padding:8px 10px;font-size:13px">' +
                '<div style="display:flex;justify-content:space-between;gap:8px;font-size:11.5px;color:var(--text-soft);margin-bottom:4px">' +
                  '<strong>' + esc(cObj.author) + ' (' + esc(cObj.role) + ')</strong>' +
                  '<span>' + esc(fmtStamp(cObj.createdAt)) + '</span>' +
                '</div>' +
                '<div style="white-space:pre-wrap">' + esc(cObj.text) + '</div>' +
              '</div>';
            }
          }
          sidePanelHtml += '</div>' +
            '<div style="display:flex;gap:6px">' +
              '<input type="text" id="new-comment-input" placeholder="Write a comment…" onkeydown="if(event.key===\'Enter\'){event.preventDefault();submitPostComment();}">' +
              '<button type="button" onclick="submitPostComment()">Post</button>' +
            '</div>';
        } else {
          sidePanelHtml += '<div style="flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px">';
          for (var ha = 0; ha < postActivity.length; ha++) {
            var act = postActivity[ha];
            sidePanelHtml += '<div style="font-size:12.5px;border-bottom:1px solid var(--border);padding-bottom:6px">' +
              '<div><strong>' + esc(act.actor) + '</strong> ' + esc(act.action) + '</div>' +
              (act.details ? '<div style="color:var(--text-muted)">' + esc(act.details) + '</div>' : '') +
              '<div style="font-size:11px;color:var(--text-soft)">' + esc(fmtStamp(act.createdAt)) + '</div>' +
            '</div>';
          }
          sidePanelHtml += '</div>';
        }
        sidePanelHtml += '</div>';
      }

      var canDelete = p.id && (!portal || p.createdByType === 'client');
      var title = p.id ? 'Edit post' : (portal ? 'Add a post' : 'Create post');

      var root = document.getElementById('modal-root');
      root.innerHTML = '<div class="modal-backdrop' + modalEnterCls() + '" onclick="if(event.target===this)closeModal(false)">' +
        '<div class="modal-box ' + (p.id ? 'modal-xl' : '') + '">' +
          '<div class="modal-header">' +
            '<div style="display:flex;flex-direction:column;gap:4px;min-width:0">' +
              '<h3 style="display:flex;align-items:center;gap:8px">' + (client ? clientDot(client) : '') + title + (client ? ' — ' + esc(client.name) : '') + '</h3>' +
              (p.id ? postMetaHtml(p) : '') +
            '</div>' +
            '<button type="button" class="btn-sm btn-ghost" onclick="closeModal(true)" aria-label="Close">✕</button>' +
          '</div>' +
          '<div class="modal-body">' +
            '<div class="' + (p.id ? 'editor-split' : '') + '">' +
              '<div style="display:flex;flex-direction:column;gap:14px">' +
                decisionBox +
                brandPicker +
                '<div>' +
                  '<label class="field-label">Post copy</label>' +
                  '<textarea rows="4" placeholder="Write your post caption, hooks, and hashtags…" oninput="syncEditorField(\'text\', this.value)">' + esc(p.text) + '</textarea>' +
                '</div>' +
                refSection +
                finalSection +
                '<div>' +
                  '<label class="field-label">Platforms</label>' +
                  '<div style="display:flex;flex-wrap:wrap;gap:6px">' +
                    platforms.map(function(pl) {
                      var active = p.platforms.indexOf(pl) !== -1;
                      return '<button type="button" class="btn-sm ' + (active ? 'btn-primary' : '') + '" aria-pressed="' + active + '" onclick="toggleEditorPlatform(\'' + esc(pl) + '\')">' + esc(pl) + '</button>';
                    }).join('') +
                  '</div>' +
                '</div>' +
                '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px">' +
                  statusField +
                  '<div><label class="field-label">Date</label><input type="date" value="' + esc(p.date) + '" oninput="syncEditorField(\'date\', this.value)"></div>' +
                  '<div><label class="field-label">Time</label><input type="time" value="' + esc(p.time) + '" oninput="syncEditorField(\'time\', this.value)"></div>' +
                '</div>' +
                '<div>' + renderTagPicker(p) + '</div>' +
                hint +
                publishedHtml +
              '</div>' +
              sidePanelHtml +
            '</div>' +
          '</div>' +
          '<div class="modal-footer">' +
            '<div>' +
              (canDelete ? (STATE.confirmDeletePost
                ? '<button type="button" class="btn-danger" onclick="confirmDeletePostNow()">Click again to permanently delete</button>'
                : '<button type="button" style="color:var(--danger)" onclick="STATE.confirmDeletePost=true;renderPostEditorModal()">Delete post</button>') : '') +
            '</div>' +
            '<div style="display:flex;gap:8px">' +
              '<button type="button" onclick="closeModal(true)">Cancel</button>' +
              '<button type="button" class="btn-primary" id="save-post-btn" onclick="saveEditorPost()">' + (portal && !p.id ? 'Add post' : 'Save post') + '</button>' +
            '</div>' +
          '</div>' +
        '</div>' +
      '</div>';
    }

    /* Media section: 'ref' = reference images (brief), 'final' = finished design */
    function assetSectionHtml(kind, p, editable) {
      var list = kind === 'ref' ? (p.refAssets || []) : (p.assets || []);
      var title = kind === 'ref' ? '🖼️ Reference images' : '✅ Final design';
      var help = kind === 'ref'
        ? 'Brief, inspiration, logos or photos to work from.'
        : 'The finished artwork, uploaded once the work is done. This is what the client approves.';

      var strip = '';
      if (list.length) {
        strip = '<div class="asset-strip">';
        for (var a = 0; a < list.length; a++) {
          var ast = list[a];
          strip += '<div class="asset-card">' +
            '<a href="' + esc(ast.viewUrl) + '" target="_blank" rel="noopener">' +
              (ast.thumbUrl ? '<img src="' + esc(ast.thumbUrl) + '" alt="' + esc(ast.name) + '">' : '<div class="video-placeholder">▶ Video</div>') +
            '</a>' +
            (editable
              ? '<div class="asset-card-controls">' +
                  '<button type="button" class="btn-sm" onclick="moveEditorAsset(\'' + kind + '\', ' + a + ', -1)" ' + (a === 0 ? 'disabled' : '') + ' title="Move earlier">‹</button>' +
                  '<span style="font-size:11px;color:var(--text-soft);align-self:center">' + (a + 1) + '/' + list.length + '</span>' +
                  '<button type="button" class="btn-sm" onclick="moveEditorAsset(\'' + kind + '\', ' + a + ', 1)" ' + (a === list.length - 1 ? 'disabled' : '') + ' title="Move later">›</button>' +
                  '<button type="button" class="btn-sm" style="color:var(--danger)" onclick="removeEditorAsset(\'' + kind + '\', ' + a + ')" title="Remove">✕</button>' +
                '</div>'
              : '') +
          '</div>';
        }
        strip += '</div>';
      }

      var upload = '';
      if (editable) {
        upload = '<div class="dropzone" id="asset-dropzone-' + kind + '" onmouseenter="STATE.pasteTarget=\'' + kind + '\'" onclick="STATE.pasteTarget=\'' + kind + '\';document.getElementById(\'asset-file-input-' + kind + '\').click()" ondragover="event.preventDefault();this.classList.add(\'drag-active\')" ondragleave="this.classList.remove(\'drag-active\')" ondrop="handleAssetDrop(event, \'' + kind + '\')">' +
            '<input type="file" id="asset-file-input-' + kind + '" multiple accept="image/*,video/*" style="display:none" onchange="handleAssetFiles(this.files, \'' + kind + '\')">' +
            '<div id="upload-status-label-' + kind + '" style="font-weight:600;color:var(--text-muted);font-size:13px">Tap to upload, drag files here, or paste an image</div>' +
          '</div>' +
          '<div style="display:flex;gap:6px">' +
            '<input type="text" id="drive-link-input-' + kind + '" placeholder="Or paste a Google Drive link (shared as &quot;Anyone with the link&quot;)…">' +
            '<button type="button" class="btn-sm" onclick="addDriveLinkAsset(\'' + kind + '\')" style="white-space:nowrap">Add link</button>' +
          '</div>';
      } else if (!list.length) {
        upload = '<div class="asset-empty">' + (kind === 'final' ? 'The final design hasn’t been uploaded yet.' : 'No reference images.') + '</div>';
      }

      return '<div class="asset-section asset-' + kind + '">' +
        '<div class="asset-head"><span class="asset-title">' + title + (list.length ? ' <span class="mini-chip">' + list.length + '</span>' : '') + '</span>' +
        '<span class="asset-help">' + help + (editable ? ' Images are compressed automatically; max 20 MB per file.' : '') + '</span></div>' +
        upload + strip +
      '</div>';
    }

    function editorAssetList(kind) {
      if (kind === 'ref') {
        if (!EDITOR_POST.refAssets) EDITOR_POST.refAssets = [];
        return EDITOR_POST.refAssets;
      }
      return EDITOR_POST.assets;
    }

    /* Tag picker: one-click library tags plus free-typed extras */
    function renderTagPicker(p) {
      var lib = STATE.tags || [];
      var selected = p.tags || [];
      var lowerSel = selected.map(function(t) { return t.toLowerCase(); });
      var lowerLib = lib.map(function(t) { return t.name.toLowerCase(); });
      var html = '<label class="field-label">Tags</label><div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px">';
      for (var i = 0; i < lib.length; i++) {
        var on = lowerSel.indexOf(lib[i].name.toLowerCase()) !== -1;
        html += '<button type="button" class="tag-chip' + (on ? '' : ' off') + '"' + (lib[i].color ? ' style="--c:' + esc(lib[i].color) + '"' : '') +
          ' aria-pressed="' + on + '" onclick="toggleLibraryTag(' + i + ')">' + esc(lib[i].name) + '</button>';
      }
      for (var j = 0; j < selected.length; j++) {
        if (lowerLib.indexOf(selected[j].toLowerCase()) !== -1) continue;
        html += '<button type="button" class="tag-chip" title="Remove tag" onclick="removeEditorTag(' + j + ')">' + esc(selected[j]) + ' <span class="x">✕</span></button>';
      }
      if (!lib.length && !selected.length) {
        html += '<span style="font-size:12.5px;color:var(--text-soft)">No tags yet.' + (STATE.mode === 'agency' && STATE.isBilling ? ' Create reusable tags in Settings → Tags.' : '') + '</span>';
      }
      html += '</div><input type="text" id="custom-tag-input" placeholder="Type another tag and press Enter" onkeydown="if(event.key===\'Enter\'||event.key===\',\'){event.preventDefault();addCustomTag(this.value);}">';
      return html;
    }

    function toggleLibraryTag(i) {
      var tag = (STATE.tags || [])[i];
      if (!tag || !EDITOR_POST) return;
      var lower = tag.name.toLowerCase();
      var idx = -1;
      for (var k = 0; k < EDITOR_POST.tags.length; k++) {
        if (EDITOR_POST.tags[k].toLowerCase() === lower) idx = k;
      }
      if (idx === -1) EDITOR_POST.tags.push(tag.name);
      else EDITOR_POST.tags.splice(idx, 1);
      STATE.editorDirty = true;
      renderPostEditorModal();
    }

    function removeEditorTag(j) {
      if (!EDITOR_POST) return;
      EDITOR_POST.tags.splice(j, 1);
      STATE.editorDirty = true;
      renderPostEditorModal();
    }

    function addCustomTag(value) {
      if (!EDITOR_POST) return;
      var lowerSel = EDITOR_POST.tags.map(function(t) { return t.toLowerCase(); });
      String(value || '').split(',').forEach(function(raw) {
        var t = raw.trim().replace(/\s+/g, ' ').slice(0, 40);
        if (t && lowerSel.indexOf(t.toLowerCase()) === -1) {
          EDITOR_POST.tags.push(t);
          lowerSel.push(t.toLowerCase());
        }
      });
      STATE.editorDirty = true;
      renderPostEditorModal();
      var inp = document.getElementById('custom-tag-input');
      if (inp) inp.focus();
    }

    function syncEditorField(k, v) {
      if (!EDITOR_POST) return;
      EDITOR_POST[k] = v;
      STATE.editorDirty = true;
    }
    function syncEditorTags(val) {
      if (!EDITOR_POST) return;
      EDITOR_POST.tags = String(val || '').split(',').map(function(t) { return t.trim(); }).filter(Boolean);
      STATE.editorDirty = true;
    }
    function syncEditorMetric(k, v) {
      if (!EDITOR_POST) return;
      if (!EDITOR_POST.metrics) EDITOR_POST.metrics = {};
      EDITOR_POST.metrics[k] = v;
      STATE.editorDirty = true;
    }
    function toggleEditorPlatform(pl) {
      if (!EDITOR_POST) return;
      var idx = EDITOR_POST.platforms.indexOf(pl);
      if (idx === -1) EDITOR_POST.platforms.push(pl);
      else EDITOR_POST.platforms.splice(idx, 1);
      STATE.editorDirty = true;
      renderPostEditorModal();
    }
    function moveEditorAsset(kind, idx, dir) {
      var list = editorAssetList(kind);
      var target = idx + dir;
      if (target < 0 || target >= list.length) return;
      var tmp = list[idx];
      list[idx] = list[target];
      list[target] = tmp;
      STATE.editorDirty = true;
      renderPostEditorModal();
    }

    function removeEditorAsset(kind, idx) {
      editorAssetList(kind).splice(idx, 1);
      STATE.editorDirty = true;
      renderPostEditorModal();
    }

    function handleAssetDrop(e, kind) {
      e.preventDefault();
      var dz = document.getElementById('asset-dropzone-' + kind);
      if (dz) dz.classList.remove('drag-active');
      if (e.dataTransfer && e.dataTransfer.files) {
        handleAssetFiles(e.dataTransfer.files, kind);
      }
    }

    function handleAssetFiles(fileList, kind) {
      if (!fileList || fileList.length === 0 || !EDITOR_POST) return;
      kind = kind === 'ref' ? 'ref' : 'final';
      var files = Array.prototype.slice.call(fileList);
      var labelId = 'upload-status-label-' + kind;
      var setLabel = function(text) {
        var lbl = document.getElementById(labelId);
        if (lbl) lbl.textContent = text;
      };

      var seq = Promise.resolve();
      files.forEach(function(file, idx) {
        seq = seq.then(function() {
          if (file.type.indexOf('image/') !== 0 && file.type.indexOf('video/') !== 0) {
            showToast('Rejected "' + file.name + '": only images and videos are allowed.', 'error');
            return;
          }
          var prefix = (files.length > 1 ? (idx + 1) + ' of ' + files.length + ': ' : '');
          setLabel(prefix + (file.type.indexOf('image/') === 0 ? 'Compressing ' : 'Preparing ') + file.name + '…');
          return compressImage(file).then(function(ready) {
            if (ready.size > 20 * 1024 * 1024) {
              showToast('Rejected "' + file.name + '": exceeds 20 MB limit.', 'error');
              return;
            }
            if (ready !== file) {
              showToast('Compressed ' + file.name + ': ' + formatBytes(file.size) + ' → ' + formatBytes(ready.size), 'success');
            }
            setLabel(prefix + 'Uploading ' + ready.name + '…');
            return callApi('createUpload', {
              clientId: EDITOR_POST.clientId,
              name: ready.name,
              mimeType: ready.type,
              size: ready.size
            }).then(function(res) {
              return uploadToSignedUrl(res.uploadUrl, ready).then(function() { return res; });
            }).then(function(res) {
              if (!EDITOR_POST) return;
              editorAssetList(kind).push(res.asset);
              STATE.editorDirty = true;
              renderPostEditorModal();
            });
          }).catch(function(err) {
            showToast(err.message, 'error');
          });
        });
      });
      seq.then(function() {
        setLabel('Tap to upload, drag files here, or paste an image');
      });
    }

    function uploadToSignedUrl(url, file) {
      var fd = new FormData();
      fd.append('cacheControl', '3600');
      fd.append('', file);
      return fetch(url, { method: 'PUT', body: fd, headers: { 'x-upsert': 'false' } })
        .catch(function() {
          throw new Error('Upload of "' + file.name + '" failed. Check your connection and try again.');
        })
        .then(function(r) {
          if (r.ok) return;
          return r.text().then(function(t) {
            throw new Error('Upload of "' + file.name + '" failed (HTTP ' + r.status + ')' + (t ? ': ' + t.substring(0, 160) : '.'));
          });
        });
    }

    // Paste image support inside Post Editor
    window.addEventListener('paste', function(e) {
      if (STATE.activeModal !== 'postEditor' || !EDITOR_POST) return;
      var items = (e.clipboardData && e.clipboardData.items) ? e.clipboardData.items : [];
      var files = [];
      for (var i = 0; i < items.length; i++) {
        if (items[i].kind === 'file') {
          var f = items[i].getAsFile();
          if (f) files.push(f);
        }
      }
      if (files.length > 0) {
        var target = STATE.pasteTarget === 'ref' ? 'ref' : 'final';
        if (STATE.mode === 'portal') target = 'ref';
        handleAssetFiles(files, target);
      }
    });

    function addDriveLinkAsset(kind) {
      var inp = document.getElementById('drive-link-input-' + kind);
      var val = inp ? inp.value.trim() : '';
      if (!val) return;
      inp.disabled = true;
      callApi('resolveDriveLink', { url: val })
        .then(function(res) {
          editorAssetList(kind).push(res.asset);
          STATE.editorDirty = true;
          renderPostEditorModal();
          showToast('Added Drive file', 'success');
        })
        .catch(function(err) {
          inp.disabled = false;
          showToast(err.message, 'error');
        });
    }

    function saveEditorPost() {
      var btn = document.getElementById('save-post-btn');
      if (btn) { btn.disabled = true; btn.textContent = 'Saving…'; }
      callApi('savePost', EDITOR_POST, true)
        .then(function(res) {
          upsertLocalPost(res.post, res.activity);
          if (res.clientToken) {
            var cli = getClient(res.post.clientId);
            if (cli) { cli.token = res.clientToken; cli.hasToken = true; }
          }
          closeModal(true);
          renderApp();
          showToast(STATE.mode === 'portal' ? 'Post saved. The agency team has been notified.' : 'Post saved', 'success');
        })
        .catch(function(err) {
          if (btn) { btn.disabled = false; btn.textContent = 'Save post'; }
          showToast(err.message, 'error');
        });
    }

    function confirmDeletePostNow() {
      if (!EDITOR_POST || !EDITOR_POST.id) return;
      callApi('deletePost', { postId: EDITOR_POST.id })
        .then(function(res) {
          STATE.posts = STATE.posts.filter(function(p) { return p.id !== res.deletedId; });
          if (res.activity) STATE.activity.push(res.activity);
          closeModal(true);
          renderApp();
          showToast('Post deleted', 'success');
        })
        .catch(function(err) { showToast(err.message, 'error'); });
    }

    function submitPostComment() {
      var inp = document.getElementById('new-comment-input');
      var txt = inp ? inp.value.trim() : '';
      if (!txt || !EDITOR_POST || !EDITOR_POST.id) return;
      inp.disabled = true;
      callApi('addComment', { postId: EDITOR_POST.id, text: txt })
        .then(function(res) {
          STATE.comments.push(res.comment);
          if (res.activity) STATE.activity.push(res.activity);
          renderPostEditorModal();
        })
        .catch(function(err) {
          inp.disabled = false;
          showToast(err.message, 'error');
        });
    }

    function upsertLocalPost(post, activity) {
      var found = false;
      for (var i = 0; i < STATE.posts.length; i++) {
        if (STATE.posts[i].id === post.id) {
          STATE.posts[i] = post;
          found = true;
          break;
        }
      }
      if (!found) STATE.posts.push(post);
      if (activity) STATE.activity.push(activity);
    }

    /* ========================================================================
       CLIENT SHARING & PORTAL
       ======================================================================== */
    function openShareModal(clientId) {
      var client = getClient(clientId);
      if (!client) return;
      STATE.activeModal = 'share';
      var fullLink = client.token ? portalUrl(client.token) : '';
      var access = client.portalAccess === 'edit' ? 'edit' : 'view';
      var cid = esc(client.id);

      var accessHtml = '<div><label class="field-label">People with this link can</label>' +
        '<div class="seg" role="group" aria-label="Link access">' +
          '<button type="button" class="' + (access === 'view' ? 'active' : '') + '" aria-pressed="' + (access === 'view') + '" onclick="setShareAccess(\'' + cid + '\', \'view\')">👁 View &amp; approve</button>' +
          '<button type="button" class="' + (access === 'edit' ? 'active' : '') + '" aria-pressed="' + (access === 'edit') + '" onclick="setShareAccess(\'' + cid + '\', \'edit\')">✏️ Add &amp; edit</button>' +
        '</div>' +
        '<p style="margin:8px 0 0 0;font-size:12.5px;color:var(--text-muted)">' +
          (access === 'edit'
            ? 'Clients can add posts, upload media and edit posts until they are Scheduled. They can delete only posts they added, and they can still approve or request changes.'
            : 'Clients can see the calendar and board, comment, and approve or request changes.') +
        '</p></div>';

      var root = document.getElementById('modal-root');
      root.innerHTML = '<div class="modal-backdrop' + modalEnterCls() + '" onclick="if(event.target===this)closeModal(true)">' +
        '<div class="modal-box">' +
          '<div class="modal-header">' +
            '<h3 style="display:flex;align-items:center;gap:8px">' + clientDot(client) + 'Share client portal — ' + esc(client.name) + '</h3>' +
            '<button class="btn-sm btn-ghost" onclick="closeModal(true)" aria-label="Close">✕</button>' +
          '</div>' +
          '<div class="modal-body" style="display:flex;flex-direction:column;gap:16px">' +
            '<p style="margin:0;color:var(--text-muted);font-size:13.5px">' +
              (!client.parentId
                ? 'This parent link opens all active sub-clients under <strong>' + esc(client.name) + '</strong>.'
                : 'This link opens only <strong>' + esc(client.name) + '</strong>.') +
            '</p>' +
            accessHtml +
            (client.token
              ? '<div><label class="field-label">Client portal link</label>' +
                '<div style="display:flex;gap:8px;flex-wrap:wrap"><input type="text" id="share-url-input" readonly value="' + esc(fullLink) + '" style="flex:1 1 220px">' +
                '<button type="button" onclick="copyShareLink()">Copy</button>' +
                '<a href="' + esc(fullLink) + '" target="_blank" rel="noopener" class="btn-primary" style="text-decoration:none;padding:7px 13px;border-radius:var(--radius);font-weight:500;white-space:nowrap">Open client view</a></div></div>' +
                '<div style="display:flex;gap:8px;flex-wrap:wrap">' +
                  '<button type="button" onclick="manageToken(\'' + cid + '\', \'rotate\')">Make a new link</button>' +
                  '<button type="button" style="color:var(--danger)" onclick="manageToken(\'' + cid + '\', \'disable\')">Turn off link</button>' +
                '</div>'
              : '<div><button type="button" class="btn-primary" onclick="manageToken(\'' + cid + '\', \'create\')">Create share link</button></div>'
            ) +
          '</div>' +
          '<div class="modal-footer"><span></span><button onclick="closeModal(true)">Done</button></div>' +
        '</div>' +
      '</div>';
    }

    function setShareAccess(clientId, access) {
      var c = getClient(clientId);
      if (!c || c.portalAccess === access) return;
      var prev = c.portalAccess;
      c.portalAccess = access;
      openShareModal(clientId);
      callApi('setPortalAccess', { clientId: clientId, access: access })
        .then(function() {
          showToast(access === 'edit' ? 'Link can now add & edit posts' : 'Link is now view & approve only', 'success');
        })
        .catch(function(err) {
          c.portalAccess = prev;
          openShareModal(clientId);
          showToast(err.message, 'error');
        });
    }

    function copyShareLink() {
      var inp = document.getElementById('share-url-input');
      if (!inp) return;
      inp.select();
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(inp.value).then(function() { showToast('Portal link copied', 'success'); });
      } else {
        document.execCommand('copy');
        showToast('Portal link copied', 'success');
      }
    }

    function manageToken(clientId, mode) {
      callApi('manageClientToken', { clientId: clientId, mode: mode })
        .then(function(res) {
          var c = getClient(clientId);
          if (c) { c.token = res.token; c.hasToken = Boolean(res.token); c.portalAccess = res.portalAccess || c.portalAccess; }
          if (res.webAppUrl) STATE.webAppUrl = res.webAppUrl;
          openShareModal(clientId);
          showToast(mode === 'disable' ? 'Share link turned off' : 'Share link ready', 'success');
        })
        .catch(function(err) { showToast(err.message, 'error'); });
    }

    function renderPortalWorkspace() {
      var currentClient = getClient(STATE.selectedClientId) || STATE.clients[0];
      var clientPosts = currentClient ? STATE.posts.filter(function(p) { return p.clientId === currentClient.id; }) : [];
      var waitingCount = clientPosts.filter(function(p) { return p.status === 'In Review'; }).length;

        '<div class="topbar-right">' +
          themeButtonHtml() +
          '<div class="sub-tabs">' +
            '<button class="sub-tab ' + (STATE.subView === 'calendar' ? 'active' : '') + '" onclick="setSubView(\'calendar\')">Calendar</button>' +
            '<button class="sub-tab ' + (STATE.subView === 'board' ? 'active' : '') + '" onclick="setSubView(\'board\')">Board</button>' +
          '</div>' +
          (canEdit ? '<button class="btn-primary" onclick="openPostModal(null, \'' + esc(STATE.today) + '\')">+ New post</button>' : '') +
        '</div>' +
      '</header>' +
      '<main class="main-area" style="max-width:1440px;margin:0 auto">' +
        bannerHtml +
        renderContentFilterBar(clientPosts, filtered.length, true) +
        (STATE.subView === 'board' ? renderBoardView(filtered, true) : renderCalendarView(filtered, true)) +
