    function openPortalPostModal(postId) {
      var p = null;
      for (var i = 0; i < STATE.posts.length; i++) {
        if (STATE.posts[i].id === postId) { p = STATE.posts[i]; break; }
      }
      if (!p) return;
      STATE.activeModal = 'portalViewer';
      STATE.portalPostId = postId;

      var mediaHtml = '';
      var mediaBlock = function(list) {
        var out = '<div style="display:flex;flex-direction:column;gap:12px;margin-bottom:14px">';
        for (var a = 0; a < list.length; a++) {
          var ast = list[a];
          if (ast.src === 'storage' && ast.type === 'video') {
            out += '<video src="' + esc(ast.viewUrl) + '" controls preload="metadata" playsinline style="width:100%;max-height:420px;border-radius:var(--radius);background:#000"></video>';
          } else if (ast.type === 'video' || ast.type === 'link') {
            out += '<iframe src="' + esc(ast.previewUrl) + '" style="width:100%;height:320px;border:none;border-radius:var(--radius);background:#000" allow="autoplay"></iframe>';
          } else {
            out += '<a href="' + esc(ast.viewUrl) + '" target="_blank" rel="noopener"><img src="' + esc(ast.thumbUrl) + '" alt="' + esc(ast.name) + '" style="max-width:100%;max-height:380px;border-radius:var(--radius);display:block;margin:0 auto"></a>';
          }
        }
        return out + '</div>';
      };
      var hasRef = p.refAssets && p.refAssets.length > 0;
      if (p.assets && p.assets.length > 0) {
        mediaHtml += (hasRef ? '<div class="asset-title" style="margin-bottom:8px">✅ Final design</div>' : '') + mediaBlock(p.assets);
      }
      if (hasRef) {
        mediaHtml += '<div class="asset-title" style="margin-bottom:8px">🖼️ Reference images</div>' + mediaBlock(p.refAssets);
      }

      var postComments = STATE.comments.filter(function(c) { return c.postId === p.id; });
      var commentsHtml = '';
      for (var cm = 0; cm < postComments.length; cm++) {
        var cObj = postComments[cm];
        commentsHtml += '<div style="background:var(--surface-subtle);border:1px solid var(--border);border-radius:var(--radius);padding:8px 10px;font-size:13px">' +
          '<div style="display:flex;justify-content:space-between;font-size:11.5px;color:var(--text-soft);margin-bottom:4px">' +
            '<strong>' + esc(cObj.author) + '</strong><span>' + esc(cObj.createdAt.replace('T', ' ').substring(0, 16)) + '</span>' +
          '</div>' +
          '<div style="white-space:pre-wrap">' + esc(cObj.text) + '</div>' +
        '</div>';
      }

      var decisionBox = '';
      if (p.status === 'In Review') {
        decisionBox = '<div style="background:var(--warn-bg);border:1px solid var(--warn-border);border-radius:var(--radius);padding:12px;margin-top:14px">' +
          '<div style="font-weight:700;margin-bottom:8px;color:var(--warn-text)">This post is ready for your approval</div>' +
          '<textarea id="portal-decision-comment" rows="2" placeholder="Optional note (required if requesting changes)…" style="margin-bottom:8px"></textarea>' +
          '<div style="display:flex;gap:8px">' +
            '<button type="button" class="btn-primary" style="background:var(--st-published);border-color:var(--st-published)" onclick="submitPortalDecision(\'' + esc(p.id) + '\', \'approve\')">Approve post</button>' +
            '<button type="button" onclick="submitPortalDecision(\'' + esc(p.id) + '\', \'changes\')">Request changes</button>' +
          '</div>' +
        '</div>';
      }

      var root = document.getElementById('modal-root');
      root.innerHTML = '<div class="modal-backdrop' + modalEnterCls() + '" onclick="if(event.target===this)closeModal(true)">' +
        '<div class="modal-box modal-xl">' +
          '<div class="modal-header">' +
            '<div style="display:flex;flex-direction:column;gap:4px;min-width:0">' +
              '<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">' +
                '<span class="status-pill st-bg-' + statusClass(p.status) + '">' + esc(p.status) + '</span>' +
                '<strong>' + esc((p.date || 'Unscheduled') + (p.time ? ' at ' + p.time : '')) + '</strong>' +
              '</div>' +
              postMetaHtml(p) +
            '</div>' +
            '<button class="btn-sm btn-ghost" onclick="closeModal(true)">✕</button>' +
          '</div>' +
          '<div class="modal-body"><div class="editor-split">' +
            '<div>' +
              mediaHtml +
              '<div style="white-space:pre-wrap;font-size:14.5px;background:var(--surface-subtle);padding:14px;border-radius:var(--radius);border:1px solid var(--border)">' + esc(p.text || '(No copy)') + '</div>' +
              '<div class="chip-row" style="margin-top:12px">' +
                p.platforms.map(function(pl) { return '<span class="mini-chip"><strong>' + esc(pl) + '</strong></span>'; }).join('') +
                p.tags.map(tagChip).join('') +
              '</div>' +
              (p.liveUrl ? '<div style="margin-top:10px"><a href="' + esc(p.liveUrl) + '" target="_blank" rel="noopener" style="color:var(--accent);font-weight:600">View live published post ↗</a></div>' : '') +
              decisionBox +
            '</div>' +
            '<div class="editor-side">' +
              '<h4 style="margin:0 0 10px 0">Comments (' + postComments.length + ')</h4>' +
              '<div style="flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px;margin-bottom:10px">' +
                (commentsHtml || '<div style="color:var(--text-soft)">No comments yet.</div>') +
              '</div>' +
              '<div style="display:flex;gap:6px">' +
                '<input type="text" id="portal-comment-input" placeholder="Add a comment…" onkeydown="if(event.key===\'Enter\'){event.preventDefault();submitPortalComment(\'' + esc(p.id) + '\');}">' +
                '<button type="button" onclick="submitPortalComment(\'' + esc(p.id) + '\')">Send</button>' +
              '</div>' +
            '</div>' +
          '</div></div>' +
        '</div>' +
      '</div>';
    }

    function submitPortalComment(postId) {
      var inp = document.getElementById('portal-comment-input');
      var txt = inp ? inp.value.trim() : '';
      if (!txt) return;
      inp.disabled = true;
      callApi('addComment', { postId: postId, text: txt })
        .then(function(res) {
          STATE.comments.push(res.comment);
          openPortalPostModal(postId);
        })
        .catch(function(err) {
          inp.disabled = false;
          showToast(err.message, 'error');
        });
    }

    function submitPortalDecision(postId, decision) {
      var box = document.getElementById('portal-decision-comment');
      var comment = box ? box.value.trim() : '';
      if (decision === 'changes' && !comment) {
        showToast('Please enter a comment explaining the changes needed.', 'error');
        return;
      }
      callApi('clientDecision', { postId: postId, decision: decision, comment: comment })
        .then(function(res) {
          upsertLocalPost(res.post, null);
          if (res.comment) STATE.comments.push(res.comment);
          closeModal(true);
          renderApp();
          showToast(decision === 'approve' ? 'Post approved!' : 'Changes requested', 'success');
        })
        .catch(function(err) { showToast(err.message, 'error'); });
    }

    /* ========================================================================
       INVOICES VIEW & EDITOR MODAL
       ======================================================================== */
    function renderClientInvoicesView(client) {
      var ids = {};
      ids[client.id] = true;
      if (!client.parentId) {
        STATE.clients.forEach(function(c) { if (c.parentId === client.id) ids[c.id] = true; });
      }
      var list = STATE.invoices.filter(function(inv) { return ids[inv.clientId]; });
      list.sort(function(a, b) { return String(b.issueDate + b.number).localeCompare(String(a.issueDate + a.number)); });
      var showFor = list.some(function(inv) { return inv.clientId !== client.id; });

      var effCurr = client.currency || (client.parentId && getClient(client.parentId) ? getClient(client.parentId).currency : '') || STATE.settings.defaultCurrency || 'USD';
      var invoiced = {}, received = {}, outstanding = {};
      var overdueCount = 0;
      var add = function(m, cur, v) { m[cur] = (m[cur] || 0) + v; };
      for (var i = 0; i < list.length; i++) {
        var cur = list[i].currency || effCurr;
        var t = computeInvoiceTotals(list[i]).total;
        add(invoiced, cur, t);
        if (list[i].status === 'Paid') add(received, cur, t);
        else {
          add(outstanding, cur, t);
          if (isInvoiceOverdue(list[i])) overdueCount++;
        }
      }
      var fmt = function(m) {
        var ks = Object.keys(m);
        return ks.length === 0 ? formatCurrency(0, effCurr) : ks.map(function(k) { return formatCurrency(m[k], k); }).join(' · ');
      };

      var html = '<div class="grid-cards" style="margin-bottom:18px">' +
        '<div class="card"><div style="font-size:12px;color:var(--text-muted);font-weight:600">Invoiced</div><div style="font-size:22px;font-weight:700;margin-top:4px">' + esc(fmt(invoiced)) + '</div></div>' +
        '<div class="card"><div style="font-size:12px;color:var(--text-muted);font-weight:600">Received</div><div style="font-size:22px;font-weight:700;margin-top:4px;color:var(--st-published)">' + esc(fmt(received)) + '</div></div>' +
        '<div class="card"><div style="font-size:12px;color:var(--text-muted);font-weight:600">Outstanding (' + overdueCount + ' overdue)</div><div style="font-size:22px;font-weight:700;margin-top:4px;color:var(--st-review)">' + esc(fmt(outstanding)) + '</div></div>' +
      '</div>';

      if (list.length === 0) {
        html += '<div class="card" style="color:var(--text-soft);text-align:center;padding:32px">No invoices for ' + esc(client.name) + ' yet. Click "+ Add invoice" to create one.</div>';
        return html;
      }

      html += '<div class="table-wrap"><table class="data-table"><thead><tr>' +
        '<th>Number</th>' + (showFor ? '<th>For</th>' : '') + '<th>Issue date</th><th>Due date</th><th>Status</th><th>Total</th><th style="text-align:right">Actions</th>' +
      '</tr></thead><tbody>';

      for (var j = 0; j < list.length; j++) {
        var inv = list[j];
        var overdue = isInvoiceOverdue(inv);
        var tot = computeInvoiceTotals(inv).total;
        var forClient = getClient(inv.clientId);
        html += '<tr>' +
          '<td style="font-weight:600;white-space:nowrap">' + esc(inv.number) + '</td>' +
          (showFor ? '<td style="white-space:nowrap">' + (forClient ? clientDot(forClient) + ' ' + esc(forClient.name) : '') + '</td>' : '') +
          '<td style="white-space:nowrap">' + esc(inv.issueDate) + '</td>' +
          '<td style="white-space:nowrap">' + esc(inv.dueDate) + '</td>' +
          '<td><span class="status-pill" style="background:' + (inv.status === 'Paid' ? 'var(--st-published)' : (overdue ? 'var(--danger)' : 'var(--st-review)')) + '">' + esc(overdue ? 'Overdue' : inv.status) + '</span></td>' +
          '<td style="font-weight:600;white-space:nowrap">' + esc(formatCurrency(tot, inv.currency)) + '</td>' +
          '<td style="text-align:right;white-space:nowrap">' +
            '<div style="display:inline-flex;gap:6px;flex-wrap:wrap;justify-content:flex-end">' +
              '<button class="btn-sm" onclick="toggleInvoicePaid(\'' + esc(inv.id) + '\', \'' + (inv.status === 'Paid' ? 'Pending' : 'Paid') + '\')">' + (inv.status === 'Paid' ? 'Mark unpaid' : 'Mark paid') + '</button>' +
              '<button class="btn-sm" onclick="openInvoiceModal(\'' + esc(inv.id) + '\')">Edit</button>' +
              '<button class="btn-sm" onclick="generatePdfAction(\'' + esc(inv.id) + '\', this)">PDF</button>' +
              (inv.pdfUrl ? '<a href="' + esc(inv.pdfUrl) + '" target="_blank" rel="noopener" class="btn-sm" style="text-decoration:none;border:1px solid var(--border-strong);border-radius:6px;padding:4px 9px">Open PDF ↗</a>' : '') +
              '<button class="btn-sm btn-primary" onclick="sendInvoiceAction(\'' + esc(inv.id) + '\', this)">' + (inv.sentAt ? 'Resend' : 'Send') + '</button>' +
              '<button class="btn-sm" style="color:var(--danger)" onclick="deleteInvoiceAction(\'' + esc(inv.id) + '\', \'' + esc(inv.number) + '\')">Delete</button>' +
            '</div>' +
          '</td>' +
        '</tr>';
      }
      html += '</tbody></table></div>';
      return html;
    }

    var EDITOR_INV = null;
    function openInvoiceModal(invoiceId) {
      var client = getClient(STATE.selectedClientId);
      if (!client) return;
      var parent = client.parentId ? getClient(client.parentId) : null;
      var defaultCurr = client.currency || (parent && parent.currency) || STATE.settings.defaultCurrency || 'USD';
      var dueDays = parseInt(STATE.settings.dueDays || '14', 10) || 14;

      var existing = null;
      if (invoiceId) {
        for (var i = 0; i < STATE.invoices.length; i++) {
          if (STATE.invoices[i].id === invoiceId) { existing = STATE.invoices[i]; break; }
        }
      }

      EDITOR_INV = existing ? JSON.parse(JSON.stringify(existing)) : {
        id: '',
        clientId: client.id,
        number: '',
        issueDate: STATE.today,
        dueDate: addDaysToDateStr(STATE.today, dueDays),
        dueManuallyEdited: false,
        status: 'Pending',
        currency: defaultCurr,
        items: [{ description: '', qty: '', rate: '' }],
        taxPct: '',
        discount: '',
        notes: ''
      };
      if (existing) EDITOR_INV.dueManuallyEdited = true;
      STATE.activeModal = 'invoiceEditor';
      renderInvoiceModal();
    }

    function renderInvoiceModal() {
      var inv = EDITOR_INV;
      var totals = computeInvoiceTotals(inv);

      var itemsHtml = '';
      for (var i = 0; i < inv.items.length; i++) {
        var it = inv.items[i];
        itemsHtml += '<div class="inv-line">' +
          '<input type="text" placeholder="Service description" value="' + esc(it.description) + '" oninput="EDITOR_INV.items[' + i + '].description=this.value">' +
          '<input type="number" step="any" placeholder="Qty" value="' + esc(it.qty) + '" oninput="EDITOR_INV.items[' + i + '].qty=this.value;updateInvoiceLiveTotals()">' +
          '<input type="number" step="any" placeholder="Rate" value="' + esc(it.rate) + '" oninput="EDITOR_INV.items[' + i + '].rate=this.value;updateInvoiceLiveTotals()">' +
          '<button type="button" class="btn-sm" style="color:var(--danger)" onclick="removeInvoiceLine(' + i + ')" ' + (inv.items.length <= 1 ? 'disabled' : '') + '>✕</button>' +
        '</div>';
      }

      var root = document.getElementById('modal-root');
      root.innerHTML = '<div class="modal-backdrop' + modalEnterCls() + '" onclick="if(event.target===this)closeModal(true)">' +
        '<div class="modal-box">' +
          '<div class="modal-header">' +
            '<h3>' + (inv.id ? 'Edit invoice ' + esc(inv.number) : 'Add invoice') + '</h3>' +
            '<button class="btn-sm btn-ghost" onclick="closeModal(true)">✕</button>' +
          '</div>' +
          '<div class="modal-body" style="display:flex;flex-direction:column;gap:12px">' +
            '<div class="grid-4">' +
              '<div><label class="field-label">Invoice #</label><input type="text" placeholder="Auto (INV-YYYY-NNN)" value="' + esc(inv.number) + '" oninput="EDITOR_INV.number=this.value"></div>' +
              '<div><label class="field-label">Currency</label><input type="text" value="' + esc(inv.currency) + '" oninput="EDITOR_INV.currency=this.value.toUpperCase();updateInvoiceLiveTotals()"></div>' +
              '<div><label class="field-label">Issue date</label><input type="date" value="' + esc(inv.issueDate) + '" oninput="onInvoiceIssueDateChange(this.value)"></div>' +
              '<div><label class="field-label">Due date</label><input type="date" id="inv-due-input" value="' + esc(inv.dueDate) + '" oninput="EDITOR_INV.dueDate=this.value;EDITOR_INV.dueManuallyEdited=true"></div>' +
            '</div>' +
            '<div>' +
              '<label class="field-label">Line items</label>' +
              itemsHtml +
              '<button type="button" class="btn-sm" onclick="EDITOR_INV.items.push({description:\'\',qty:\'\',rate:\'\'});renderInvoiceModal()">+ Add line item</button>' +
            '</div>' +
            '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">' +
              '<div><label class="field-label">Discount amount</label><input type="number" step="any" placeholder="0.00" value="' + esc(inv.discount) + '" oninput="EDITOR_INV.discount=this.value;updateInvoiceLiveTotals()"></div>' +
              '<div><label class="field-label">Tax %</label><input type="number" step="any" placeholder="0" value="' + esc(inv.taxPct) + '" oninput="EDITOR_INV.taxPct=this.value;updateInvoiceLiveTotals()"></div>' +
            '</div>' +
            '<div><label class="field-label">Notes</label><textarea rows="2" placeholder="Payment instructions or terms…" oninput="EDITOR_INV.notes=this.value">' + esc(inv.notes) + '</textarea></div>' +
            '<div id="inv-live-totals" style="background:var(--surface-subtle);border:1px solid var(--border);border-radius:var(--radius);padding:12px;text-align:right;font-size:13.5px">' +
              renderInvoiceTotalsInner(totals, inv.currency) +
            '</div>' +
          '</div>' +
          '<div class="modal-footer">' +
            '<span></span>' +
            '<div style="display:flex;gap:8px">' +
              '<button type="button" onclick="closeModal(true)">Cancel</button>' +
              '<button type="button" class="btn-primary" id="save-inv-btn" onclick="saveInvoiceNow()">Save invoice</button>' +
            '</div>' +
          '</div>' +
        '</div>' +
      '</div>';
    }

    function renderInvoiceTotalsInner(totals, curr) {
      return '<div>Subtotal: <strong>' + esc(formatCurrency(totals.subtotal, curr)) + '</strong></div>' +
        (totals.discount > 0 ? '<div>Discount: -' + esc(formatCurrency(totals.discount, curr)) + '</div>' : '') +
        (totals.tax > 0 ? '<div>Tax: ' + esc(formatCurrency(totals.tax, curr)) + '</div>' : '') +
        '<div style="font-size:16px;margin-top:4px">Total: <strong>' + esc(formatCurrency(totals.total, curr)) + '</strong></div>';
    }

    function updateInvoiceLiveTotals() {
      var box = document.getElementById('inv-live-totals');
      if (!box || !EDITOR_INV) return;
      box.innerHTML = renderInvoiceTotalsInner(computeInvoiceTotals(EDITOR_INV), EDITOR_INV.currency);
    }

    function onInvoiceIssueDateChange(val) {
      EDITOR_INV.issueDate = val;
      if (!EDITOR_INV.dueManuallyEdited && val) {
        var dueDays = parseInt(STATE.settings.dueDays || '14', 10) || 14;
        EDITOR_INV.dueDate = addDaysToDateStr(val, dueDays);
        var dueInp = document.getElementById('inv-due-input');
        if (dueInp) dueInp.value = EDITOR_INV.dueDate;
      }
    }

    function removeInvoiceLine(idx) {
      EDITOR_INV.items.splice(idx, 1);
      renderInvoiceModal();
    }

    function saveInvoiceNow() {
      var btn = document.getElementById('save-inv-btn');
      if (btn) { btn.disabled = true; btn.textContent = 'Saving…'; }
      callApi('saveInvoice', EDITOR_INV)
        .then(function(res) {
          var found = false;
          for (var i = 0; i < STATE.invoices.length; i++) {
            if (STATE.invoices[i].id === res.invoice.id) {
              STATE.invoices[i] = res.invoice;
              found = true;
              break;
            }
          }
          if (!found) STATE.invoices.push(res.invoice);
          closeModal(true);
          renderApp();
          showToast('Invoice saved', 'success');
        })
        .catch(function(err) {
          if (btn) { btn.disabled = false; btn.textContent = 'Save invoice'; }
          showToast(err.message, 'error');
        });
    }

    function toggleInvoicePaid(invId, nextStatus) {
      callApi('setInvoiceStatus', { invoiceId: invId, status: nextStatus })
        .then(function(res) {
          for (var i = 0; i < STATE.invoices.length; i++) {
            if (STATE.invoices[i].id === invId) STATE.invoices[i].status = res.status;
          }
          renderApp();
          showToast('Invoice marked ' + res.status, 'success');
        })
        .catch(function(err) { showToast(err.message, 'error'); });
    }

    function generatePdfAction(invId, btn) {
      btn.disabled = true;
      btn.textContent = 'Generating…';
      callApi('generateInvoicePdf', { invoiceId: invId }, true)
        .then(function(res) {
          for (var i = 0; i < STATE.invoices.length; i++) {
            if (STATE.invoices[i].id === invId) {
              STATE.invoices[i].pdfFileId = res.pdfFileId;
              STATE.invoices[i].pdfUrl = res.pdfUrl;
            }
          }
          renderApp();
          showToast('Invoice PDF generated', 'success');
        })
        .catch(function(err) {
          btn.disabled = false;
          btn.textContent = 'PDF';
          showToast(err.message, 'error');
        });
    }

    function sendInvoiceAction(invId, btn) {
      if (!confirm('Generate PDF and email this invoice to the client notification email?')) return;
      btn.disabled = true;
      btn.textContent = 'Sending…';
      callApi('sendInvoice', { invoiceId: invId }, true)
        .then(function(res) {
          for (var i = 0; i < STATE.invoices.length; i++) {
            if (STATE.invoices[i].id === invId) {
              STATE.invoices[i].pdfFileId = res.pdfFileId;
              STATE.invoices[i].pdfUrl = res.pdfUrl;
              STATE.invoices[i].sentAt = res.sentAt;
            }
          }
          renderApp();
          showToast('Invoice emailed to client', 'success');
        })
        .catch(function(err) {
          btn.disabled = false;
          btn.textContent = 'Send';
          showToast(err.message, 'error');
        });
    }

    function deleteInvoiceAction(invId, invNum) {
      if (!confirm('Delete invoice ' + invNum + ' and its PDF?')) return;
      callApi('deleteInvoice', { invoiceId: invId })
        .then(function() {
          STATE.invoices = STATE.invoices.filter(function(x) { return x.id !== invId; });
          renderApp();
          showToast('Invoice deleted', 'success');
        })
        .catch(function(err) { showToast(err.message, 'error'); });
    }

    function pickClientColor(btn, color) {
      document.getElementById('cli-color').value = color;
      var all = btn.parentNode.querySelectorAll('.swatch');
      for (var i = 0; i < all.length; i++) all[i].classList.remove('on');
      btn.classList.add('on');

    function saveClientModalNow(id, parentId) {
      callApi('saveClient', {
        id: id,
        parentId: parentId,
        name: document.getElementById('cli-name').value,
        notifyEmail: document.getElementById('cli-email').value,
        currency: document.getElementById('cli-curr').value,
        color: document.getElementById('cli-color').value
      }).then(function(res) {
        var found = false;
        for (var i = 0; i < STATE.clients.length; i++) {
          if (STATE.clients[i].id === res.client.id) {
            STATE.clients[i] = res.client;
            found = true;
            break;
          }
        }
        if (!found) STATE.clients.push(res.client);
        STATE.nav = 'client';
        STATE.selectedClientId = res.client.id;
        closeModal(true);
        renderApp();
        showToast('Client saved', 'success');
      }).catch(function(err) { showToast(err.message, 'error'); });
    }

      callApi('archiveClient', { clientId: clientId, archive: archive })
        .then(function() {
          return callApi('boot', {});

        .then(function(data) {
          applyBootState(data);
          closeModal(true);
          showToast(archive ? 'Client archived' : 'Client restored', 'success');

        .catch(function(err) { showToast(err.message, 'error'); });

    function saveProfileNow(quiet) {
      var d = PROFILE_DRAFT;
      if (!d) return;
      var btn = document.getElementById('save-profile-btn');
      if (btn) { btn.disabled = true; btn.textContent = 'Saving…'; }
      var payload = { name: d.name, title: d.title, phone: d.phone };
      if (d.avatarPath !== undefined) payload.avatarPath = d.avatarPath;
      return callApi('saveProfile', payload)
        .then(function(res) {
          STATE.user = res.user;
          for (var i = 0; i < STATE.team.length; i++) {
            if (STATE.team[i].email === res.user.email) STATE.team[i] = res.user;
          }
          PROFILE_DRAFT = null;
          renderApp();
          if (!quiet) showToast('Profile saved', 'success');
        })
        .catch(function(err) {
          if (btn) { btn.disabled = false; btn.textContent = 'Save profile'; }
          showToast(err.message, 'error');
        });
    }

    function uploadAvatar(file) {
      if (!file) return;
      if (file.type.indexOf('image/') !== 0) { showToast('Please choose an image file.', 'error'); return; }
      if (file.size > 5 * 1024 * 1024) { showToast('Profile photos can be up to 5 MB.', 'error'); return; }
      var btn = document.getElementById('avatar-btn');
      if (btn) { btn.disabled = true; btn.textContent = 'Uploading…'; }
      callApi('createAvatarUpload', { name: file.name, mimeType: file.type, size: file.size })
        .then(function(res) {
          return uploadToSignedUrl(res.uploadUrl, file).then(function() { return res; });
        })
        .then(function(res) {
          PROFILE_DRAFT.avatarPath = res.path;
          PROFILE_DRAFT.avatarUrl = res.url;
          return saveProfileNow(true).then(function() { showToast('Profile photo updated', 'success'); });
        })
        .catch(function(err) {
          if (btn) { btn.disabled = false; btn.textContent = 'Upload photo'; }
          showToast(err.message, 'error');
        });
    }

    function removeAvatar() {
      PROFILE_DRAFT.avatarPath = '';
      PROFILE_DRAFT.avatarUrl = '';
      saveProfileNow(true).then(function() { showToast('Profile photo removed', 'success'); });
    }

    }

    /* ========================================================================
       MODAL CLOSE & ESCAPE KEY PROTECTION
       ======================================================================== */
    function closeModal(force) {
      if (STATE.activeModal === 'postEditor' && STATE.editorDirty && !force) {
        return; // Protect unsaved edits from accidental backdrop/Escape dismissal
      }
      STATE.activeModal = null;
      STATE.editorDirty = false;
      EDITOR_POST = null;
      EDITOR_INV = null;
      var root = document.getElementById('modal-root');
      if (root) root.innerHTML = '';
    }

    window.addEventListener('keydown', function(e) {
      if (e.key === 'Escape' && STATE.activeModal) {
        if (STATE.activeModal === 'postEditor' && STATE.editorDirty) {
          showToast('You have unsaved edits. Use Save post or Cancel to close.', '');
          return;
        }
        closeModal(true);
      }
    });

    // Boot application on load
    window.addEventListener('DOMContentLoaded', initApp);
  </script>
</body>
</html>
