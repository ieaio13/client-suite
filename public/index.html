<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Clientflow</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%278%27 fill=%27%231f5fd6%27/%3E%3Crect x=%277%27 y=%2712%27 width=%273%27 height=%2710%27 rx=%271.5%27 fill=%27white%27/%3E%3Crect x=%2712%27 y=%279%27 width=%273%27 height=%2714%27 rx=%271.5%27 fill=%27white%27/%3E%3Crect x=%2717%27 y=%277%27 width=%273%27 height=%2718%27 rx=%271.5%27 fill=%27white%27/%3E%3Crect x=%2722%27 y=%2711%27 width=%273%27 height=%2711%27 rx=%271.5%27 fill=%27white%27/%3E%3C/svg%3E">
  <script>
    try {
      var savedTheme = localStorage.getItem('cocs_theme');
      if (savedTheme === 'light' || savedTheme === 'dark') document.documentElement.setAttribute('data-theme', savedTheme);
    } catch (e) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f3f5f8;
      --surface: #ffffff;
      --surface-subtle: #f8fafc;
      --border: #e2e8f0;
      --border-strong: #cbd5e1;
      --text: #0f172a;
      --text-muted: #475569;
      --text-soft: #64748b;
      --accent: #1f5fd6;
      --accent-hover: #184bb0;
      --accent-soft: #eff6ff;
      --danger: #dc2626;
      --danger-soft: #fef2f2;
      --st-draft: #8590a3;
      --st-review: #d4880b;
      --st-approved: #1f5fd6;
      --st-scheduled: #7c4dd6;
      --st-published: #17834a;
      --radius: 8px;
      --radius-lg: 12px;
      --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.05);
      --shadow-md: 0 4px 12px rgba(15, 23, 42, 0.08);
      --shadow-lg: 0 16px 36px rgba(15, 23, 42, 0.16);
      --surface-muted: #e2e8f0;
      --today-bg: #f8fbff;
      --board-col: #ebeff5;
      --board-drop: #e2eaf8;
      --hover-tint: rgba(15, 23, 42, 0.05);
      --warn-bg: #fffbeb;
      --warn-border: #fde68a;
      --warn-text: #92400e;
      --toast-bg: #0f172a;
      color-scheme: light;
    }

    /* Dark theme: chosen explicitly, or following the device when set to Auto */
    :root[data-theme="dark"] {
      --bg: #0b1120;
      --surface: #111827;
      --surface-subtle: #172033;
      --surface-muted: #1f2a3c;
      --border: #263244;
      --border-strong: #354258;
      --text: #e5e9f0;
      --text-muted: #a8b3c4;
      --text-soft: #8792a5;
      --accent: #4c8dff;
      --accent-hover: #6aa1ff;
      --accent-soft: #16294a;
      --danger: #f05252;
      --danger-soft: #3a1619;
      --st-draft: #6b7689;
      --st-review: #c27c0e;
      --st-approved: #2f6fe0;
      --st-scheduled: #7c5ad6;
      --st-published: #1a8a4f;
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.4);
      --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.45);
      --shadow-lg: 0 16px 36px rgba(0, 0, 0, 0.6);
      --today-bg: #13213a;
      --board-col: #0f1729;
      --board-drop: #16284a;
      --hover-tint: rgba(255, 255, 255, 0.06);
      --warn-bg: #2a2110;
      --warn-border: #5c4515;
      --warn-text: #f5c56b;
      --toast-bg: #273449;
      color-scheme: dark;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #0b1120;
        --surface: #111827;
        --surface-subtle: #172033;
        --surface-muted: #1f2a3c;
        --border: #263244;
        --border-strong: #354258;
        --text: #e5e9f0;
        --text-muted: #a8b3c4;
        --text-soft: #8792a5;
        --accent: #4c8dff;
        --accent-hover: #6aa1ff;
        --accent-soft: #16294a;
        --danger: #f05252;
        --danger-soft: #3a1619;
        --st-draft: #6b7689;
        --st-review: #c27c0e;
        --st-approved: #2f6fe0;
        --st-scheduled: #7c5ad6;
        --st-published: #1a8a4f;
        --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.4);
        --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.45);
        --shadow-lg: 0 16px 36px rgba(0, 0, 0, 0.6);
        --today-bg: #13213a;
        --board-col: #0f1729;
        --board-drop: #16284a;
        --hover-tint: rgba(255, 255, 255, 0.06);
        --warn-bg: #2a2110;
        --warn-border: #5c4515;
        --warn-text: #f5c56b;
        --toast-bg: #273449;
        color-scheme: dark;
      }
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: 'Instrument Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 14px;
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }

    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    button, input, select, textarea {
      font-family: inherit;
      font-size: 14px;
      color: inherit;
    }

    button {
      cursor: pointer;
      border: 1px solid var(--border-strong);
      background: var(--surface);
      padding: 7px 13px;
      border-radius: var(--radius);
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background 0.15s, border-color 0.15s;
    }
    button:hover:not(:disabled) { background: var(--surface-subtle); }
    button:disabled { opacity: 0.55; cursor: not-allowed; }

    .btn-primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    .btn-primary:hover:not(:disabled) {
      background: var(--accent-hover);
      border-color: var(--accent-hover);
    }
    .btn-danger {
      background: var(--danger);
      border-color: var(--danger);
      color: #fff;
    }
    .btn-danger:hover:not(:disabled) { opacity: 0.92; }
    .btn-ghost {
      border-color: transparent;
      background: transparent;
    }
    .btn-ghost:hover:not(:disabled) { background: var(--hover-tint); }
    .btn-sm { padding: 4px 9px; font-size: 12.5px; border-radius: 6px; }

    input[type="text"], input[type="email"], input[type="password"], input[type="date"], input[type="time"], input[type="number"], input[type="url"], select, textarea {
      width: 100%;
      padding: 8px 11px;
      border: 1px solid var(--border-strong);
      border-radius: var(--radius);
      background: var(--surface);
    }
    textarea { resize: vertical; min-height: 90px; }
    label.field-label {
      display: block;
      font-weight: 600;
      font-size: 12.5px;
      color: var(--text-muted);
      margin-bottom: 5px;
    }

    /* Logo Stripes */
    .logo-mark {
      display: inline-flex;
      gap: 3px;
      align-items: center;
      height: 20px;
      flex-shrink: 0;
    }
    .logo-mark span {
      width: 4px;
      height: 18px;
      border-radius: 2px;
      display: block;
    }
    .logo-mark span:nth-child(1) { background: var(--st-draft); height: 12px; }
    .logo-mark span:nth-child(2) { background: var(--st-review); height: 16px; }
    .logo-mark span:nth-child(3) { background: var(--st-approved); height: 20px; }
    .logo-mark span:nth-child(4) { background: var(--st-scheduled); height: 16px; }
    .logo-mark span:nth-child(5) { background: var(--st-published); height: 14px; }

    /* Top Bar */
    .topbar {
      height: 56px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      position: sticky;
      top: 0;
      z-index: 40;
    }
    .topbar-left, .topbar-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .brand-title {
      font-weight: 700;
      font-size: 15.5px;
      letter-spacing: -0.01em;
    }
    .nav-tab {
      border: none;
      background: transparent;
      padding: 6px 11px;
      border-radius: 6px;
      font-weight: 600;
      color: var(--text-muted);
    }
    .nav-tab.active {
      background: var(--accent-soft);
      color: var(--accent);
    }

    /* Main Workspace Layout */
    .workspace {
      display: flex;
      min-height: calc(100vh - 56px);
    }
    .sidebar {
      width: 265px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      padding: 16px 12px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .sidebar-section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 6px;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-soft);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .client-tree {
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex: 1;
      overflow-y: auto;
    }
    .tree-parent-group {
      margin-bottom: 4px;
    }
    .tree-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      text-align: left;
      padding: 7px 10px;
      border-radius: 6px;
      border: none;
      background: transparent;
      font-weight: 600;
      color: var(--text);
    }
    .tree-item:hover { background: var(--surface-subtle); }
    .tree-item.active {
      background: var(--accent-soft);
      color: var(--accent);
    }
    .tree-sub-list {
      padding-left: 14px;
      margin-top: 2px;
      border-left: 1px solid var(--border);
      margin-left: 12px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .tree-sub-item {
      font-weight: 500;
      font-size: 13.5px;
      padding: 5px 9px;
    }
    .main-area {
      flex: 1;
      padding: 24px 28px;
      min-width: 0;
      max-width: 1600px;
    }

    /* Cards & Surfaces */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 18px 20px;
      box-shadow: var(--shadow-sm);
    }
    .grid-cards {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 16px;
    }

    /* Status Badges & Colors */
    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 9px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      color: #fff;
      white-space: nowrap;
    }
    .st-bg-Draft { background: var(--st-draft); }
    .st-bg-In-Review { background: var(--st-review); }
    .st-bg-Approved { background: var(--st-approved); }
    .st-bg-Scheduled { background: var(--st-scheduled); }
    .st-bg-Published { background: var(--st-published); }

    .st-border-Draft { border-left: 4px solid var(--st-draft); }
    .st-border-In-Review { border-left: 4px solid var(--st-review); }
    .st-border-Approved { border-left: 4px solid var(--st-approved); }
    .st-border-Scheduled { border-left: 4px solid var(--st-scheduled); }
    .st-border-Published { border-left: 4px solid var(--st-published); }

    /* Content Toolbar & Filters */
    .view-header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
    }
    .sub-tabs {
      display: inline-flex;
      background: var(--surface-muted);
      padding: 3px;
      border-radius: var(--radius);
      gap: 2px;
    }
    .sub-tab {
      border: none;
      background: transparent;
      padding: 5px 13px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 13px;
      color: var(--text-muted);
    }
    .sub-tab.active {
      background: var(--surface);
      color: var(--text);
      box-shadow: var(--shadow-sm);
    }
    .filter-bar {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 12px 16px;
      margin-bottom: 18px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
    }
    .filter-bar input, .filter-bar select {
      width: auto;
      min-width: 140px;
      padding: 6px 10px;
      font-size: 13px;
    }
    .filter-bar input[type="text"] {
      flex: 1;
      min-width: 190px;
    }

    /* Calendar Grid */
    .cal-controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
    }
    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      background: var(--border);
      gap: 1px;
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      overflow: hidden;
    }
    .cal-dow {
      background: var(--surface-subtle);
      padding: 8px 10px;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
      text-align: center;
    }
    .cal-cell {
      background: var(--surface);
      min-height: 125px;
      padding: 6px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      position: relative;
    }
    .cal-cell.outside { background: var(--surface-subtle); color: var(--text-soft); }
    .cal-cell.today { background: var(--today-bg); }
    .cal-cell.drag-over { background: var(--accent-soft); outline: 2px dashed var(--accent); }
    .cal-cell-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 2px;
    }
    .cal-day-num.is-today {
      background: var(--accent);
      color: #fff;
      padding: 1px 6px;
      border-radius: 999px;
    }
    .cal-add-btn {
      opacity: 0;
      padding: 1px 6px;
      font-size: 12px;
      height: 20px;
      border-radius: 4px;
    }
    .cal-cell:hover .cal-add-btn, .cal-add-btn:focus-visible { opacity: 1; }
    .cal-chip {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--surface-subtle);
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 4px 6px;
      font-size: 11.5px;
      cursor: pointer;
      overflow: hidden;
      text-align: left;
    }
    .cal-chip:hover { background: var(--accent-soft); }
    .cal-chip-thumb {
      width: 20px;
      height: 20px;
      border-radius: 3px;
      object-fit: cover;
      flex-shrink: 0;
      background: var(--surface-muted);
    }
    .cal-chip-text {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }

    /* Kanban Board */
    .board-wrap {
      display: grid;
      grid-template-columns: repeat(5, minmax(245px, 1fr));
      gap: 14px;
      overflow-x: auto;
      padding-bottom: 12px;
    }
    .board-col {
      background: var(--board-col);
      border-radius: var(--radius-lg);
      display: flex;
      flex-direction: column;
      min-height: 460px;
      border-top: 4px solid var(--st-draft);
    }
    .board-col-header {
      padding: 12px 14px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .board-col-body {
      padding: 0 10px 12px 10px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex: 1;
    }
    .board-col.drag-over { outline: 2px dashed var(--accent); background: var(--board-drop); }
    .board-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow-sm);
      cursor: pointer;
      display: flex;
      flex-direction: column;
    }
    .board-card:hover { box-shadow: var(--shadow-md); }
    .board-card-media {
      position: relative;
      height: 140px;
      background: #0f172a;
    }
    .board-card-media img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .video-placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f172a;
      color: #cbd5e1;
      font-size: 12px;
      font-weight: 600;
    }
    .media-badge {
      position: absolute;
      top: 8px;
      right: 8px;
      background: rgba(15, 23, 42, 0.78);
      color: #fff;
      font-size: 11px;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 99px;
    }
    .board-card-body {
      padding: 11px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .chip-row {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }
    .mini-chip {
      font-size: 11px;
      padding: 1px 6px;
      border-radius: 4px;
      background: var(--surface-subtle);
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-weight: 500;
    }
    .avatar-circle {
      width: 24px;
      height: 24px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent);
      font-weight: 700;
      font-size: 11px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    /* Tables */
    .table-wrap {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      overflow-x: auto;
    }
    table.data-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }
    table.data-table th {
      background: var(--surface-subtle);
      padding: 11px 14px;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }
    table.data-table td {
      padding: 11px 14px;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }
    table.data-table tr:last-child td { border-bottom: none; }
    table.data-table tr.clickable:hover td { background: var(--surface-subtle); cursor: pointer; }

    /* Modals */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.5);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
      overflow-y: auto;
    }
    .modal-box {
      background: var(--surface);
      border-radius: var(--radius-lg);
      width: 100%;
      max-width: 640px;
      max-height: 92vh;
      display: flex;
      flex-direction: column;
      box-shadow: var(--shadow-lg);
      overflow: hidden;
    }
    .modal-box.modal-xl { max-width: 1040px; }
    .modal-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .modal-header h3 { margin: 0; font-size: 17px; }
    .modal-body {
      padding: 20px;
      overflow-y: auto;
      flex: 1;
    }
    .modal-footer {
      padding: 14px 20px;
      border-top: 1px solid var(--border);
      background: var(--surface-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    /* Post Editor Split Layout */
    .editor-split {
      display: grid;
      grid-template-columns: 1.35fr 0.95fr;
      gap: 22px;
    }
    .editor-side {
      border-left: 1px solid var(--border);
      padding-left: 20px;
      display: flex;
      flex-direction: column;
      max-height: 68vh;
    }
    .dropzone {
      border: 2px dashed var(--border-strong);
      border-radius: var(--radius);
      padding: 16px;
      text-align: center;
      background: var(--surface-subtle);
      cursor: pointer;
    }
    .dropzone.drag-active {
      border-color: var(--accent);
      background: var(--accent-soft);
    }
    .asset-strip {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding: 8px 0;
    }
    .asset-card {
      width: 120px;
      flex-shrink: 0;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      background: var(--surface);
    }
    .asset-card img {
      width: 100%;
      height: 82px;
      object-fit: cover;
      display: block;
      background: var(--surface-muted);
    }
    .asset-card .video-placeholder { height: 82px; }
    .asset-card-controls {
      display: flex;
      justify-content: space-between;
      padding: 4px;
      background: var(--surface-subtle);
    }

    /* Toast Notifications */
    .toast-container {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 250;
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-width: 380px;
    }
    .toast {
      background: var(--toast-bg);
      color: #fff;
      padding: 11px 15px;
      border-radius: var(--radius);
      box-shadow: var(--shadow-md);
      font-size: 13.5px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .toast.error { background: var(--danger); }
    .toast.success { background: #15803d; }

    /* Auth / Setup Centered Card */
    .auth-screen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .auth-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      width: 100%;
      max-width: 420px;
      padding: 28px;
      box-shadow: var(--shadow-md);
    }

    .theme-toggle { white-space: nowrap; }

    /* ---------- Motion ---------- */
    @keyframes cf-fade-up { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    @keyframes cf-fade-in { from { opacity: 0; } to { opacity: 1; } }
    @keyframes cf-pop-in { from { opacity: 0; transform: translateY(18px) scale(0.96); } to { opacity: 1; transform: none; } }
    @keyframes cf-slide-in { from { opacity: 0; transform: translateX(28px); } to { opacity: 1; transform: none; } }
    @keyframes cf-bars { 0%, 100% { transform: scaleY(0.5); } 50% { transform: scaleY(1); } }
    @keyframes cf-float { 0%, 100% { transform: translate(0, 0) scale(1); } 50% { transform: translate(40px, -30px) scale(1.1); } }
    @keyframes cf-shake { 10%, 90% { transform: translateX(-1px); } 20%, 80% { transform: translateX(3px); } 30%, 50%, 70% { transform: translateX(-6px); } 40%, 60% { transform: translateX(6px); } }

    .animate-in > * { animation: cf-fade-up 0.55s cubic-bezier(0.2, 0.8, 0.2, 1) both; }
    .animate-in > *:nth-child(2) { animation-delay: 0.06s; }
    .animate-in > *:nth-child(3) { animation-delay: 0.12s; }
    .animate-in > *:nth-child(4) { animation-delay: 0.18s; }
    .animate-in > *:nth-child(n+5) { animation-delay: 0.24s; }
    .animate-in .board-card, .animate-in .grid-cards > .card {
      animation: cf-fade-up 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) both;
      animation-delay: calc(var(--i, 0) * 45ms + 0.12s);
    }
    .modal-enter { animation: cf-fade-in 0.22s ease both; }
    .modal-enter .modal-box { animation: cf-pop-in 0.38s cubic-bezier(0.2, 0.9, 0.3, 1.15) both; }
    .toast { animation: cf-slide-in 0.35s cubic-bezier(0.2, 0.9, 0.3, 1.2) both; }
    .shake { animation: cf-shake 0.45s both !important; }

    .card, .board-card, .tree-item, .cal-chip, .tag-chip, .swatch, button {
      transition: background-color 0.18s, border-color 0.18s, box-shadow 0.22s, transform 0.22s cubic-bezier(0.2, 0.8, 0.2, 1), color 0.18s;
    }
    button:active:not(:disabled) { transform: scale(0.97); }
    .board-card:hover { transform: translateY(-3px); }
    .grid-cards > .card[onclick]:hover { transform: translateY(-3px); box-shadow: var(--shadow-md); }
    .btn-primary { background-image: linear-gradient(135deg, rgba(255, 255, 255, 0.16), rgba(255, 255, 255, 0) 60%); box-shadow: 0 6px 16px -8px var(--accent); }
    .btn-primary:hover:not(:disabled) { box-shadow: 0 10px 22px -8px var(--accent); }
    body, .topbar, .sidebar, .modal-box, .filter-bar, .table-wrap, .cal-cell, .board-col {
      transition: background-color 0.35s ease, border-color 0.35s ease, color 0.35s ease;
    }
    #initial-loader .logo-mark span { animation: cf-bars 0.9s ease-in-out infinite; transform-origin: bottom; }
    #initial-loader .logo-mark span:nth-child(2) { animation-delay: 0.12s; }
    #initial-loader .logo-mark span:nth-child(3) { animation-delay: 0.24s; }
    #initial-loader .logo-mark span:nth-child(4) { animation-delay: 0.36s; }
    #initial-loader .logo-mark span:nth-child(5) { animation-delay: 0.48s; }

    .auth-screen { position: relative; overflow: hidden; }
    .auth-screen::before, .auth-screen::after {
      content: ''; position: absolute; width: 460px; height: 460px; border-radius: 50%;
      filter: blur(80px); opacity: 0.32; pointer-events: none; z-index: 0;
      animation: cf-float 16s ease-in-out infinite;
    }
    .auth-screen::before { background: var(--accent); top: -140px; left: -120px; }
    .auth-screen::after { background: var(--st-scheduled); bottom: -160px; right: -140px; animation-delay: -8s; }
    .auth-card { position: relative; z-index: 1; animation: cf-pop-in 0.55s cubic-bezier(0.2, 0.9, 0.3, 1.1) both; }

    /* ---------- Password fields with show/hide ---------- */
    .pw-field { position: relative; }
    .pw-field input { padding-right: 44px !important; }
    .pw-toggle {
      position: absolute; right: 4px; top: 50%; transform: translateY(-50%);
      border: none; background: transparent; padding: 6px 8px; color: var(--text-soft); line-height: 0; border-radius: 6px;
    }
    .pw-toggle:hover:not(:disabled) { background: var(--hover-tint); color: var(--text); }
    .pw-toggle:active:not(:disabled) { transform: translateY(-50%) scale(0.9); }

    /* ---------- Client colors, tags, settings ---------- */
    .cdot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex-shrink: 0; background: var(--border-strong); }
    .tree-label { display: flex; align-items: center; gap: 8px; min-width: 0; flex: 1; }
    .tree-label .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .reorder-btns { display: inline-flex; gap: 3px; flex-shrink: 0; }
    .reorder-btns button { padding: 2px 7px; font-size: 12px; }
    .swatches { display: flex; flex-wrap: wrap; gap: 8px; }
    .swatch { width: 28px; height: 28px; border-radius: 50%; padding: 0; border: 2px solid transparent; justify-content: center; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.1); }
    .swatch.on { border-color: var(--text); transform: scale(1.12); }
    .swatch.none { background: var(--surface-subtle); border: 2px dashed var(--border-strong); color: var(--text-soft); font-size: 13px; }
    .swatch.none.on { border-style: solid; border-color: var(--text); }
    .tag-chip {
      --c: #8590a3;
      display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 600;
      padding: 2px 9px; border-radius: 999px; color: var(--text); white-space: nowrap;
      background: color-mix(in srgb, var(--c) 16%, transparent);
      border: 1px solid color-mix(in srgb, var(--c) 45%, transparent);
    }
    .tag-chip::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--c); }
    button.tag-chip { cursor: pointer; padding: 5px 11px; font-size: 12.5px; }
    button.tag-chip:hover:not(:disabled) { background: color-mix(in srgb, var(--c) 26%, transparent); }
    button.tag-chip.off { background: transparent; border-color: var(--border-strong); color: var(--text-muted); }
    .tag-chip .x { opacity: 0.6; font-size: 10px; }
    .settings-layout { display: grid; grid-template-columns: 210px minmax(0, 1fr); gap: 22px; align-items: start; max-width: 1080px; }
    .settings-nav { display: flex; flex-direction: column; gap: 4px; position: sticky; top: 76px; }
    .settings-nav button { justify-content: flex-start; border: none; background: transparent; font-weight: 600; color: var(--text-muted); padding: 9px 12px; }
    .settings-nav button.active { background: var(--accent-soft); color: var(--accent); }
    .settings-card h2 { font-size: 16px; margin: 0 0 4px 0; }
    .settings-card .lead { color: var(--text-muted); font-size: 13px; margin: 0 0 16px 0; }
    .avatar-circle { overflow: hidden; flex-shrink: 0; }
    .avatar-circle img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .avatar-lg { width: 84px; height: 84px; font-size: 28px; box-shadow: var(--shadow-md); }
    .otp-input { font-size: 30px !important; letter-spacing: 14px; text-align: center; font-weight: 700; font-variant-numeric: tabular-nums; padding: 12px !important; }
    .post-meta { font-size: 12px; color: var(--text-soft); display: flex; flex-wrap: wrap; gap: 4px 14px; }
    .post-meta strong { color: var(--text-muted); font-weight: 600; }
    .seg { display: inline-flex; flex-wrap: wrap; background: var(--surface-muted); padding: 3px; border-radius: var(--radius); gap: 2px; }
    .seg button { border: none; background: transparent; font-weight: 600; font-size: 13px; color: var(--text-muted); padding: 7px 12px; }
    .seg button.active { background: var(--surface); color: var(--text); box-shadow: var(--shadow-sm); }
    .grid-4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
    .inv-line { display: grid; grid-template-columns: 1fr 85px 110px 34px; gap: 8px; margin-bottom: 8px; align-items: center; }
    .menu-btn { display: none; font-size: 18px; padding: 4px 9px; }
    .sidebar-overlay { display: none; }
    .info-note { background: var(--accent-soft); color: var(--text); border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent); padding: 8px 12px; border-radius: var(--radius); font-size: 12.5px; }

    /* ---------- Calendar tiles: picture, status, copy ---------- */
    .cal-chip { flex-direction: column; align-items: stretch; gap: 5px; padding: 5px; border-radius: 7px; font-size: 11.5px; }
    .cal-chip-thumb { width: 100%; height: 84px; border-radius: 5px; }
    .cal-chip-video { width: 100%; height: 84px; border-radius: 5px; background: #0f172a; color: #cbd5e1; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; }
    .cal-chip .status-pill { align-self: flex-start; font-size: 10px; padding: 1px 7px; }
    .cal-chip-text { white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; line-height: 1.35; }

    /* ---------- Reference vs final media ---------- */
    .asset-section { border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 12px; background: var(--surface-subtle); display: flex; flex-direction: column; gap: 8px; }
    .asset-section.asset-final { border-color: color-mix(in srgb, var(--st-published) 45%, var(--border)); }
    .asset-head { display: flex; flex-direction: column; gap: 2px; }
    .asset-title { font-weight: 700; font-size: 13px; display: flex; align-items: center; gap: 6px; }
    .asset-help { font-size: 12px; color: var(--text-soft); }
    .asset-empty { font-size: 12.5px; color: var(--text-soft); padding: 4px 0; }
    .asset-section .dropzone { padding: 12px; background: var(--surface); }
    .media-badge.ref { left: 8px; right: auto; background: rgba(124, 77, 214, 0.9); }

    /* Responsive adjustments */
    @media (max-width: 860px) {
      .workspace { flex-direction: column; }
      .sidebar {
        width: 100%;
        border-right: none;
        border-bottom: 1px solid var(--border);
      }
      .main-area { padding: 16px; }
      .theme-toggle span { display: none; }
      .editor-split { grid-template-columns: 1fr; }
      .editor-side {
        border-left: none;
        border-top: 1px solid var(--border);
        padding-left: 0;
        padding-top: 16px;
        max-height: none;
      }
      .cal-cell { min-height: 74px; padding: 4px; }
      .cal-chip-thumb, .cal-chip-text { display: none; }
      .cal-chip {
        height: 8px;
        padding: 0;
        border-radius: 4px;
      }
      .cal-chip.st-border-Draft { background: var(--st-draft); }
      .cal-chip.st-border-In-Review { background: var(--st-review); }
      .cal-chip.st-border-Approved { background: var(--st-approved); }
      .cal-chip.st-border-Scheduled { background: var(--st-scheduled); }
      .cal-chip.st-border-Published { background: var(--st-published); }
    }
    @media (max-width: 860px) {
      .menu-btn { display: inline-flex; }
      .topbar { padding: 0 10px; gap: 6px; }
      .topbar-left, .topbar-right { gap: 4px; min-width: 0; }
      .topbar .brand-title, .topbar .user-name, .topbar .user-role { display: none; }
      .nav-tab { padding: 6px 8px; }
      .workspace { display: block; }
      .sidebar {
        position: fixed; top: 56px; left: 0; bottom: 0; width: min(300px, 86vw); z-index: 60;
        transform: translateX(-104%); transition: transform 0.32s cubic-bezier(0.2, 0.8, 0.2, 1);
        box-shadow: var(--shadow-lg); border-right: 1px solid var(--border); border-bottom: none; overflow-y: auto;
      }
      .sidebar.open { transform: none; }
      .sidebar-overlay.open { display: block; position: fixed; inset: 56px 0 0 0; background: rgba(0, 0, 0, 0.45); z-index: 55; animation: cf-fade-in 0.2s both; }
      .view-header > div:last-child { width: 100%; }
      .view-header .sub-tabs { overflow-x: auto; max-width: 100%; }
      .filter-bar input, .filter-bar select { flex: 1 1 140px; min-width: 0; }
      .board-wrap { grid-template-columns: repeat(5, 84%); scroll-snap-type: x mandatory; }
      .board-col { scroll-snap-align: start; min-height: 300px; }
      .settings-layout { grid-template-columns: 1fr; }
      .settings-nav { position: static; flex-direction: row; overflow-x: auto; }
      .settings-nav button { white-space: nowrap; }
      .grid-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .topbar.portal-bar { height: auto; min-height: 56px; flex-wrap: wrap; padding: 8px 12px; row-gap: 8px; }
      .cal-chip { flex-direction: row; }
      .cal-chip .status-pill, .cal-chip-video { display: none; }
    }
    @media (max-width: 640px) {
      .modal-backdrop { padding: 0; align-items: stretch; }
      .modal-box, .modal-box.modal-xl { max-width: none; max-height: none; height: 100%; border-radius: 0; }
      .modal-footer { flex-wrap: wrap; }
      .modal-footer > div { display: flex; flex-wrap: wrap; gap: 8px; }
      .main-area { padding: 14px 12px; }
      .grid-cards { grid-template-columns: 1fr; }
      .inv-line { grid-template-columns: 1fr 1fr 34px; }
      .inv-line > input:first-child { grid-column: 1 / -1; }
      .auth-card { padding: 22px; }
      .main-area h1 { font-size: 19px !important; }
      .toast-container { left: 12px; right: 12px; bottom: 12px; max-width: none; }
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="auth-screen" id="initial-loader">
      <div class="auth-card" style="text-align:center">
        <div class="logo-mark" style="justify-content:center;margin-bottom:12px">
          <span></span><span></span><span></span><span></span><span></span>
        </div>
        <div style="font-weight:600;font-size:15px" id="loader-title">Loading workspace…</div>
        <div style="color:var(--text-soft);font-size:13px;margin-top:6px" id="loader-sub">Connecting to the server</div>
      </div>
    </div>
  </div>
  <div id="modal-root"></div>
  <div id="toast-root" class="toast-container" aria-live="polite"></div>

  <script>
    /* ========================================================================
       GLOBAL ERROR HANDLER & 30-SECOND FALLBACK GUARD
       ======================================================================== */
    var APP_BOOTED = false;
    var BOOT_FALLBACK_TIMER = setTimeout(function() {
      if (!APP_BOOTED) {
        renderFatalScreen('The workspace took longer than 30 seconds to respond. Check your connection and try again.');
      }
    }, 30000);

    window.addEventListener('error', function(ev) {
      var msg = (ev && ev.message) ? ev.message : 'Unexpected browser script error';
      showToast(msg, 'error');
      if (!APP_BOOTED) {
        renderFatalScreen('Script Error: ' + msg);
      }
    });

    window.addEventListener('unhandledrejection', function(ev) {
      var reason = (ev && ev.reason) ? (ev.reason.message || String(ev.reason)) : 'Unhandled promise rejection';
      showToast(reason, 'error');
      if (!APP_BOOTED) {
        renderFatalScreen('Promise Error: ' + reason);
      }
    });

    function renderFatalScreen(msg) {
      APP_BOOTED = true;
      clearTimeout(BOOT_FALLBACK_TIMER);
      var appEl = document.getElementById('app');
      if (!appEl) return;
      appEl.innerHTML = '<div class="auth-screen"><div class="auth-card">' +
        '<h2 style="margin:0 0 8px 0;color:var(--danger);font-size:18px">Unable to load workspace</h2>' +
        '<p style="color:var(--text-muted);margin:0 0 16px 0;word-break:break-word">' + esc(msg) + '</p>' +
        '<button class="btn-primary" onclick="location.reload()">Reload page</button>' +
        '</div></div>';
    }

    /* ========================================================================
       SAFE STORAGE & RPC PROMISE WRAPPER (45s / 180s TIMEOUT)
       ======================================================================== */
    var memoryStorage = {};
    function getSessionToken() {
      try {
        return localStorage.getItem('cocs_session_token') || memoryStorage.token || '';
      } catch (e) {
        return memoryStorage.token || '';
      }
    }
    function setSessionToken(tok) {
      memoryStorage.token = tok || '';
      try {
        if (tok) localStorage.setItem('cocs_session_token', tok);
        else localStorage.removeItem('cocs_session_token');
      } catch (e) {}
    }

    var STATE = {
      mode: 'loading', // 'setup' | 'login' | 'agency' | 'portal'
      clientToken: '',
      agencyName: 'Clientflow',
      user: null,
      webAppUrl: '',
      today: '',
      settings: {},
      team: [],
      clients: [],
      posts: [],
      comments: [],
      activity: [],
      invoices: [],
      isAdmin: false,
      isBilling: false,
      // UI navigation state
      nav: 'overview', // 'overview' | 'client' | 'team'
      selectedClientId: '',
      subView: 'calendar', // 'calendar' | 'board' | 'table' | 'invoices'
      calMode: 'month', // 'month' | 'week' | 'list'
      calCursor: '', // yyyy-MM-dd
      showArchived: false,
      filters: {
        search: '',
        status: '',
        platform: '',
        tag: '',
        assignee: ''
      },
      portalOnlyReview: false,
      editorDirty: false,
      activeModal: null
    };

    var API_ENDPOINT = '/api/rpc';

    function callApi(action, payload, isLongOp) {
      var timeoutMs = isLongOp ? 180000 : 45000;
      var auth = {
        sessionToken: getSessionToken(),
        clientToken: STATE.clientToken || ''
      };
      var ctrl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
      var timer = setTimeout(function() {
        if (ctrl) ctrl.abort();
      }, timeoutMs);

      return fetch(API_ENDPOINT, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: action, auth: auth, payload: payload || {} }),
        signal: ctrl ? ctrl.signal : undefined
      })
        .then(function(r) {
          return r.json().catch(function() {
            throw new Error('The server returned an invalid response (HTTP ' + r.status + ').');
          });
        })
        .then(function(res) {
          clearTimeout(timer);
          if (!res || !res.ok) {
            var err = new Error((res && res.error) ? res.error : 'Server error');
            err.code = (res && res.code) ? res.code : 'ERROR';
            if (err.code === 'AUTH' && STATE.mode === 'agency') {
              setSessionToken('');
              STATE.mode = 'login';
              STATE.authMessage = err.message || 'Your session expired. Please sign in again.';
              closeModal(true);
              renderApp();
            }
            throw err;
          }
          return res.data;
        }, function(err) {
          clearTimeout(timer);
          if (err && err.name === 'AbortError') {
            throw new Error('Request timed out after ' + (timeoutMs / 1000) + 's (' + action + ').');
          }
          throw new Error('Could not reach the server. Check your connection and try again.');
        });
    }

    /* ========================================================================
       UTILITIES
       ======================================================================== */
    function esc(str) {
      return String(str === null || str === undefined ? '' : str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function statusClass(st) {
      return String(st || 'Draft').replace(/\s+/g, '-');
    }

    function showToast(msg, type) {
      var root = document.getElementById('toast-root');
      if (!root) return;
      var el = document.createElement('div');
      el.className = 'toast ' + (type || '');
      el.innerHTML = '<span>' + esc(msg) + '</span><button class="btn-sm btn-ghost" style="color:#fff;padding:2px 6px" aria-label="Dismiss">✕</button>';
      el.querySelector('button').onclick = function() { el.remove(); };
      root.appendChild(el);
      setTimeout(function() {
        if (el.parentNode) el.remove();
      }, 4500);
    }

    function initials(nameOrEmail) {
      if (!nameOrEmail) return '—';
      var teamMember = getTeamMember(nameOrEmail);
      var label = teamMember ? teamMember.name : nameOrEmail;
      var parts = String(label).trim().split(/\s+/);
      if (parts.length >= 2) return (parts[0].charAt(0) + parts[1].charAt(0)).toUpperCase();
      return String(label).substring(0, 2).toUpperCase();
    }

    function getTeamMember(email) {
      if (!email) return null;
      for (var i = 0; i < STATE.team.length; i++) {
        if (STATE.team[i].email.toLowerCase() === String(email).toLowerCase()) return STATE.team[i];
      }
      return null;
    }

    function getClient(id) {
      for (var i = 0; i < STATE.clients.length; i++) {
        if (STATE.clients[i].id === id) return STATE.clients[i];
      }
      return null;
    }

    function formatCurrency(val, curr) {
      var n = Number(val || 0);
      return (curr || STATE.settings.defaultCurrency || 'USD') + ' ' + n.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    }

    function computeInvoiceTotals(inv) {
      var items = inv.items || [];
      var sub = 0;
      for (var i = 0; i < items.length; i++) {
        sub += Number(items[i].qty || 0) * Number(items[i].rate || 0);
      }
      var disc = Number(inv.discount || 0);
      var afterDisc = Math.max(0, sub - disc);
      var tax = afterDisc * (Number(inv.taxPct || 0) / 100);
      return {
        subtotal: sub,
        discount: disc,
        tax: tax,
        total: afterDisc + tax
      };
    }

    function isInvoiceOverdue(inv) {
      if (!inv || inv.status === 'Paid') return false;
      var today = STATE.today || new Date().toISOString().slice(0, 10);
      return Boolean(inv.dueDate && inv.dueDate < today);
    }

    /* ---------- Theme: Auto (follows device) / Light / Dark, remembered per browser ---------- */
    var THEME_KEY = 'cocs_theme';
    function getThemePref() {
      try {
        return localStorage.getItem(THEME_KEY) || memoryStorage.theme || 'system';
      } catch (e) {
        return memoryStorage.theme || 'system';
      }
    }
    function applyTheme(pref) {
      if (pref === 'light' || pref === 'dark') document.documentElement.setAttribute('data-theme', pref);
      else document.documentElement.removeAttribute('data-theme');
    }
    function cycleTheme() {
      var order = ['system', 'light', 'dark'];
      var next = order[(order.indexOf(getThemePref()) + 1) % order.length];
      memoryStorage.theme = next;
      try {
        if (next === 'system') localStorage.removeItem(THEME_KEY);
        else localStorage.setItem(THEME_KEY, next);

      applyTheme(next);
      renderApp();

    function fmtStamp(v) {

    function postMetaHtml(p) {

    // Adds the opening animation only when a modal first appears, not on every re-render.

    // The picture used on calendar tiles, board cards and table rows:

    function postCover(p) {
      if (p.assets && p.assets.length) return { asset: p.assets[0], isRef: false, count: p.assets.length };
      if (p.refAssets && p.refAssets.length) return { asset: p.refAssets[0], isRef: true, count: p.refAssets.length };
      return null;
    }

    function formatBytes(n) {
      if (n >= 1024 * 1024) return (n / (1024 * 1024)).toFixed(1) + ' MB';
      return Math.max(1, Math.round(n / 1024)) + ' KB';
    }

    /* ---------- Image compression before upload ----------
       Resizes to at most 2048 px on the long side and re-encodes as JPEG (PNG if it has
       transparency). Keeps the original when it's already small, when the browser can't
       read it (e.g. HEIC on Chrome), or when the result wouldn't be smaller. */
    var COMPRESS_MAX_DIM = 2048;
    var COMPRESS_QUALITY = 0.85;
    var COMPRESS_MIN_BYTES = 300 * 1024;

    function compressImage(file) {
      return new Promise(function(resolve) {
        var compressible = /^image\/(jpeg|png|webp|bmp)$/i.test(file.type);
        if (!compressible || file.size < COMPRESS_MIN_BYTES || typeof createImageBitmap !== 'function') {
          resolve(file);
          return;
        }
        createImageBitmap(file).then(function(bmp) {
          var scale = Math.min(1, COMPRESS_MAX_DIM / Math.max(bmp.width, bmp.height));
          var w = Math.max(1, Math.round(bmp.width * scale));
          var h = Math.max(1, Math.round(bmp.height * scale));
          var cv = document.createElement('canvas');
          cv.width = w;
          cv.height = h;
          var ctx = cv.getContext('2d');
          ctx.drawImage(bmp, 0, 0, w, h);
          if (bmp.close) bmp.close();
          var type = (file.type === 'image/png' && hasTransparency(ctx, w, h)) ? 'image/png' : 'image/jpeg';
          cv.toBlob(function(blob) {
            if (!blob || blob.size >= file.size) {
              resolve(file);
              return;
            }
            var name = file.name.replace(/\.[^.]+$/, '') + (type === 'image/png' ? '.png' : '.jpg');
            resolve(new File([blob], name, { type: type, lastModified: Date.now() }));
          }, type, COMPRESS_QUALITY);
        }).catch(function() { resolve(file); });
      });
    }

    function hasTransparency(ctx, w, h) {
      var data = ctx.getImageData(0, 0, w, h).data;
      for (var i = 3; i < data.length; i += 4 * 16) {
        if (data[i] < 250) return true;
      }
      return false;
    }

    /* ---------- Trusted devices (skip the emailed code on browsers that passed it) ---------- */
    function deviceLabel() {
      var ua = navigator.userAgent || '';
      var browser = /Edg\//.test(ua) ? 'Edge' : /Chrome\//.test(ua) ? 'Chrome' : /Firefox\//.test(ua) ? 'Firefox' : /Safari\//.test(ua) ? 'Safari' : 'Browser';
      var os = /iPhone|iPad/.test(ua) ? 'iPhone/iPad' : /Android/.test(ua) ? 'Android' : /Mac OS X/.test(ua) ? 'Mac' : /Windows/.test(ua) ? 'Windows' : 'device';
      return browser + ' on ' + os;
    }
    function readDeviceMap() {
      try {
        return JSON.parse(localStorage.getItem('cocs_devices') || '{}') || {};
      } catch (e) {
        return {};
      }
    }
    function getDeviceToken(email) {
      return readDeviceMap()[String(email || '').trim().toLowerCase()] || '';
    }
    function saveDeviceToken(email, tok) {
      if (!tok || !email) return;
      var m = readDeviceMap();
      m[String(email).trim().toLowerCase()] = tok;
      try {
        localStorage.setItem('cocs_devices', JSON.stringify(m));
      } catch (e) {}
    }

    function portalUrl(token) {
      var base = String(STATE.webAppUrl || location.origin).replace(/\/+$/, '');
      return base + '/app?t=' + token;
    }

    /* ========================================================================
       INITIALIZATION & URL TOKEN DETECTION
       ======================================================================== */
    function initApp() {
      try {
        var params = new URLSearchParams(location.search);
        STATE.clientToken = String(params.get('t') || '').trim();
      } catch (e) {
        STATE.clientToken = '';
      }
      applyTheme(getThemePref());
      bootFromServer();
    }

    function bootFromServer() {
      callApi('boot', {})
        .then(function(data) {
          APP_BOOTED = true;
          clearTimeout(BOOT_FALLBACK_TIMER);
          applyBootState(data);
        })
        .catch(function(err) {
          APP_BOOTED = true;
          clearTimeout(BOOT_FALLBACK_TIMER);
          renderFatalScreen(err.message || 'Failed to initialize workspace.');
        });
    }

    function applyBootState(data) {
      STATE.mode = data.mode;
      STATE.agencyName = data.agencyName || 'Clientflow';
      if (data.authError) STATE.authMessage = data.authError;

      if (data.mode === 'agency') {
        STATE.user = data.user;
        STATE.webAppUrl = data.webAppUrl || '';
        STATE.today = data.today || new Date().toISOString().slice(0, 10);
        STATE.calCursor = STATE.calCursor || STATE.today;
        STATE.settings = data.settings || {};
        STATE.agencyName = STATE.settings.agencyName || STATE.agencyName;
        STATE.team = data.team || [];
        STATE.tags = data.tags || [];
        STATE.clients = data.clients || [];
        STATE.posts = data.posts || [];
        STATE.comments = data.comments || [];
        STATE.activity = data.activity || [];
        STATE.invoices = data.invoices || [];
        STATE.isAdmin = Boolean(data.isAdmin);
        STATE.isBilling = Boolean(data.isBilling);
      } else if (data.mode === 'portal') {
        STATE.rootClient = data.rootClient;
        STATE.portalAccess = data.rootClient && data.rootClient.access === 'edit' ? 'edit' : 'view';
        STATE.clients = data.clients || [];
        STATE.tags = data.tags || [];
        STATE.posts = data.posts || [];
        STATE.comments = data.comments || [];
        STATE.today = new Date().toISOString().slice(0, 10);
        STATE.calCursor = STATE.today;
        if (STATE.clients.length > 0 && !getClient(STATE.selectedClientId)) {
          STATE.selectedClientId = STATE.clients[0].id;
        }
        if (STATE.subView !== 'calendar' && STATE.subView !== 'board') {
          STATE.subView = 'calendar';
        }
      }
      renderApp();
    }

    /* ========================================================================
       ROOT RENDERER
       ======================================================================== */
    function renderApp() {
      var app = document.getElementById('app');
      if (!app) return;
      var html;
      if (STATE.mode === 'setup') html = renderSetupScreen();
      else if (STATE.mode === 'login') html = renderLoginScreen();
      else if (STATE.mode === 'code') html = renderCodeScreen();
      else if (STATE.mode === 'portal') html = renderPortalWorkspace();
      else if (STATE.mode === 'agency') html = renderAgencyWorkspace();
      else return;
      app.innerHTML = html;

      // Entrance animation only when the view changes, not on every keystroke re-render.
      var viewKey = [STATE.mode, STATE.nav, STATE.selectedClientId, STATE.subView, STATE.settingsTab, STATE.calMode].join('|');
      if (viewKey !== STATE.viewKey) {
        STATE.viewKey = viewKey;
        var main = app.querySelector('.main-area');
        if (main) {
          main.classList.add('animate-in');
          var items = main.querySelectorAll('.board-card, .grid-cards > .card');
          for (var i = 0; i < items.length; i++) items[i].style.setProperty('--i', Math.min(i, 12));
        }
      }
    }

    /* ========================================================================
       SETUP & LOGIN SCREENS
       ======================================================================== */
    function renderSetupScreen() {
      return '<div class="auth-screen"><div class="auth-card">' +
        '<div style="display:flex;align-items:center;gap:10px;margin-bottom:16px">' +
          '<div class="logo-mark"><span></span><span></span><span></span><span></span><span></span></div>' +
          '<span class="brand-title">' + esc(STATE.agencyName) + '</span>' +
          '<span style="margin-left:auto">' + themeButtonHtml() + '</span>' +
        '</div>' +
        '<h1 style="font-size:20px;margin:0 0 6px 0">Set up your workspace</h1>' +
        '<p style="color:var(--text-muted);font-size:13px;margin:0 0 18px 0">Enter the setup code you saved as the <code>SETUP_CODE</code> environment variable on the server to create the first Admin account.</p>' +
        '<form onsubmit="submitSetupAdmin(event)" style="display:flex;flex-direction:column;gap:12px">' +
          '<div><label class="field-label">Setup code</label><input type="text" id="setup-code" required placeholder="Setup code" autocomplete="off"></div>' +
          '<div><label class="field-label">Your name</label><input type="text" id="setup-name" required placeholder="Alex Morgan"></div>' +
          '<div><label class="field-label">Email address</label><input type="email" id="setup-email" required placeholder="alex@agency.com"></div>' +
          '<div><label class="field-label">Password (min 8 chars)</label>' + pwField('id="setup-pass" required minlength="8" autocomplete="new-password"') + '</div>' +
          '<div><label class="field-label">Confirm password</label>' + pwField('id="setup-confirm" required minlength="8" autocomplete="new-password"') + '</div>' +
          '<button type="submit" class="btn-primary" id="setup-btn" style="justify-content:center;margin-top:6px">Create admin &amp; open workspace</button>' +
        '</form>' +
      '</div></div>';
    }

    function submitSetupAdmin(e) {
      e.preventDefault();
      var pass = document.getElementById('setup-pass').value;
      var conf = document.getElementById('setup-confirm').value;
      if (pass !== conf) {
        showToast('Passwords do not match.', 'error');
        return;
      }
      var btn = document.getElementById('setup-btn');
      btn.disabled = true;
      btn.textContent = 'Setting up…';
      callApi('setupAdmin', {
        setupCode: document.getElementById('setup-code').value,
        name: document.getElementById('setup-name').value,
        email: document.getElementById('setup-email').value,
        password: pass
      }).then(function(data) {
        saveDeviceToken(document.getElementById('setup-email').value, data.deviceToken);
        setSessionToken(data.sessionToken);
        applyBootState(data);
        showToast('Workspace ready. Welcome!', 'success');
      }).catch(function(err) {
        btn.disabled = false;
        btn.textContent = 'Create admin & open workspace';
        showToast(err.message, 'error');
      });
    }

    function renderLoginScreen() {
      var banner = STATE.authMessage
        ? '<div style="background:var(--danger-soft);color:var(--danger);padding:10px 12px;border-radius:var(--radius);font-size:13px;margin-bottom:14px">' + esc(STATE.authMessage) + '</div>'
        : '';
      return '<div class="auth-screen"><div class="auth-card">' +
        '<div style="display:flex;align-items:center;gap:10px;margin-bottom:16px">' +
          '<div class="logo-mark"><span></span><span></span><span></span><span></span><span></span></div>' +
          '<span class="brand-title">' + esc(STATE.agencyName) + '</span>' +
          '<span style="margin-left:auto">' + themeButtonHtml() + '</span>' +
        '</div>' +
        '<h1 style="font-size:20px;margin:0 0 6px 0">Sign in to your workspace</h1>' +
        '<p style="color:var(--text-muted);font-size:13px;margin:0 0 18px 0">Enter your team email and password.</p>' +
        banner +
        '<form onsubmit="submitLogin(event)" style="display:flex;flex-direction:column;gap:12px">' +
          '<div><label class="field-label">Email address</label><input type="email" id="login-email" required autocomplete="username" value="' + esc(STATE.lastLoginEmail || '') + '"></div>' +
          '<div><label class="field-label">Password</label>' + pwField('id="login-pass" required autocomplete="current-password"') + '</div>' +
          '<button type="submit" class="btn-primary" id="login-btn" style="justify-content:center;margin-top:6px">Sign in</button>' +
        '</form>' +
        '<div style="margin-top:14px;text-align:center;font-size:12.5px"><a href="/" style="color:var(--text-soft)">← Back to home</a></div>' +
      '</div></div>';
    }

    function renderCodeScreen() {
      var l = STATE.login || {};
      return '<div class="auth-screen"><div class="auth-card">' +
        '<div style="display:flex;align-items:center;gap:10px;margin-bottom:16px">' +
          '<div class="logo-mark"><span></span><span></span><span></span><span></span><span></span></div>' +
          '<span class="brand-title">' + esc(STATE.agencyName) + '</span>' +
          '<span style="margin-left:auto">' + themeButtonHtml() + '</span>' +
        '</div>' +
        '<div style="font-size:34px;line-height:1;margin-bottom:10px" aria-hidden="true">✉️</div>' +
        '<h1 style="font-size:20px;margin:0 0 6px 0">Check your email</h1>' +
        '<p style="color:var(--text-muted);font-size:13px;margin:0 0 18px 0">This is a new device, so we sent a 6-digit code to <strong>' + esc(l.emailHint || 'your email') + '</strong>. It expires in 10 minutes.</p>' +
        '<form onsubmit="submitLoginCode(event)" style="display:flex;flex-direction:column;gap:12px">' +
          '<input type="text" id="login-code" class="otp-input" inputmode="numeric" autocomplete="one-time-code" maxlength="6" required placeholder="••••••" aria-label="6-digit code" oninput="this.value=this.value.replace(/\\D/g,\'\').slice(0,6); if(this.value.length===6) submitLoginCode();">' +
          '<label style="display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-muted);cursor:pointer"><input type="checkbox" id="login-remember" checked> Trust this device for 30 days</label>' +
          '<button type="submit" class="btn-primary" id="code-btn" style="justify-content:center">Verify &amp; sign in</button>' +
        '</form>' +
        '<div style="display:flex;justify-content:space-between;gap:8px;margin-top:14px;flex-wrap:wrap">' +
          '<button type="button" class="btn-ghost btn-sm" onclick="backToLogin()">← Use another account</button>' +
          '<button type="button" class="btn-ghost btn-sm" id="resend-btn" onclick="resendLoginCode()">Resend code</button>' +
        '</div>' +
      '</div></div>';
    }

    function submitLogin(e) {
      e.preventDefault();
      STATE.authMessage = '';
      var btn = document.getElementById('login-btn');
      var email = document.getElementById('login-email').value.trim();
      STATE.lastLoginEmail = email;
      btn.disabled = true;
      btn.textContent = 'Signing in…';
      callApi('login', {
        email: email,
        password: document.getElementById('login-pass').value,
        deviceToken: getDeviceToken(email),
        deviceLabel: deviceLabel()
      }).then(function(data) {
        if (data.needsCode) {
          STATE.login = { email: email, challengeId: data.challengeId, emailHint: data.emailHint };
          STATE.mode = 'code';
          renderApp();
          var codeInput = document.getElementById('login-code');
          if (codeInput) codeInput.focus();
          return;
        }
        setSessionToken(data.sessionToken);
        applyBootState(data);
      }).catch(function(err) {
        btn.disabled = false;
        btn.textContent = 'Sign in';
        shakeCard();
        showToast(err.message, 'error');
      });
    }

    function submitLoginCode(e) {
      if (e) e.preventDefault();
      if (STATE.codeBusy || !STATE.login) return;
      var inp = document.getElementById('login-code');
      var code = inp ? inp.value.trim() : '';
      if (code.length !== 6) {
        showToast('Enter the 6-digit code from your email.', 'error');
        return;
      }
      var remember = document.getElementById('login-remember');
      var btn = document.getElementById('code-btn');
      STATE.codeBusy = true;
      if (btn) { btn.disabled = true; btn.textContent = 'Verifying…'; }
      callApi('verifyLoginCode', {
        challengeId: STATE.login.challengeId,
        code: code,
        rememberDevice: remember ? remember.checked : true,
        deviceLabel: deviceLabel()
      }).then(function(data) {
        STATE.codeBusy = false;
        saveDeviceToken(STATE.login.email, data.deviceToken);
        STATE.login = null;
        setSessionToken(data.sessionToken);
        applyBootState(data);
        showToast('Signed in. Welcome back!', 'success');
      }).catch(function(err) {
        STATE.codeBusy = false;
        if (err.code === 'CODE_EXPIRED') {
          backToLogin(err.message);
          return;
        }
        if (btn) { btn.disabled = false; btn.textContent = 'Verify & sign in'; }
        if (inp) { inp.value = ''; inp.focus(); }
        shakeCard();
        showToast(err.message, 'error');
      });
    }

    function resendLoginCode() {
      if (!STATE.login) return;
      var btn = document.getElementById('resend-btn');
      if (btn) btn.disabled = true;
      callApi('resendLoginCode', { challengeId: STATE.login.challengeId })
        .then(function(res) {
          showToast('New code sent to ' + res.emailHint, 'success');
          setTimeout(function() { var b = document.getElementById('resend-btn'); if (b) b.disabled = false; }, 30000);
        })
        .catch(function(err) {
          if (err.code === 'CODE_EXPIRED') { backToLogin(err.message); return; }
          if (btn) btn.disabled = false;
          showToast(err.message, 'error');
        });
    }

    function backToLogin(message) {
      STATE.login = null;
      STATE.mode = 'login';
      STATE.authMessage = message || '';
      renderApp();
    }

    function shakeCard() {
      var card = document.querySelector('.auth-card');
      if (!card) return;
      card.classList.remove('shake');
      void card.offsetWidth;
      card.classList.add('shake');
    }
