            '<div><label class="field-label">Likes</label><input type="number" value="' + esc(m.likes) + '" oninput="syncEditorMetric(\'likes\', this.value)"></div>' +
            '<div><label class="field-label">Comments</label><input type="number" value="' + esc(m.comments) + '" oninput="syncEditorMetric(\'comments\', this.value)"></div>' +
            '<div><label class="field-label">Shares</label><input type="number" value="' + esc(m.shares) + '" oninput="syncEditorMetric(\'shares\', this.value)"></div>' +
          '</div>' +
        '</div>';
      }

      var sidePanelHtml = '';
      if (p.id) {
        var postComments = STATE.comments.filter(function(c) { return c.postId === p.id; });
        var postActivity = STATE.activity.filter(function(ac) { return ac.postId === p.id; }).slice().reverse();

        sidePanelHtml = '<div class="editor-side">' +
          '<div class="sub-tabs" style="margin-bottom:12px">' +
            '<button type="button" class="sub-tab ' + (STATE.sideTab === 'comments' ? 'active' : '') + '" onclick="STATE.sideTab=\'comments\';renderPostEditorModal()">Comments (' + postComments.length + ')</button>' +
            '<button type="button" class="sub-tab ' + (STATE.sideTab === 'history' ? 'active' : '') + '" onclick="STATE.sideTab=\'history\';renderPostEditorModal()">History (' + postActivity.length + ')</button>' +
          '</div>';

        if (STATE.sideTab === 'comments') {
          sidePanelHtml += '<div style="flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px;margin-bottom:10px">';
          if (postComments.length === 0) {
            sidePanelHtml += '<div style="color:var(--text-soft);font-size:13px">No comments yet.</div>';
          } else {
            for (var cm = 0; cm < postComments.length; cm++) {
              var cObj = postComments[cm];
              sidePanelHtml += '<div style="background:var(--surface-subtle);border:1px solid var(--border);border-radius:var(--radius);padding:8px 10px;font-size:13px">' +
                '<div style="display:flex;justify-content:space-between;font-size:11.5px;color:var(--text-soft);margin-bottom:4px">' +
                  '<strong>' + esc(cObj.author) + ' (' + esc(cObj.role) + ')</strong>' +
                  '<span>' + esc(cObj.createdAt.replace('T', ' ').substring(0, 16)) + '</span>' +
                '</div>' +
                '<div style="white-space:pre-wrap">' + esc(cObj.text) + '</div>' +
              '</div>';
            }
          }
          sidePanelHtml += '</div>' +
            '<div style="display:flex;gap:6px">' +
              '<input type="text" id="new-comment-input" placeholder="Write a comment…" onkeydown="if(event.key===\'Enter\'){event.preventDefault();submitPostComment();}">' +
              '<button type="button" onclick="submitPostComment()">Post</button>' +
            '</div>';
        } else {
          sidePanelHtml += '<div style="flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px">';
          for (var ha = 0; ha < postActivity.length; ha++) {
            var act = postActivity[ha];
            sidePanelHtml += '<div style="font-size:12.5px;border-bottom:1px solid var(--border);padding-bottom:6px">' +
              '<div><strong>' + esc(act.actor) + '</strong> ' + esc(act.action) + '</div>' +
              (act.details ? '<div style="color:var(--text-muted)">' + esc(act.details) + '</div>' : '') +
              '<div style="font-size:11px;color:var(--text-soft)">' + esc(act.createdAt.replace('T', ' ').substring(0, 16)) + '</div>' +
            '</div>';
          }
          sidePanelHtml += '</div>';
        }
        sidePanelHtml += '</div>';
      }

      var root = document.getElementById('modal-root');
      root.innerHTML = '<div class="modal-backdrop" onclick="if(event.target===this)closeModal(false)">' +
        '<div class="modal-box ' + (p.id ? 'modal-xl' : '') + '">' +
          '<div class="modal-header">' +
            '<h3>' + (p.id ? 'Edit post' : 'Create post') + (client ? ' — ' + esc(client.name) : '') + '</h3>' +
            '<button type="button" class="btn-sm btn-ghost" onclick="closeModal(true)">✕</button>' +
          '</div>' +
          '<div class="modal-body">' +
            '<div class="' + (p.id ? 'editor-split' : '') + '">' +
              '<div style="display:flex;flex-direction:column;gap:12px">' +
                '<div>' +
                  '<label class="field-label">Post copy</label>' +
                  '<textarea rows="4" placeholder="Write your post caption, hooks, and hashtags…" oninput="syncEditorField(\'text\', this.value)">' + esc(p.text) + '</textarea>' +
                '</div>' +
                '<div>' +
                  '<label class="field-label">Media assets (carousel order — max 20 MB per image/video)</label>' +
                  '<div class="dropzone" id="asset-dropzone" onclick="document.getElementById(\'asset-file-input\').click()" ondragover="event.preventDefault();this.classList.add(\'drag-active\')" ondragleave="this.classList.remove(\'drag-active\')" ondrop="handleAssetDrop(event)">' +
                    '<input type="file" id="asset-file-input" multiple accept="image/*,video/*" style="display:none" onchange="handleAssetFiles(this.files)">' +
                    '<div id="upload-status-label" style="font-weight:600;color:var(--text-muted)">Click to upload, drag files here, or press Ctrl/Cmd+V to paste an image</div>' +
                  '</div>' +
                  '<div style="display:flex;gap:6px;margin-top:8px">' +
                    '<input type="text" id="drive-link-input" placeholder="Or paste a Google Drive link (shared as &quot;Anyone with the link&quot;)…">' +
                    '<button type="button" class="btn-sm" onclick="addDriveLinkAsset()">Add Drive file</button>' +
                  '</div>' +
                  assetsHtml +
                '</div>' +
                '<div>' +
                  '<label class="field-label">Platforms</label>' +
                  '<div style="display:flex;flex-wrap:wrap;gap:6px">' +
                    platforms.map(function(pl) {
                      var active = p.platforms.indexOf(pl) !== -1;
                      return '<button type="button" class="btn-sm ' + (active ? 'btn-primary' : '') + '" onclick="toggleEditorPlatform(\'' + esc(pl) + '\')">' + esc(pl) + '</button>';
                    }).join('') +
                  '</div>' +
                '</div>' +
                '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px">' +
                  '<div><label class="field-label">Status</label><select onchange="syncEditorField(\'status\', this.value);renderPostEditorModal()">' +
                    statuses.map(function(s) { return '<option value="' + esc(s) + '" ' + (p.status === s ? 'selected' : '') + '>' + esc(s) + '</option>'; }).join('') +
                  '</select></div>' +
                  '<div><label class="field-label">Assignee</label><select onchange="syncEditorField(\'assignee\', this.value)">' +
                    '<option value="">Unassigned</option>' +
                    STATE.team.map(function(tm) { return '<option value="' + esc(tm.email) + '" ' + (p.assignee === tm.email ? 'selected' : '') + '>' + esc(tm.name) + '</option>'; }).join('') +
                  '</select></div>' +
                  '<div><label class="field-label">Date</label><input type="date" value="' + esc(p.date) + '" oninput="syncEditorField(\'date\', this.value)"></div>' +
                  '<div><label class="field-label">Time</label><input type="time" value="' + esc(p.time) + '" oninput="syncEditorField(\'time\', this.value)"></div>' +
                '</div>' +
                '<div>' +
                  '<label class="field-label">Tags (comma-separated)</label>' +
                  '<input type="text" value="' + esc(p.tags.join(', ')) + '" placeholder="launch, q4, reel" oninput="syncEditorTags(this.value)">' +
                '</div>' +

                publishedHtml +

              sidePanelHtml +
            '</div>' +
          '</div>' +
          '<div class="modal-footer">' +
            '<div>' +
              (p.id ? (STATE.confirmDeletePost
                ? '<button type="button" class="btn-danger" onclick="confirmDeletePostNow()">Click again to permanently delete</button>'
                : '<button type="button" style="color:var(--danger)" onclick="STATE.confirmDeletePost=true;renderPostEditorModal()">Delete post</button>') : '') +
            '</div>' +
            '<div style="display:flex;gap:8px">' +
              '<button type="button" onclick="closeModal(true)">Cancel</button>' +
              '<button type="button" class="btn-primary" id="save-post-btn" onclick="saveEditorPost()">Save post</button>' +
            '</div>' +
          '</div>' +
        '</div>' +
      '</div>';
    }

    function syncEditorField(k, v) {
      if (!EDITOR_POST) return;
      EDITOR_POST[k] = v;
      STATE.editorDirty = true;
    }
    function syncEditorTags(val) {
      if (!EDITOR_POST) return;
      EDITOR_POST.tags = String(val || '').split(',').map(function(t) { return t.trim(); }).filter(Boolean);
      STATE.editorDirty = true;
    }
    function syncEditorMetric(k, v) {
      if (!EDITOR_POST) return;
      if (!EDITOR_POST.metrics) EDITOR_POST.metrics = {};
      EDITOR_POST.metrics[k] = v;
      STATE.editorDirty = true;
    }
    function toggleEditorPlatform(pl) {
      if (!EDITOR_POST) return;
      var idx = EDITOR_POST.platforms.indexOf(pl);
      if (idx === -1) EDITOR_POST.platforms.push(pl);
      else EDITOR_POST.platforms.splice(idx, 1);
      STATE.editorDirty = true;
      renderPostEditorModal();
    }
    function moveEditorAsset(idx, dir) {
      var target = idx + dir;
      if (target < 0 || target >= EDITOR_POST.assets.length) return;
      var tmp = EDITOR_POST.assets[idx];
      EDITOR_POST.assets[idx] = EDITOR_POST.assets[target];
      EDITOR_POST.assets[target] = tmp;
      STATE.editorDirty = true;
      renderPostEditorModal();
    }
    function removeEditorAsset(idx) {
      EDITOR_POST.assets.splice(idx, 1);
      STATE.editorDirty = true;
      renderPostEditorModal();
    }

    function handleAssetDrop(e) {
      e.preventDefault();
      var dz = document.getElementById('asset-dropzone');
      if (dz) dz.classList.remove('drag-active');
      if (e.dataTransfer && e.dataTransfer.files) {
        handleAssetFiles(e.dataTransfer.files);
      }
    }

    function handleAssetFiles(fileList) {
      if (!fileList || fileList.length === 0 || !EDITOR_POST) return;
      var files = Array.prototype.slice.call(fileList);
      var lbl = document.getElementById('upload-status-label');

      var seq = Promise.resolve();
      files.forEach(function(file, idx) {
        seq = seq.then(function() {
          if (file.type.indexOf('image/') !== 0 && file.type.indexOf('video/') !== 0) {
            showToast('Rejected "' + file.name + '": only images and videos are allowed.', 'error');
            return;
          }
          if (file.size > 20 * 1024 * 1024) {
            showToast('Rejected "' + file.name + '": exceeds 20 MB limit.', 'error');
            return;
          }
          lbl = document.getElementById('upload-status-label');
          if (lbl) lbl.textContent = 'Uploading ' + (idx + 1) + ' of ' + files.length + ' (' + file.name + ')…';
          return callApi('createUpload', {
            clientId: EDITOR_POST.clientId,
            name: file.name,
            mimeType: file.type,
            size: file.size
          }).then(function(res) {
            return uploadToSignedUrl(res.uploadUrl, file).then(function() { return res; });
          }).then(function(res) {
            if (!EDITOR_POST) return;
            EDITOR_POST.assets.push(res.asset);
            STATE.editorDirty = true;
            renderPostEditorModal();
          }).catch(function(err) {
            showToast(err.message, 'error');
          });
        });
      });
      seq.then(function() {
        var finalLbl = document.getElementById('upload-status-label');
        if (finalLbl) finalLbl.textContent = 'Click to upload, drag files here, or press Ctrl/Cmd+V to paste an image';
      });
    }

    // Uploads the file straight to Supabase Storage with a one-time signed URL.
    function uploadToSignedUrl(url, file) {
      var fd = new FormData();
      fd.append('cacheControl', '3600');
      fd.append('', file);
      return fetch(url, { method: 'PUT', body: fd, headers: { 'x-upsert': 'false' } })
        .catch(function() {
          throw new Error('Upload of "' + file.name + '" failed. Check your connection and try again.');
        })
        .then(function(r) {
          if (r.ok) return;
          return r.text().then(function(t) {
            throw new Error('Upload of "' + file.name + '" failed (HTTP ' + r.status + ')' + (t ? ': ' + t.substring(0, 160) : '.'));
          });
        });
    }

    // Paste image support inside Post Editor
    window.addEventListener('paste', function(e) {
      if (STATE.activeModal !== 'postEditor' || !EDITOR_POST) return;
      var items = (e.clipboardData && e.clipboardData.items) ? e.clipboardData.items : [];
      var files = [];
      for (var i = 0; i < items.length; i++) {
        if (items[i].kind === 'file') {
          var f = items[i].getAsFile();
          if (f) files.push(f);
        }
      }
      if (files.length > 0) {
        handleAssetFiles(files);
      }
    });

    function addDriveLinkAsset() {
      var inp = document.getElementById('drive-link-input');
      var val = inp ? inp.value.trim() : '';
      if (!val) return;
      inp.disabled = true;
      callApi('resolveDriveLink', { url: val })
        .then(function(res) {
          EDITOR_POST.assets.push(res.asset);
          STATE.editorDirty = true;
          renderPostEditorModal();
          showToast('Added Drive file', 'success');
        })
        .catch(function(err) {
          inp.disabled = false;
          showToast(err.message, 'error');
        });
    }

    function saveEditorPost() {
      var btn = document.getElementById('save-post-btn');
      if (btn) { btn.disabled = true; btn.textContent = 'Saving…'; }
      callApi('savePost', EDITOR_POST, true)
        .then(function(res) {
          upsertLocalPost(res.post, res.activity);
          if (res.clientToken) {
            var cli = getClient(res.post.clientId);
            if (cli) { cli.token = res.clientToken; cli.hasToken = true; }
          }
          closeModal(true);
          renderApp();
          showToast('Post saved', 'success');
        })
        .catch(function(err) {
          if (btn) { btn.disabled = false; btn.textContent = 'Save post'; }
          showToast(err.message, 'error');
        });
    }

    function confirmDeletePostNow() {
      if (!EDITOR_POST || !EDITOR_POST.id) return;
      callApi('deletePost', { postId: EDITOR_POST.id })
        .then(function(res) {
          STATE.posts = STATE.posts.filter(function(p) { return p.id !== res.deletedId; });
          if (res.activity) STATE.activity.push(res.activity);
          closeModal(true);
          renderApp();
          showToast('Post deleted', 'success');
        })
        .catch(function(err) { showToast(err.message, 'error'); });
    }

    function submitPostComment() {
      var inp = document.getElementById('new-comment-input');
      var txt = inp ? inp.value.trim() : '';
      if (!txt || !EDITOR_POST || !EDITOR_POST.id) return;
      inp.disabled = true;
      callApi('addComment', { postId: EDITOR_POST.id, text: txt })
        .then(function(res) {
          STATE.comments.push(res.comment);
          if (res.activity) STATE.activity.push(res.activity);
          renderPostEditorModal();
        })
        .catch(function(err) {
          inp.disabled = false;
          showToast(err.message, 'error');
        });
    }

    function upsertLocalPost(post, activity) {
      var found = false;
      for (var i = 0; i < STATE.posts.length; i++) {
        if (STATE.posts[i].id === post.id) {
          STATE.posts[i] = post;
          found = true;
          break;
        }
      }
      if (!found) STATE.posts.push(post);
      if (activity) STATE.activity.push(activity);
    }

    function copyShareLink() {
      var inp = document.getElementById('share-url-input');
      if (!inp) return;
      inp.select();
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(inp.value).then(function() { showToast('Portal link copied', 'success'); });
      } else {
        document.execCommand('copy');
        showToast('Portal link copied', 'success');
      }
    }

    function manageToken(clientId, mode) {
      callApi('manageClientToken', { clientId: clientId, mode: mode })
        .then(function(res) {
          var c = getClient(clientId);
          if (c) { c.token = res.token; c.hasToken = Boolean(res.token); }
          if (res.webAppUrl) STATE.webAppUrl = res.webAppUrl;
          openShareModal(clientId);
          showToast(mode === 'disable' ? 'Share link turned off' : 'Share link ready', 'success');
        })
        .catch(function(err) { showToast(err.message, 'error'); });

      callApi('addComment', { postId: postId, text: txt })

    function submitPortalDecision(postId, decision) {
      var box = document.getElementById('portal-decision-comment');
      var comment = box ? box.value.trim() : '';
      if (decision === 'changes' && !comment) {
        showToast('Please enter a comment explaining the changes needed.', 'error');
        return;
      }
      callApi('clientDecision', { postId: postId, decision: decision, comment: comment })
        .then(function(res) {
          upsertLocalPost(res.post, null);
          if (res.comment) STATE.comments.push(res.comment);
          closeModal(true);
          renderApp();
          showToast(decision === 'approve' ? 'Post approved!' : 'Changes requested', 'success');
        })
        .catch(function(err) { showToast(err.message, 'error'); });
    }

    function renderClientInvoicesView(client) {
      var list = STATE.invoices.filter(function(inv) { return inv.clientId === client.id; });
      list.sort(function(a, b) { return b.number.localeCompare(a.number); });

      var effCurr = client.currency || (client.parentId && getClient(client.parentId) ? getClient(client.parentId).currency : '') || STATE.settings.defaultCurrency || 'USD';
      var totalInvoiced = 0, totalReceived = 0, totalOutstanding = 0, overdueCount = 0;

      for (var i = 0; i < list.length; i++) {
        var t = computeInvoiceTotals(list[i]).total;
        totalInvoiced += t;
        if (list[i].status === 'Paid') totalReceived += t;
        else {
          totalOutstanding += t;
          if (isInvoiceOverdue(list[i])) overdueCount++;
        }
      }

      var html = '<div class="grid-cards" style="margin-bottom:18px">' +
        '<div class="card"><div style="font-size:12px;color:var(--text-muted);font-weight:600">Invoiced</div><div style="font-size:22px;font-weight:700;margin-top:4px">' + esc(formatCurrency(totalInvoiced, effCurr)) + '</div></div>' +
        '<div class="card"><div style="font-size:12px;color:var(--text-muted);font-weight:600">Received</div><div style="font-size:22px;font-weight:700;margin-top:4px;color:var(--st-published)">' + esc(formatCurrency(totalReceived, effCurr)) + '</div></div>' +
        '<div class="card"><div style="font-size:12px;color:var(--text-muted);font-weight:600">Outstanding (' + overdueCount + ' overdue)</div><div style="font-size:22px;font-weight:700;margin-top:4px;color:var(--st-review)">' + esc(formatCurrency(totalOutstanding, effCurr)) + '</div></div>' +
      '</div>';

      if (list.length === 0) {
        html += '<div class="card" style="color:var(--text-soft);text-align:center;padding:32px">No invoices for ' + esc(client.name) + ' yet. Click "+ Add invoice" to create one.</div>';
        return html;
      }

      html += '<div class="table-wrap"><table class="data-table"><thead><tr>' +
        '<th>Number</th><th>Issue date</th><th>Due date</th><th>Status</th><th>Total</th><th style="text-align:right">Actions</th>' +
      '</tr></thead><tbody>';

      for (var j = 0; j < list.length; j++) {
        var inv = list[j];
        var overdue = isInvoiceOverdue(inv);
        var tot = computeInvoiceTotals(inv).total;
        html += '<tr>' +
          '<td style="font-weight:600">' + esc(inv.number) + '</td>' +
          '<td>' + esc(inv.issueDate) + '</td>' +
          '<td>' + esc(inv.dueDate) + '</td>' +
          '<td><span class="status-pill" style="background:' + (inv.status === 'Paid' ? 'var(--st-published)' : (overdue ? 'var(--danger)' : 'var(--st-review)')) + '">' + esc(overdue ? 'Overdue' : inv.status) + '</span></td>' +
          '<td style="font-weight:600">' + esc(formatCurrency(tot, inv.currency)) + '</td>' +
          '<td style="text-align:right;white-space:nowrap">' +
            '<div style="display:inline-flex;gap:6px;flex-wrap:wrap;justify-content:flex-end">' +
              '<button class="btn-sm" onclick="toggleInvoicePaid(\'' + esc(inv.id) + '\', \'' + (inv.status === 'Paid' ? 'Pending' : 'Paid') + '\')">' + (inv.status === 'Paid' ? 'Mark unpaid' : 'Mark paid') + '</button>' +
              '<button class="btn-sm" onclick="openInvoiceModal(\'' + esc(inv.id) + '\')">Edit</button>' +
              '<button class="btn-sm" onclick="generatePdfAction(\'' + esc(inv.id) + '\', this)">PDF</button>' +
              (inv.pdfUrl ? '<a href="' + esc(inv.pdfUrl) + '" target="_blank" rel="noopener" class="btn-sm" style="text-decoration:none;border:1px solid var(--border-strong);border-radius:6px;padding:4px 9px">Open PDF ↗</a>' : '') +
              '<button class="btn-sm btn-primary" onclick="sendInvoiceAction(\'' + esc(inv.id) + '\', this)">' + (inv.sentAt ? 'Resend' : 'Send') + '</button>' +
              '<button class="btn-sm" style="color:var(--danger)" onclick="deleteInvoiceAction(\'' + esc(inv.id) + '\', \'' + esc(inv.number) + '\')">Delete</button>' +
            '</div>' +
          '</td>' +
        '</tr>';
      }
      html += '</tbody></table></div>';
      return html;
    }

    var EDITOR_INV = null;
    function openInvoiceModal(invoiceId) {
      var client = getClient(STATE.selectedClientId);
      if (!client) return;
      var parent = client.parentId ? getClient(client.parentId) : null;
      var defaultCurr = client.currency || (parent && parent.currency) || STATE.settings.defaultCurrency || 'USD';
      var dueDays = parseInt(STATE.settings.dueDays || '14', 10) || 14;

      var existing = null;
      if (invoiceId) {
        for (var i = 0; i < STATE.invoices.length; i++) {
          if (STATE.invoices[i].id === invoiceId) { existing = STATE.invoices[i]; break; }
        }
      }

      EDITOR_INV = existing ? JSON.parse(JSON.stringify(existing)) : {
        id: '',
        clientId: client.id,
        number: '',
        issueDate: STATE.today,
        dueDate: addDaysToDateStr(STATE.today, dueDays),
        dueManuallyEdited: false,
        status: 'Pending',
        currency: defaultCurr,
        items: [{ description: '', qty: '', rate: '' }],
        taxPct: '',
        discount: '',
        notes: ''
      };
      if (existing) EDITOR_INV.dueManuallyEdited = true;
      STATE.activeModal = 'invoiceEditor';
      renderInvoiceModal();
    }

            '</div>' +
          '</div>' +
          '<div class="modal-footer">' +
            '<span></span>' +
            '<div style="display:flex;gap:8px">' +
              '<button type="button" onclick="closeModal(true)">Cancel</button>' +
              '<button type="button" class="btn-primary" id="save-inv-btn" onclick="saveInvoiceNow()">Save invoice</button>' +
            '</div>' +
          '</div>' +
        '</div>' +
      '</div>';
    }

    function renderInvoiceTotalsInner(totals, curr) {
      return '<div>Subtotal: <strong>' + esc(formatCurrency(totals.subtotal, curr)) + '</strong></div>' +
        (totals.discount > 0 ? '<div>Discount: -' + esc(formatCurrency(totals.discount, curr)) + '</div>' : '') +
        (totals.tax > 0 ? '<div>Tax: ' + esc(formatCurrency(totals.tax, curr)) + '</div>' : '') +
        '<div style="font-size:16px;margin-top:4px">Total: <strong>' + esc(formatCurrency(totals.total, curr)) + '</strong></div>';
    }

    function updateInvoiceLiveTotals() {
      var box = document.getElementById('inv-live-totals');
      if (!box || !EDITOR_INV) return;
      box.innerHTML = renderInvoiceTotalsInner(computeInvoiceTotals(EDITOR_INV), EDITOR_INV.currency);
    }

    function onInvoiceIssueDateChange(val) {
      EDITOR_INV.issueDate = val;
      if (!EDITOR_INV.dueManuallyEdited && val) {
        var dueDays = parseInt(STATE.settings.dueDays || '14', 10) || 14;
        EDITOR_INV.dueDate = addDaysToDateStr(val, dueDays);
        var dueInp = document.getElementById('inv-due-input');
        if (dueInp) dueInp.value = EDITOR_INV.dueDate;
      }
    }

    function removeInvoiceLine(idx) {
      EDITOR_INV.items.splice(idx, 1);
      renderInvoiceModal();
    }

    function saveInvoiceNow() {
      var btn = document.getElementById('save-inv-btn');
      if (btn) { btn.disabled = true; btn.textContent = 'Saving…'; }
      callApi('saveInvoice', EDITOR_INV)
        .then(function(res) {
          var found = false;
          for (var i = 0; i < STATE.invoices.length; i++) {
            if (STATE.invoices[i].id === res.invoice.id) {
              STATE.invoices[i] = res.invoice;
              found = true;
              break;
            }
          }
          if (!found) STATE.invoices.push(res.invoice);
          closeModal(true);
          renderApp();
          showToast('Invoice saved', 'success');
        })
        .catch(function(err) {
          if (btn) { btn.disabled = false; btn.textContent = 'Save invoice'; }
          showToast(err.message, 'error');
        });
    }

    function toggleInvoicePaid(invId, nextStatus) {
      callApi('setInvoiceStatus', { invoiceId: invId, status: nextStatus })
        .then(function(res) {
          for (var i = 0; i < STATE.invoices.length; i++) {
            if (STATE.invoices[i].id === invId) STATE.invoices[i].status = res.status;
          }
          renderApp();
          showToast('Invoice marked ' + res.status, 'success');
        })
        .catch(function(err) { showToast(err.message, 'error'); });
    }

    function generatePdfAction(invId, btn) {
      btn.disabled = true;
      btn.textContent = 'Generating…';
      callApi('generateInvoicePdf', { invoiceId: invId }, true)
        .then(function(res) {
          for (var i = 0; i < STATE.invoices.length; i++) {
            if (STATE.invoices[i].id === invId) {
              STATE.invoices[i].pdfFileId = res.pdfFileId;
              STATE.invoices[i].pdfUrl = res.pdfUrl;
            }
          }
          renderApp();
          showToast('Invoice PDF generated', 'success');
        })
        .catch(function(err) {
          btn.disabled = false;
          btn.textContent = 'PDF';
          showToast(err.message, 'error');
        });
    }

    function sendInvoiceAction(invId, btn) {
      if (!confirm('Generate PDF and email this invoice to the client notification email?')) return;
      btn.disabled = true;
      btn.textContent = 'Sending…';
      callApi('sendInvoice', { invoiceId: invId }, true)
        .then(function(res) {
          for (var i = 0; i < STATE.invoices.length; i++) {
            if (STATE.invoices[i].id === invId) {
              STATE.invoices[i].pdfFileId = res.pdfFileId;
              STATE.invoices[i].pdfUrl = res.pdfUrl;
              STATE.invoices[i].sentAt = res.sentAt;
            }
          }
          renderApp();
          showToast('Invoice emailed to client', 'success');
        })
        .catch(function(err) {
          btn.disabled = false;
          btn.textContent = 'Send';
          showToast(err.message, 'error');
        });
    }

    function deleteInvoiceAction(invId, invNum) {
      if (!confirm('Delete invoice ' + invNum + ' and its PDF?')) return;
      callApi('deleteInvoice', { invoiceId: invId })
        .then(function() {
          STATE.invoices = STATE.invoices.filter(function(x) { return x.id !== invId; });
          renderApp();
          showToast('Invoice deleted', 'success');
        })
        .catch(function(err) { showToast(err.message, 'error'); });
    }

    /* ========================================================================
       ADMIN: CLIENT SETTINGS & TEAM / WORKSPACE SETTINGS
       ======================================================================== */
    function openClientModal(clientId, parentId) {
      var existing = clientId ? getClient(clientId) : null;
      var c = existing || { id: '', name: '', parentId: parentId || '', notifyEmail: '', currency: '', archived: false };
      STATE.activeModal = 'clientModal';

      var root = document.getElementById('modal-root');
      root.innerHTML = '<div class="modal-backdrop" onclick="if(event.target===this)closeModal(true)">' +
        '<div class="modal-box">' +
          '<div class="modal-header">' +
            '<h3>' + (c.id ? 'Client settings — ' + esc(c.name) : (c.parentId ? 'Add sub-client' : 'Add parent client')) + '</h3>' +
            '<button class="btn-sm btn-ghost" onclick="closeModal(true)">✕</button>' +
          '</div>' +
          '<div class="modal-body" style="display:flex;flex-direction:column;gap:12px">' +
            '<div><label class="field-label">Client name</label><input type="text" id="cli-name" value="' + esc(c.name) + '" placeholder="Acme Corp"></div>' +
            '<div><label class="field-label">Notification email (for reviews &amp; invoices)</label><input type="email" id="cli-email" value="' + esc(c.notifyEmail) + '" placeholder="approvals@client.com"></div>' +
            '<div><label class="field-label">Default currency (leave blank to inherit)</label><input type="text" id="cli-curr" value="' + esc(c.currency) + '" placeholder="' + esc(STATE.settings.defaultCurrency || 'USD') + '"></div>' +
            (c.id ? '<div style="border-top:1px solid var(--border);padding-top:12px;display:flex;justify-content:space-between;align-items:center">' +
              '<div><strong>' + (c.archived ? 'Restore client' : 'Archive client') + '</strong><div style="font-size:12px;color:var(--text-soft)">' + (c.archived ? 'Re-enable workspace and portal link.' : 'Hides from sidebar and disables share links.') + '</div></div>' +
              '<button type="button" onclick="toggleArchiveClientNow(\'' + esc(c.id) + '\', ' + (!c.archived) + ')">' + (c.archived ? 'Restore' : 'Archive') + '</button>' +
            '</div>' : '') +
            (c.id && STATE.isAdmin ? '<div style="border-top:1px solid var(--border);padding-top:12px">' +
              '<strong style="color:var(--danger)">Permanent delete (Admin only)</strong>' +
              '<div style="font-size:12px;color:var(--text-soft);margin-bottom:8px">Removes all posts, comments, activity, and invoices (uploaded files are kept). Type <strong>' + esc(c.name) + '</strong> to confirm:</div>' +
              '<div style="display:flex;gap:8px"><input type="text" id="del-cli-confirm" placeholder="Type exact client name"><button type="button" class="btn-danger" onclick="deleteClientPermanentNow(\'' + esc(c.id) + '\')">Delete permanently</button></div>' +
            '</div>' : '') +
          '</div>' +
          '<div class="modal-footer">' +
            '<span></span>' +
            '<div style="display:flex;gap:8px">' +
              '<button type="button" onclick="closeModal(true)">Cancel</button>' +
              '<button type="button" class="btn-primary" onclick="saveClientModalNow(\'' + esc(c.id) + '\', \'' + esc(c.parentId) + '\')">Save client</button>' +
            '</div>' +
          '</div>' +
        '</div>' +
      '</div>';
    }

    function saveClientModalNow(id, parentId) {
      callApi('saveClient', {
        id: id,
        parentId: parentId,
        name: document.getElementById('cli-name').value,
        notifyEmail: document.getElementById('cli-email').value,
        currency: document.getElementById('cli-curr').value
      }).then(function(res) {
        var found = false;
        for (var i = 0; i < STATE.clients.length; i++) {
          if (STATE.clients[i].id === res.client.id) {
            STATE.clients[i] = res.client;
            found = true;
            break;
          }
        }
        if (!found) STATE.clients.push(res.client);
        STATE.nav = 'client';
        STATE.selectedClientId = res.client.id;
        closeModal(true);
        renderApp();
        showToast('Client saved', 'success');
      }).catch(function(err) { showToast(err.message, 'error'); });
    }

    function toggleArchiveClientNow(clientId, archive) {
      callApi('archiveClient', { clientId: clientId, archive: archive })
        .then(function() {
          return callApi('boot', {});
        })
        .then(function(data) {
          applyBootState(data);
          closeModal(true);
          showToast(archive ? 'Client archived' : 'Client restored', 'success');
        })
        .catch(function(err) { showToast(err.message, 'error'); });
    }

    function deleteClientPermanentNow(clientId) {
      var typed = document.getElementById('del-cli-confirm').value;
      callApi('deleteClient', { clientId: clientId, confirmName: typed })
        .then(function() {
          STATE.nav = 'overview';
          STATE.selectedClientId = '';
          return callApi('boot', {});
        })
        .then(function(data) {
          applyBootState(data);
          closeModal(true);
          showToast('Client permanently deleted', 'success');
        })
        .catch(function(err) { showToast(err.message, 'error'); });
    }

    /* Team & Settings View */
    var DRAFT_TEAM = null;
    function renderTeamAndSettingsView() {
      if (!DRAFT_TEAM) {
        DRAFT_TEAM = STATE.team.map(function(t) {
          return { name: t.name, email: t.email, role: t.role, password: '', isExisting: true };
        });
      }
      var s = STATE.settings;
      var roles = ['Admin', 'Account Manager', 'Designer'];

      var rowsHtml = '';
      for (var i = 0; i < DRAFT_TEAM.length; i++) {
        var m = DRAFT_TEAM[i];
        rowsHtml += '<tr>' +
          '<td><input type="text" value="' + esc(m.name) + '" placeholder="Full name" oninput="DRAFT_TEAM[' + i + '].name=this.value"></td>' +
          '<td><input type="email" value="' + esc(m.email) + '" placeholder="email@agency.com" ' + (m.isExisting ? 'readonly style="background:var(--surface-subtle)"' : '') + ' oninput="DRAFT_TEAM[' + i + '].email=this.value"></td>' +
          '<td><select onchange="DRAFT_TEAM[' + i + '].role=this.value">' +
            roles.map(function(r) { return '<option value="' + r + '" ' + (m.role === r ? 'selected' : '') + '>' + r + '</option>'; }).join('') +
          '</select></td>' +
          '<td><input type="password" value="' + esc(m.password) + '" placeholder="' + (m.isExisting ? 'Leave blank to keep current' : 'Required (min 8 chars)') + '" oninput="DRAFT_TEAM[' + i + '].password=this.value"></td>' +
          '<td style="text-align:right"><button class="btn-sm" style="color:var(--danger)" onclick="DRAFT_TEAM.splice(' + i + ',1);renderApp()">Remove</button></td>' +
        '</tr>';
      }

      return '<div style="max-width:980px">' +
        '<div class="view-header">' +
          '<div><h1 style="font-size:22px;margin:0">Team &amp; settings</h1><p style="color:var(--text-muted);margin:4px 0 0 0">Manage agency branding, invoice defaults, and team member roles.</p></div>' +
          '<button class="btn-primary" id="save-team-btn" onclick="saveTeamAndSettingsNow()">Save settings</button>' +
        '</div>' +
        '<div class="card" style="margin-bottom:20px">' +
          '<h2 style="font-size:16px;margin:0 0 14px 0">Workspace settings</h2>' +
          '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px">' +
            '<div><label class="field-label">Agency name</label><input type="text" id="set-agency-name" value="' + esc(s.agencyName) + '"></div>' +
            '<div><label class="field-label">Team notification email</label><input type="email" id="set-agency-email" value="' + esc(s.agencyEmail) + '"></div>' +
            '<div><label class="field-label">Default currency</label><input type="text" id="set-curr" value="' + esc(s.defaultCurrency) + '"></div>' +
            '<div><label class="field-label">Invoice due days</label><input type="number" id="set-due-days" value="' + esc(s.dueDays) + '"></div>' +
          '</div>' +
        '</div>' +
        '<div class="card">' +
          '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">' +
            '<h2 style="font-size:16px;margin:0">Team members (' + DRAFT_TEAM.length + ')</h2>' +
            '<button class="btn-sm" onclick="DRAFT_TEAM.push({name:\'\',email:\'\',role:\'Designer\',password:\'\',isExisting:false});renderApp()">+ Add person</button>' +
          '</div>' +
          '<div class="table-wrap"><table class="data-table"><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Password</th><th></th></tr></thead><tbody>' +
            rowsHtml +
          '</tbody></table></div>' +
        '</div>' +
      '</div>';
    }

    function saveTeamAndSettingsNow() {
      var btn = document.getElementById('save-team-btn');
      if (btn) { btn.disabled = true; btn.textContent = 'Saving…'; }
      var settingsPayload = {
        agencyName: document.getElementById('set-agency-name').value,
        agencyEmail: document.getElementById('set-agency-email').value,
        defaultCurrency: document.getElementById('set-curr').value,
        dueDays: document.getElementById('set-due-days').value
      };
      callApi('saveTeamAndSettings', { settings: settingsPayload, team: DRAFT_TEAM })
        .then(function(res) {
          STATE.settings = res.settings;
          STATE.agencyName = res.settings.agencyName;
          STATE.team = res.team;
          DRAFT_TEAM = null;
          renderApp();
          showToast('Team & settings saved', 'success');
        })
        .catch(function(err) {
          if (btn) { btn.disabled = false; btn.textContent = 'Save settings'; }
          showToast(err.message, 'error');
        });
    }

    /* ========================================================================
       ACCOUNT MENU MODAL (CHANGE PASSWORD & SIGN OUT)
       ======================================================================== */
    function openAccountModal() {
      STATE.activeModal = 'account';
      var root = document.getElementById('modal-root');
      root.innerHTML = '<div class="modal-backdrop" onclick="if(event.target===this)closeModal(true)">' +
        '<div class="modal-box" style="max-width:440px">' +
          '<div class="modal-header">' +
            '<h3>Account — ' + esc(STATE.user.name) + '</h3>' +
            '<button class="btn-sm btn-ghost" onclick="closeModal(true)">✕</button>' +
          '</div>' +
          '<div class="modal-body" style="display:flex;flex-direction:column;gap:14px">' +
            '<div style="font-size:13px;color:var(--text-muted)">Signed in as <strong>' + esc(STATE.user.email) + '</strong> (' + esc(STATE.user.role) + ')</div>' +
            '<form onsubmit="submitPasswordChange(event)" style="display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--border);padding-top:12px">' +
              '<strong>Change password</strong>' +
              '<div><label class="field-label">Current password</label><input type="password" id="acc-cur-pass" required></div>' +
              '<div><label class="field-label">New password (min 8 chars)</label><input type="password" id="acc-new-pass" required minlength="8"></div>' +
              '<button type="submit" class="btn-primary" style="justify-content:center">Update password &amp; sign out other devices</button>' +
            '</form>' +
          '</div>' +
          '<div class="modal-footer">' +
            '<button type="button" class="btn-danger" onclick="signOutNow()">Sign out</button>' +
            '<button type="button" onclick="closeModal(true)">Close</button>' +
          '</div>' +
        '</div>' +
      '</div>';
    }

    function submitPasswordChange(e) {
      e.preventDefault();
      callApi('changePassword', {
        currentPassword: document.getElementById('acc-cur-pass').value,
        newPassword: document.getElementById('acc-new-pass').value
      }).then(function() {
        closeModal(true);
        showToast('Password updated. Other devices have been signed out.', 'success');
      }).catch(function(err) { showToast(err.message, 'error'); });
    }

    function signOutNow() {
      callApi('logout', {}).catch(function() {}).then(function() {
        setSessionToken('');
        STATE.mode = 'login';
        STATE.authMessage = '';
        closeModal(true);
        renderApp();
      });
    }

    /* ========================================================================
       MODAL CLOSE & ESCAPE KEY PROTECTION
       ======================================================================== */
    function closeModal(force) {
      if (STATE.activeModal === 'postEditor' && STATE.editorDirty && !force) {
        return; // Protect unsaved edits from accidental backdrop/Escape dismissal
      }
      STATE.activeModal = null;
      STATE.editorDirty = false;
      EDITOR_POST = null;
      EDITOR_INV = null;
      var root = document.getElementById('modal-root');
      if (root) root.innerHTML = '';
    }

    window.addEventListener('keydown', function(e) {
      if (e.key === 'Escape' && STATE.activeModal) {
        if (STATE.activeModal === 'postEditor' && STATE.editorDirty) {
          showToast('You have unsaved edits. Use Save post or Cancel to close.', '');
          return;
        }
        closeModal(true);
      }
    });

    // Boot application on load
    window.addEventListener('DOMContentLoaded', initApp);
  </script>
</body>
</html>
