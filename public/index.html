<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>ClientFlow</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f3f5f8;
      --surface: #ffffff;
      --surface-subtle: #f8fafc;
      --border: #e2e8f0;
      --border-strong: #cbd5e1;
      --text: #0f172a;
      --text-muted: #475569;
      --text-soft: #64748b;
      --accent: #1f5fd6;
      --accent-hover: #184bb0;
      --accent-soft: #eff6ff;
      --danger: #dc2626;
      --danger-soft: #fef2f2;
      --st-draft: #8590a3;
      --st-review: #d4880b;
      --st-approved: #1f5fd6;
      --st-scheduled: #7c4dd6;
      --st-published: #17834a;
      --radius: 8px;
      --radius-lg: 12px;
      --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.05);
      --shadow-md: 0 4px 12px rgba(15, 23, 42, 0.08);
      --shadow-lg: 0 16px 36px rgba(15, 23, 42, 0.16);
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: 'Instrument Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 14px;
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }

    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    button, input, select, textarea {
      font-family: inherit;
      font-size: 14px;
      color: inherit;
    }

    button {
      cursor: pointer;
      border: 1px solid var(--border-strong);
      background: var(--surface);
      padding: 7px 13px;
      border-radius: var(--radius);
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background 0.15s, border-color 0.15s;
    }
    button:hover:not(:disabled) { background: var(--surface-subtle); }
    button:disabled { opacity: 0.55; cursor: not-allowed; }

    .btn-primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    .btn-primary:hover:not(:disabled) {
      background: var(--accent-hover);
      border-color: var(--accent-hover);
    }
    .btn-danger {
      background: var(--danger);
      border-color: var(--danger);
      color: #fff;
    }
    .btn-danger:hover:not(:disabled) { opacity: 0.92; }
    .btn-ghost {
      border-color: transparent;
      background: transparent;
    }
    .btn-ghost:hover:not(:disabled) { background: rgba(15, 23, 42, 0.05); }
    .btn-sm { padding: 4px 9px; font-size: 12.5px; border-radius: 6px; }

    input[type="text"], input[type="email"], input[type="password"], input[type="date"], input[type="time"], input[type="number"], input[type="url"], select, textarea {
      width: 100%;
      padding: 8px 11px;
      border: 1px solid var(--border-strong);
      border-radius: var(--radius);
      background: var(--surface);
    }
    textarea { resize: vertical; min-height: 90px; }
    label.field-label {
      display: block;
      font-weight: 600;
      font-size: 12.5px;
      color: var(--text-muted);
      margin-bottom: 5px;
    }

    /* Logo Stripes */
    .logo-mark {
      display: inline-flex;
      gap: 3px;
      align-items: center;
      height: 20px;
      flex-shrink: 0;
    }
    .logo-mark span {
      width: 4px;
      height: 18px;
      border-radius: 2px;
      display: block;
    }
    .logo-mark span:nth-child(1) { background: var(--st-draft); height: 12px; }
    .logo-mark span:nth-child(2) { background: var(--st-review); height: 16px; }
    .logo-mark span:nth-child(3) { background: var(--st-approved); height: 20px; }
    .logo-mark span:nth-child(4) { background: var(--st-scheduled); height: 16px; }
    .logo-mark span:nth-child(5) { background: var(--st-published); height: 14px; }

    /* Top Bar */
    .topbar {
      height: 56px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      position: sticky;
      top: 0;
      z-index: 40;
    }
    .topbar-left, .topbar-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .brand-title {
      font-weight: 700;
      font-size: 15.5px;
      letter-spacing: -0.01em;
    }
    .nav-tab {
      border: none;
      background: transparent;
      padding: 6px 11px;
      border-radius: 6px;
      font-weight: 600;
      color: var(--text-muted);
    }
    .nav-tab.active {
      background: var(--accent-soft);
      color: var(--accent);
    }

    /* Main Workspace Layout */
    .workspace {
      display: flex;
      min-height: calc(100vh - 56px);
    }
    .sidebar {
      width: 265px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      padding: 16px 12px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .sidebar-section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 6px;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-soft);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .client-tree {
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex: 1;
      overflow-y: auto;
    }
    .tree-parent-group {
      margin-bottom: 4px;
    }
    .tree-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      text-align: left;
      padding: 7px 10px;
      border-radius: 6px;
      border: none;
      background: transparent;
      font-weight: 600;
      color: var(--text);
    }
    .tree-item:hover { background: var(--surface-subtle); }
    .tree-item.active {
      background: var(--accent-soft);
      color: var(--accent);
    }
    .tree-sub-list {
      padding-left: 14px;
      margin-top: 2px;
      border-left: 1px solid var(--border);
      margin-left: 12px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .tree-sub-item {
      font-weight: 500;
      font-size: 13.5px;
      padding: 5px 9px;
    }
    .main-area {
      flex: 1;
      padding: 24px 28px;
      min-width: 0;
      max-width: 1600px;
    }

    /* Cards & Surfaces */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 18px 20px;
      box-shadow: var(--shadow-sm);
    }
    .grid-cards {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 16px;
    }

    /* Status Badges & Colors */
    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 9px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      color: #fff;
      white-space: nowrap;
    }
    .st-bg-Draft { background: var(--st-draft); }
    .st-bg-In-Review { background: var(--st-review); }
    .st-bg-Approved { background: var(--st-approved); }
    .st-bg-Scheduled { background: var(--st-scheduled); }
    .st-bg-Published { background: var(--st-published); }

    .st-border-Draft { border-left: 4px solid var(--st-draft); }
    .st-border-In-Review { border-left: 4px solid var(--st-review); }
    .st-border-Approved { border-left: 4px solid var(--st-approved); }
    .st-border-Scheduled { border-left: 4px solid var(--st-scheduled); }
    .st-border-Published { border-left: 4px solid var(--st-published); }

    /* Content Toolbar & Filters */
    .view-header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
    }
    .sub-tabs {
      display: inline-flex;
      background: #e2e8f0;
      padding: 3px;
      border-radius: var(--radius);
      gap: 2px;
    }
    .sub-tab {
      border: none;
      background: transparent;
      padding: 5px 13px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 13px;
      color: var(--text-muted);
    }
    .sub-tab.active {
      background: var(--surface);
      color: var(--text);
      box-shadow: var(--shadow-sm);
    }
    .filter-bar {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 12px 16px;
      margin-bottom: 18px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
    }
    .filter-bar input, .filter-bar select {
      width: auto;
      min-width: 140px;
      padding: 6px 10px;
      font-size: 13px;
    }
    .filter-bar input[type="text"] {
      flex: 1;
      min-width: 190px;
    }

    /* Calendar Grid */
    .cal-controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
    }
    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      background: var(--border);
      gap: 1px;
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      overflow: hidden;
    }
    .cal-dow {
      background: var(--surface-subtle);
      padding: 8px 10px;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
      text-align: center;
    }
    .cal-cell {
      background: var(--surface);
      min-height: 125px;
      padding: 6px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      position: relative;
    }
    .cal-cell.outside { background: #f8fafc; color: var(--text-soft); }
    .cal-cell.today { background: #f8fbff; }
    .cal-cell.drag-over { background: var(--accent-soft); outline: 2px dashed var(--accent); }
    .cal-cell-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 2px;
    }
    .cal-day-num.is-today {
      background: var(--accent);
      color: #fff;
      padding: 1px 6px;
      border-radius: 999px;
    }
    .cal-add-btn {
      opacity: 0;
      padding: 1px 6px;
      font-size: 12px;
      height: 20px;
      border-radius: 4px;
    }
    .cal-cell:hover .cal-add-btn, .cal-add-btn:focus-visible { opacity: 1; }
    .cal-chip {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--surface-subtle);
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 4px 6px;
      font-size: 11.5px;
      cursor: pointer;
      overflow: hidden;
      text-align: left;
    }
    .cal-chip:hover { background: var(--accent-soft); }
    .cal-chip-thumb {
      width: 20px;
      height: 20px;
      border-radius: 3px;
      object-fit: cover;
      flex-shrink: 0;
      background: #e2e8f0;
    }
    .cal-chip-text {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }

    /* Kanban Board */
    .board-wrap {
      display: grid;
      grid-template-columns: repeat(5, minmax(245px, 1fr));
      gap: 14px;
      overflow-x: auto;
      padding-bottom: 12px;
    }
    .board-col {
      background: #ebeff5;
      border-radius: var(--radius-lg);
      display: flex;
      flex-direction: column;
      min-height: 460px;
      border-top: 4px solid var(--st-draft);
    }
    .board-col-header {
      padding: 12px 14px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .board-col-body {
      padding: 0 10px 12px 10px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex: 1;
    }
    .board-col.drag-over { outline: 2px dashed var(--accent); background: #e2eaf8; }
    .board-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow-sm);
      cursor: pointer;
      display: flex;
      flex-direction: column;
    }
    .board-card:hover { box-shadow: var(--shadow-md); }
    .board-card-media {
      position: relative;
      height: 140px;
      background: #0f172a;
    }
    .board-card-media img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .video-placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f172a;
      color: #cbd5e1;
      font-size: 12px;
      font-weight: 600;
    }
    .media-badge {
      position: absolute;
      top: 8px;
      right: 8px;
      background: rgba(15, 23, 42, 0.78);
      color: #fff;
      font-size: 11px;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 99px;
    }
    .board-card-body {
      padding: 11px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .chip-row {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }
    .mini-chip {
      font-size: 11px;
      padding: 1px 6px;
      border-radius: 4px;
      background: var(--surface-subtle);
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-weight: 500;
    }
    .avatar-circle {
      width: 24px;
      height: 24px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent);
      font-weight: 700;
      font-size: 11px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    /* Tables */
    .table-wrap {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      overflow-x: auto;
    }
    table.data-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }
    table.data-table th {
      background: var(--surface-subtle);
      padding: 11px 14px;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }
    table.data-table td {
      padding: 11px 14px;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }
    table.data-table tr:last-child td { border-bottom: none; }
    table.data-table tr.clickable:hover td { background: #f8fafc; cursor: pointer; }

    /* Modals */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.5);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
      overflow-y: auto;
    }
    .modal-box {
      background: var(--surface);
      border-radius: var(--radius-lg);
      width: 100%;
      max-width: 640px;
      max-height: 92vh;
      display: flex;
      flex-direction: column;
      box-shadow: var(--shadow-lg);
      overflow: hidden;
    }
    .modal-box.modal-xl { max-width: 1040px; }
    .modal-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .modal-header h3 { margin: 0; font-size: 17px; }
    .modal-body {
      padding: 20px;
      overflow-y: auto;
      flex: 1;
    }
    .modal-footer {
      padding: 14px 20px;
      border-top: 1px solid var(--border);
      background: var(--surface-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    /* Post Editor Split Layout */
    .editor-split {
      display: grid;
      grid-template-columns: 1.35fr 0.95fr;
      gap: 22px;
    }
    .editor-side {
      border-left: 1px solid var(--border);
      padding-left: 20px;
      display: flex;
      flex-direction: column;
      max-height: 68vh;
    }
    .dropzone {
      border: 2px dashed var(--border-strong);
      border-radius: var(--radius);
      padding: 16px;
      text-align: center;
      background: var(--surface-subtle);
      cursor: pointer;
    }
    .dropzone.drag-active {
      border-color: var(--accent);
      background: var(--accent-soft);
    }
    .asset-strip {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding: 8px 0;
    }
    .asset-card {
      width: 120px;
      flex-shrink: 0;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      background: var(--surface);
    }
    .asset-card img {
      width: 100%;
      height: 82px;
      object-fit: cover;
      display: block;
      background: #e2e8f0;
    }
    .asset-card .video-placeholder { height: 82px; }
    .asset-card-controls {
      display: flex;
      justify-content: space-between;
      padding: 4px;
      background: var(--surface-subtle);
    }

    /* Toast Notifications */
    .toast-container {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 250;
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-width: 380px;
    }
    .toast {
      background: #0f172a;
      color: #fff;
      padding: 11px 15px;
      border-radius: var(--radius);
      box-shadow: var(--shadow-md);
      font-size: 13.5px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .toast.error { background: var(--danger); }
    .toast.success { background: #15803d; }

    /* Auth / Setup Centered Card */
    .auth-screen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .auth-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      width: 100%;
      max-width: 420px;
      padding: 28px;
      box-shadow: var(--shadow-md);
    }

    /* Responsive adjustments */
    @media (max-width: 860px) {
      .workspace { flex-direction: column; }
      .sidebar {
        width: 100%;
        border-right: none;
        border-bottom: 1px solid var(--border);
      }
      .main-area { padding: 16px; }
      .editor-split { grid-template-columns: 1fr; }
      .editor-side {
        border-left: none;
        border-top: 1px solid var(--border);
        padding-left: 0;
        padding-top: 16px;
        max-height: none;
      }
      .cal-cell { min-height: 74px; padding: 4px; }
      .cal-chip-thumb, .cal-chip-text { display: none; }
      .cal-chip {
        height: 8px;
        padding: 0;
        border-radius: 4px;
      }
      .cal-chip.st-border-Draft { background: var(--st-draft); }
      .cal-chip.st-border-In-Review { background: var(--st-review); }
      .cal-chip.st-border-Approved { background: var(--st-approved); }
      .cal-chip.st-border-Scheduled { background: var(--st-scheduled); }
      .cal-chip.st-border-Published { background: var(--st-published); }
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="auth-screen" id="initial-loader">
      <div class="auth-card" style="text-align:center">
        <div class="logo-mark" style="justify-content:center;margin-bottom:12px">
          <span></span><span></span><span></span><span></span><span></span>
        </div>
        <div style="font-weight:600;font-size:15px" id="loader-title">Loading workspace…</div>
        <div style="color:var(--text-soft);font-size:13px;margin-top:6px" id="loader-sub">Connecting to the server</div>
      </div>
    </div>
  </div>
  <div id="modal-root"></div>
  <div id="toast-root" class="toast-container" aria-live="polite"></div>

  <script>
    /* ========================================================================
       GLOBAL ERROR HANDLER & 30-SECOND FALLBACK GUARD
       ======================================================================== */
    var APP_BOOTED = false;
    var BOOT_FALLBACK_TIMER = setTimeout(function() {
      if (!APP_BOOTED) {
        renderFatalScreen('The workspace took longer than 30 seconds to respond. Check your connection and try again.');
      }
    }, 30000);

    window.addEventListener('error', function(ev) {
      var msg = (ev && ev.message) ? ev.message : 'Unexpected browser script error';
      showToast(msg, 'error');
      if (!APP_BOOTED) {
        renderFatalScreen('Script Error: ' + msg);
      }
    });

    window.addEventListener('unhandledrejection', function(ev) {
      var reason = (ev && ev.reason) ? (ev.reason.message || String(ev.reason)) : 'Unhandled promise rejection';
      showToast(reason, 'error');
      if (!APP_BOOTED) {
        renderFatalScreen('Promise Error: ' + reason);
      }
    });

    function renderFatalScreen(msg) {
      APP_BOOTED = true;
      clearTimeout(BOOT_FALLBACK_TIMER);
      var appEl = document.getElementById('app');
      if (!appEl) return;
      appEl.innerHTML = '<div class="auth-screen"><div class="auth-card">' +
        '<h2 style="margin:0 0 8px 0;color:var(--danger);font-size:18px">Unable to load workspace</h2>' +
        '<p style="color:var(--text-muted);margin:0 0 16px 0;word-break:break-word">' + esc(msg) + '</p>' +
        '<button class="btn-primary" onclick="location.reload()">Reload page</button>' +
        '</div></div>';
    }

    /* ========================================================================
       SAFE STORAGE & RPC PROMISE WRAPPER (45s / 180s TIMEOUT)
       ======================================================================== */
    var memoryStorage = {};
    function getSessionToken() {
      try {
        return localStorage.getItem('cocs_session_token') || memoryStorage.token || '';
      } catch (e) {
        return memoryStorage.token || '';
      }
    }
    function setSessionToken(tok) {
      memoryStorage.token = tok || '';
      try {
        if (tok) localStorage.setItem('cocs_session_token', tok);
        else localStorage.removeItem('cocs_session_token');
      } catch (e) {}
    }

    var STATE = {
      mode: 'loading', // 'setup' | 'login' | 'agency' | 'portal'
      clientToken: '',
      agencyName: 'Client Operations & Content Suite',
      user: null,
      webAppUrl: '',
      today: '',
      settings: {},
      team: [],
      clients: [],
      posts: [],
      comments: [],
      activity: [],
      invoices: [],
      isAdmin: false,
      isBilling: false,
      // UI navigation state
      nav: 'overview', // 'overview' | 'client' | 'team'
      selectedClientId: '',
      subView: 'calendar', // 'calendar' | 'board' | 'table' | 'invoices'
      calMode: 'month', // 'month' | 'week' | 'list'
      calCursor: '', // yyyy-MM-dd
      showArchived: false,
      filters: {
        search: '',
        status: '',
        platform: '',
        tag: '',
        assignee: ''
      },
      portalOnlyReview: false,
      editorDirty: false,
      activeModal: null
    };

    var API_ENDPOINT = '/api/rpc';

    function callApi(action, payload, isLongOp) {
      var timeoutMs = isLongOp ? 180000 : 45000;
      var auth = {
        sessionToken: getSessionToken(),
        clientToken: STATE.clientToken || ''
      };
      var ctrl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
      var timer = setTimeout(function() {
        if (ctrl) ctrl.abort();
      }, timeoutMs);

      return fetch(API_ENDPOINT, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: action, auth: auth, payload: payload || {} }),
        signal: ctrl ? ctrl.signal : undefined
      })
        .then(function(r) {
          return r.json().catch(function() {
            throw new Error('The server returned an invalid response (HTTP ' + r.status + ').');
          });
        })
        .then(function(res) {
          clearTimeout(timer);
          if (!res || !res.ok) {
            var err = new Error((res && res.error) ? res.error : 'Server error');
            err.code = (res && res.code) ? res.code : 'ERROR';
            if (err.code === 'AUTH' && STATE.mode === 'agency') {
              setSessionToken('');
              STATE.mode = 'login';
              STATE.authMessage = err.message || 'Your session expired. Please sign in again.';
              closeModal(true);
              renderApp();
            }
            throw err;
          }
          return res.data;
        }, function(err) {
          clearTimeout(timer);
          if (err && err.name === 'AbortError') {
            throw new Error('Request timed out after ' + (timeoutMs / 1000) + 's (' + action + ').');
          }
          throw new Error('Could not reach the server. Check your connection and try again.');
        });
    }

    /* ========================================================================
       UTILITIES
       ======================================================================== */
    function esc(str) {
      return String(str === null || str === undefined ? '' : str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function statusClass(st) {
      return String(st || 'Draft').replace(/\s+/g, '-');
    }

    function showToast(msg, type) {
      var root = document.getElementById('toast-root');
      if (!root) return;
      var el = document.createElement('div');
      el.className = 'toast ' + (type || '');
      el.innerHTML = '<span>' + esc(msg) + '</span><button class="btn-sm btn-ghost" style="color:#fff;padding:2px 6px" aria-label="Dismiss">✕</button>';
      el.querySelector('button').onclick = function() { el.remove(); };
      root.appendChild(el);
      setTimeout(function() {
        if (el.parentNode) el.remove();
      }, 4500);
    }

    function initials(nameOrEmail) {
      if (!nameOrEmail) return '—';
      var teamMember = getTeamMember(nameOrEmail);
      var label = teamMember ? teamMember.name : nameOrEmail;
      var parts = String(label).trim().split(/\s+/);
      if (parts.length >= 2) return (parts[0].charAt(0) + parts[1].charAt(0)).toUpperCase();
      return String(label).substring(0, 2).toUpperCase();
    }

    function getTeamMember(email) {
      if (!email) return null;
      for (var i = 0; i < STATE.team.length; i++) {
        if (STATE.team[i].email.toLowerCase() === String(email).toLowerCase()) return STATE.team[i];
      }
      return null;
    }

    function getClient(id) {
      for (var i = 0; i < STATE.clients.length; i++) {
        if (STATE.clients[i].id === id) return STATE.clients[i];
      }
      return null;
    }

    function formatCurrency(val, curr) {
      var n = Number(val || 0);
      return (curr || STATE.settings.defaultCurrency || 'USD') + ' ' + n.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    }

    function computeInvoiceTotals(inv) {
      var items = inv.items || [];
      var sub = 0;
      for (var i = 0; i < items.length; i++) {
        sub += Number(items[i].qty || 0) * Number(items[i].rate || 0);
      }
      var disc = Number(inv.discount || 0);
      var afterDisc = Math.max(0, sub - disc);
      var tax = afterDisc * (Number(inv.taxPct || 0) / 100);
      return {
        subtotal: sub,
        discount: disc,
        tax: tax,
        total: afterDisc + tax
      };
    }

    function isInvoiceOverdue(inv) {
      if (!inv || inv.status === 'Paid') return false;
      var today = STATE.today || new Date().toISOString().slice(0, 10);
      return Boolean(inv.dueDate && inv.dueDate < today);
    }

    function portalUrl(token) {
      var base = String(STATE.webAppUrl || location.origin).replace(/\/+$/, '');
      return base + '/?t=' + token;
    }

    /* ========================================================================
       INITIALIZATION & URL TOKEN DETECTION
       ======================================================================== */
    function initApp() {
      try {
        var params = new URLSearchParams(location.search);
        STATE.clientToken = String(params.get('t') || '').trim();
      } catch (e) {
        STATE.clientToken = '';
      }
      bootFromServer();
    }

    function bootFromServer() {
      callApi('boot', {})
        .then(function(data) {
          APP_BOOTED = true;
          clearTimeout(BOOT_FALLBACK_TIMER);
          applyBootState(data);
        })
        .catch(function(err) {
          APP_BOOTED = true;
          clearTimeout(BOOT_FALLBACK_TIMER);
          renderFatalScreen(err.message || 'Failed to initialize workspace.');
        });
    }

    function applyBootState(data) {
      STATE.mode = data.mode;
      STATE.agencyName = data.agencyName || 'Client Operations & Content Suite';
      if (data.authError) STATE.authMessage = data.authError;

      if (data.mode === 'agency') {
        STATE.user = data.user;
        STATE.webAppUrl = data.webAppUrl || '';
        STATE.today = data.today || new Date().toISOString().slice(0, 10);
        STATE.calCursor = STATE.calCursor || STATE.today;
        STATE.settings = data.settings || {};
        STATE.agencyName = STATE.settings.agencyName || STATE.agencyName;
        STATE.team = data.team || [];
        STATE.clients = data.clients || [];
        STATE.posts = data.posts || [];
        STATE.comments = data.comments || [];
        STATE.activity = data.activity || [];
        STATE.invoices = data.invoices || [];
        STATE.isAdmin = Boolean(data.isAdmin);
        STATE.isBilling = Boolean(data.isBilling);
      } else if (data.mode === 'portal') {
        STATE.rootClient = data.rootClient;
        STATE.clients = data.clients || [];
        STATE.posts = data.posts || [];
        STATE.comments = data.comments || [];
        STATE.today = new Date().toISOString().slice(0, 10);
        STATE.calCursor = STATE.today;
        if (STATE.clients.length > 0 && !STATE.selectedClientId) {
          STATE.selectedClientId = STATE.clients[0].id;
        }
        if (STATE.subView !== 'calendar' && STATE.subView !== 'board') {
          STATE.subView = 'calendar';
        }
      }
      renderApp();
    }

    /* ========================================================================
       ROOT RENDERER
       ======================================================================== */
    function renderApp() {
      var app = document.getElementById('app');
      if (!app) return;

      if (STATE.mode === 'setup') {
        app.innerHTML = renderSetupScreen();
        return;
      }
      if (STATE.mode === 'login') {
        app.innerHTML = renderLoginScreen();
        return;
      }
      if (STATE.mode === 'portal') {
        app.innerHTML = renderPortalWorkspace();
        return;
      }
      if (STATE.mode === 'agency') {
        app.innerHTML = renderAgencyWorkspace();
        return;
      }
    }

    /* ========================================================================
       SETUP & LOGIN SCREENS
       ======================================================================== */
    function renderSetupScreen() {
      return '<div class="auth-screen"><div class="auth-card">' +
        '<div style="display:flex;align-items:center;gap:10px;margin-bottom:16px">' +
          '<div class="logo-mark"><span></span><span></span><span></span><span></span><span></span></div>' +
          '<span class="brand-title">' + esc(STATE.agencyName) + '</span>' +
        '</div>' +
        '<h1 style="font-size:20px;margin:0 0 6px 0">Set up your workspace</h1>' +
        '<p style="color:var(--text-muted);font-size:13px;margin:0 0 18px 0">Enter the setup code you saved as the <code>SETUP_CODE</code> environment variable on the server to create the first Admin account.</p>' +
        '<form onsubmit="submitSetupAdmin(event)" style="display:flex;flex-direction:column;gap:12px">' +
          '<div><label class="field-label">Setup code</label><input type="text" id="setup-code" required placeholder="Setup code" autocomplete="off"></div>' +
          '<div><label class="field-label">Your name</label><input type="text" id="setup-name" required placeholder="Alex Morgan"></div>' +
          '<div><label class="field-label">Email address</label><input type="email" id="setup-email" required placeholder="alex@agency.com"></div>' +
          '<div><label class="field-label">Password (min 8 chars)</label><input type="password" id="setup-pass" required minlength="8"></div>' +
          '<div><label class="field-label">Confirm password</label><input type="password" id="setup-confirm" required minlength="8"></div>' +
          '<button type="submit" class="btn-primary" id="setup-btn" style="justify-content:center;margin-top:6px">Create admin &amp; open workspace</button>' +
        '</form>' +
      '</div></div>';
    }

    function submitSetupAdmin(e) {
      e.preventDefault();
      var pass = document.getElementById('setup-pass').value;
      var conf = document.getElementById('setup-confirm').value;
      if (pass !== conf) {
        showToast('Passwords do not match.', 'error');
        return;
      }
      var btn = document.getElementById('setup-btn');
      btn.disabled = true;
      btn.textContent = 'Setting up…';
      callApi('setupAdmin', {
        setupCode: document.getElementById('setup-code').value,
        name: document.getElementById('setup-name').value,
        email: document.getElementById('setup-email').value,
        password: pass
      }).then(function(data) {
        setSessionToken(data.sessionToken);
        applyBootState(data);
        showToast('Workspace ready. Welcome!', 'success');
      }).catch(function(err) {
        btn.disabled = false;
        btn.textContent = 'Create admin & open workspace';
        showToast(err.message, 'error');
      });
    }

    function renderLoginScreen() {
      var banner = STATE.authMessage
        ? '<div style="background:var(--danger-soft);color:var(--danger);padding:10px 12px;border-radius:var(--radius);font-size:13px;margin-bottom:14px">' + esc(STATE.authMessage) + '</div>'
        : '';
      return '<div class="auth-screen"><div class="auth-card">' +
        '<div style="display:flex;align-items:center;gap:10px;margin-bottom:16px">' +
          '<div class="logo-mark"><span></span><span></span><span></span><span></span><span></span></div>' +
          '<span class="brand-title">' + esc(STATE.agencyName) + '</span>' +
        '</div>' +
        '<h1 style="font-size:20px;margin:0 0 6px 0">Sign in to your workspace</h1>' +
        '<p style="color:var(--text-muted);font-size:13px;margin:0 0 18px 0">Enter your agency team email and password.</p>' +
        banner +
        '<form onsubmit="submitLogin(event)" style="display:flex;flex-direction:column;gap:12px">' +
          '<div><label class="field-label">Email address</label><input type="email" id="login-email" required autocomplete="username"></div>' +
          '<div><label class="field-label">Password</label><input type="password" id="login-pass" required autocomplete="current-password"></div>' +
          '<button type="submit" class="btn-primary" id="login-btn" style="justify-content:center;margin-top:6px">Sign in</button>' +
        '</form>' +
      '</div></div>';
    }

    function submitLogin(e) {
      e.preventDefault();
      STATE.authMessage = '';
      var btn = document.getElementById('login-btn');
      btn.disabled = true;
      btn.textContent = 'Signing in…';
      callApi('login', {
        email: document.getElementById('login-email').value,
        password: document.getElementById('login-pass').value
      }).then(function(data) {
        setSessionToken(data.sessionToken);
        applyBootState(data);
      }).catch(function(err) {
        btn.disabled = false;
        btn.textContent = 'Sign in';
        showToast(err.message, 'error');
      });
    }

    /* ========================================================================
       AGENCY WORKSPACE SHELL
       ======================================================================== */
    function renderAgencyWorkspace() {
      return renderTopBar() +
        '<div class="workspace">' +
          renderSidebar() +
          '<main class="main-area">' +
            renderAgencyMainContent() +
          '</main>' +
        '</div>';
    }

    function renderTopBar() {
      return '<header class="topbar">' +
        '<div class="topbar-left">' +
          '<div class="logo-mark" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div>' +
          '<span class="brand-title">' + esc(STATE.agencyName) + '</span>' +
          '<button class="nav-tab ' + (STATE.nav === 'overview' ? 'active' : '') + '" onclick="switchNav(\'overview\')">Overview</button>' +
          (STATE.isAdmin ? '<button class="nav-tab ' + (STATE.nav === 'team' ? 'active' : '') + '" onclick="switchNav(\'team\')">Team &amp; settings</button>' : '') +
        '</div>' +
        '<div class="topbar-right">' +
          '<button class="btn-ghost" onclick="openAccountModal()" title="Account settings">' +
            '<span class="avatar-circle">' + esc(initials(STATE.user.name)) + '</span>' +
            '<span style="font-weight:600">' + esc(STATE.user.name) + '</span>' +
            '<span style="color:var(--text-soft);font-size:12px">(' + esc(STATE.user.role) + ')</span>' +
          '</button>' +
        '</div>' +
      '</header>';
    }

    function renderSidebar() {
      var parents = STATE.clients.filter(function(c) {
        return !c.parentId && (STATE.showArchived || !c.archived);
      });
      parents.sort(function(a, b) { return a.name.localeCompare(b.name); });

      var treeHtml = '';
      if (parents.length === 0) {
        treeHtml = '<div style="padding:14px 8px;color:var(--text-soft);font-size:13px">No clients yet. Add a parent client to begin organizing content.</div>';
      } else {
        for (var i = 0; i < parents.length; i++) {
          var p = parents[i];
          var subs = STATE.clients.filter(function(s) {
            return s.parentId === p.id && (STATE.showArchived || !s.archived);
          });
          subs.sort(function(a, b) { return a.name.localeCompare(b.name); });

          var pActive = (STATE.nav === 'client' && STATE.selectedClientId === p.id) ? 'active' : '';
          treeHtml += '<div class="tree-parent-group">' +
            '<button class="tree-item ' + pActive + '" onclick="selectClient(\'' + esc(p.id) + '\')">' +
              '<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(p.name) + (p.archived ? ' (Archived)' : '') + '</span>' +
            '</button>' +
            '<div class="tree-sub-list">';

          for (var j = 0; j < subs.length; j++) {
            var s = subs[j];
            var sActive = (STATE.nav === 'client' && STATE.selectedClientId === s.id) ? 'active' : '';
            treeHtml += '<button class="tree-item tree-sub-item ' + sActive + '" onclick="selectClient(\'' + esc(s.id) + '\')">' +
              '<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(s.name) + (s.archived ? ' (Archived)' : '') + '</span>' +
            '</button>';
          }
          if (STATE.isBilling && !p.archived) {
            treeHtml += '<button class="tree-item tree-sub-item" style="color:var(--text-soft);font-size:12.5px" onclick="openClientModal(null, \'' + esc(p.id) + '\')">+ Add sub-client</button>';
          }
          treeHtml += '</div></div>';
        }
      }

      return '<aside class="sidebar">' +
        '<div class="sidebar-section-header">' +
          '<span>Clients</span>' +
          (STATE.isBilling ? '<button class="btn-sm" onclick="openClientModal(null, \'\')">+ Add client</button>' : '') +
        '</div>' +
        '<div class="client-tree">' + treeHtml + '</div>' +
        '<div style="border-top:1px solid var(--border);padding-top:10px;display:flex;align-items:center;justify-content:space-between;font-size:12.5px;color:var(--text-muted)">' +
          '<label style="display:flex;align-items:center;gap:6px;cursor:pointer">' +
            '<input type="checkbox" ' + (STATE.showArchived ? 'checked' : '') + ' onchange="toggleShowArchived(this.checked)"> Show archived' +
          '</label>' +
        '</div>' +
      '</aside>';
    }

    function switchNav(nav) {
      STATE.nav = nav;
      renderApp();
    }

    function selectClient(clientId) {
      STATE.nav = 'client';
      STATE.selectedClientId = clientId;
      if (!STATE.isBilling && STATE.subView === 'invoices') {
        STATE.subView = 'calendar';
      }
      renderApp();
    }

    function toggleShowArchived(checked) {
      STATE.showArchived = Boolean(checked);
      renderApp();
    }

    function renderAgencyMainContent() {
      if (STATE.nav === 'team' && STATE.isAdmin) {
        return renderTeamAndSettingsView();
      }
      if (STATE.nav === 'client' && STATE.selectedClientId) {
        var client = getClient(STATE.selectedClientId);
        if (client) {
          return client.parentId ? renderSubClientView(client) : renderParentClientView(client);
        }
      }
      return renderOverviewDashboard();
    }

    /* ========================================================================
       1. OVERVIEW DASHBOARD
       ======================================================================== */
    function renderOverviewDashboard() {
      var activeClientMap = {};
      for (var i = 0; i < STATE.clients.length; i++) {
        if (!STATE.clients[i].archived) activeClientMap[STATE.clients[i].id] = STATE.clients[i];
      }

      var inReviewPosts = STATE.posts.filter(function(p) {
        return activeClientMap[p.clientId] && p.status === 'In Review';
      });
      var today = STATE.today;
      var in7Days = addDaysToDateStr(today, 7);
      var upcomingPosts = STATE.posts.filter(function(p) {
        return activeClientMap[p.clientId] && p.date && p.date >= today && p.date <= in7Days;
      });
      upcomingPosts.sort(function(a, b) { return (a.date + a.time).localeCompare(b.date + b.time); });

      var html = '<div style="margin-bottom:20px">' +
        '<h1 style="font-size:22px;margin:0 0 4px 0">Overview</h1>' +
        '<p style="color:var(--text-muted);margin:0">Agency-wide content schedule, pending client approvals' + (STATE.isBilling ? ', and billing health.' : '.') + '</p>' +
      '</div>';

      // Billing Summary Cards for Admin / Account Manager
      if (STATE.isBilling) {
        var outstandingByCurr = {};
        var overdueInvoices = [];
        for (var iv = 0; iv < STATE.invoices.length; iv++) {
          var inv = STATE.invoices[iv];
          if (!activeClientMap[inv.clientId]) continue;
          if (inv.status !== 'Paid') {
            var tot = computeInvoiceTotals(inv).total;
            outstandingByCurr[inv.currency] = (outstandingByCurr[inv.currency] || 0) + tot;
            if (isInvoiceOverdue(inv)) overdueInvoices.push(inv);
          }
        }
        var currKeys = Object.keys(outstandingByCurr);
        var outStr = currKeys.length === 0 ? 'None outstanding' : currKeys.map(function(k) { return formatCurrency(outstandingByCurr[k], k); }).join(' · ');

        html += '<div class="grid-cards" style="margin-bottom:22px">' +
          '<div class="card"><div style="color:var(--text-muted);font-size:12.5px;font-weight:600">Waiting on client review</div><div style="font-size:24px;font-weight:700;margin-top:6px;color:var(--st-review)">' + inReviewPosts.length + '</div></div>' +
          '<div class="card"><div style="color:var(--text-muted);font-size:12.5px;font-weight:600">Scheduled in next 7 days</div><div style="font-size:24px;font-weight:700;margin-top:6px;color:var(--accent)">' + upcomingPosts.length + '</div></div>' +
          '<div class="card"><div style="color:var(--text-muted);font-size:12.5px;font-weight:600">Outstanding invoices</div><div style="font-size:20px;font-weight:700;margin-top:6px">' + esc(outStr) + '</div></div>' +
          '<div class="card"><div style="color:var(--text-muted);font-size:12.5px;font-weight:600">Overdue invoices</div><div style="font-size:24px;font-weight:700;margin-top:6px;color:' + (overdueInvoices.length > 0 ? 'var(--danger)' : 'var(--st-published)') + '">' + overdueInvoices.length + '</div></div>' +
        '</div>';
      }

      // Waiting on client review table
      html += '<div class="card" style="margin-bottom:20px">' +
        '<h2 style="font-size:16px;margin:0 0 12px 0">Posts waiting on client review (' + inReviewPosts.length + ')</h2>';
      if (inReviewPosts.length === 0) {
        html += '<div style="color:var(--text-soft);padding:12px 0">No posts are currently waiting on client review.</div>';
      } else {
        html += '<div class="table-wrap"><table class="data-table"><thead><tr><th>Client</th><th>Copy</th><th>Platforms</th><th>Scheduled</th><th>Assignee</th></tr></thead><tbody>';
        for (var r = 0; r < inReviewPosts.length; r++) {
          var rp = inReviewPosts[r];
          var rc = activeClientMap[rp.clientId];
          html += '<tr class="clickable" onclick="jumpToPost(\'' + esc(rp.clientId) + '\', \'' + esc(rp.id) + '\')">' +
            '<td style="font-weight:600">' + esc(rc ? rc.name : '') + '</td>' +
            '<td>' + esc((rp.text || '(No copy)').substring(0, 90)) + '</td>' +
            '<td>' + esc(rp.platforms.join(', ') || '—') + '</td>' +
            '<td style="white-space:nowrap">' + esc((rp.date || 'Unscheduled') + (rp.time ? ' ' + rp.time : '')) + '</td>' +
            '<td>' + esc(rp.assignee || 'Unassigned') + '</td>' +
          '</tr>';
        }
        html += '</tbody></table></div>';
      }
      html += '</div>';

      // Next 7 days table
      html += '<div class="card" style="margin-bottom:20px">' +
        '<h2 style="font-size:16px;margin:0 0 12px 0">Posts in the next 7 days (' + upcomingPosts.length + ')</h2>';
      if (upcomingPosts.length === 0) {
        html += '<div style="color:var(--text-soft);padding:12px 0">No posts scheduled in the next 7 days.</div>';
      } else {
        html += '<div class="table-wrap"><table class="data-table"><thead><tr><th>Date &amp; time</th><th>Client</th><th>Status</th><th>Copy</th><th>Platforms</th></tr></thead><tbody>';
        for (var u = 0; u < upcomingPosts.length; u++) {
          var up = upcomingPosts[u];
          var uc = activeClientMap[up.clientId];
          html += '<tr class="clickable" onclick="jumpToPost(\'' + esc(up.clientId) + '\', \'' + esc(up.id) + '\')">' +
            '<td style="white-space:nowrap;font-weight:600">' + esc(up.date + (up.time ? ' ' + up.time : '')) + '</td>' +
            '<td>' + esc(uc ? uc.name : '') + '</td>' +
            '<td><span class="status-pill st-bg-' + statusClass(up.status) + '">' + esc(up.status) + '</span></td>' +
            '<td>' + esc((up.text || '(No copy)').substring(0, 80)) + '</td>' +
            '<td>' + esc(up.platforms.join(', ') || '—') + '</td>' +
          '</tr>';
        }
        html += '</tbody></table></div>';
      }
      html += '</div>';

      // Overdue invoices table for billing roles
      if (STATE.isBilling) {
        var overdueList = STATE.invoices.filter(function(inv) {
          return activeClientMap[inv.clientId] && isInvoiceOverdue(inv);
        });
        html += '<div class="card">' +
          '<h2 style="font-size:16px;margin:0 0 12px 0">Overdue invoices (' + overdueList.length + ')</h2>';
        if (overdueList.length === 0) {
          html += '<div style="color:var(--text-soft);padding:12px 0">No overdue invoices across active clients.</div>';
        } else {
          html += '<div class="table-wrap"><table class="data-table"><thead><tr><th>Invoice #</th><th>Client</th><th>Due date</th><th>Total</th></tr></thead><tbody>';
          for (var od = 0; od < overdueList.length; od++) {
            var oInv = overdueList[od];
            var oc = activeClientMap[oInv.clientId];
            html += '<tr class="clickable" onclick="jumpToClientInvoices(\'' + esc(oInv.clientId) + '\')">' +
              '<td style="font-weight:600">' + esc(oInv.number) + '</td>' +
              '<td>' + esc(oc ? oc.name : '') + '</td>' +
              '<td style="color:var(--danger);font-weight:600">' + esc(oInv.dueDate) + '</td>' +
              '<td style="font-weight:600">' + esc(formatCurrency(computeInvoiceTotals(oInv).total, oInv.currency)) + '</td>' +
            '</tr>';
          }
          html += '</tbody></table></div>';
        }
        html += '</div>';
      }

      return html;
    }

    function jumpToPost(clientId, postId) {
      STATE.nav = 'client';
      STATE.selectedClientId = clientId;
      renderApp();
      openPostModal(postId);
    }

    function jumpToClientInvoices(clientId) {
      STATE.nav = 'client';
      STATE.selectedClientId = clientId;
      STATE.subView = 'invoices';
      renderApp();
    }

    /* ========================================================================
       2. PARENT CLIENT PAGE
       ======================================================================== */
    function renderParentClientView(parent) {
      var subs = STATE.clients.filter(function(c) {
        return c.parentId === parent.id && (STATE.showArchived || !c.archived);
      });
      subs.sort(function(a, b) { return a.name.localeCompare(b.name); });

      var html = '<div class="view-header">' +
        '<div>' +
          '<div style="font-size:12px;color:var(--text-soft);font-weight:600;text-transform:uppercase">Parent Client</div>' +
          '<h1 style="font-size:22px;margin:2px 0 0 0">' + esc(parent.name) + (parent.archived ? ' <span class="mini-chip">Archived</span>' : '') + '</h1>' +
        '</div>' +
        '<div style="display:flex;gap:8px;flex-wrap:wrap">' +
          (STATE.isBilling ? '<button onclick="openShareModal(\'' + esc(parent.id) + '\')">Share portal link</button>' : '') +
          (STATE.isBilling ? '<button onclick="openClientModal(\'' + esc(parent.id) + '\')">Edit client</button>' : '') +
          (STATE.isBilling && !parent.archived ? '<button class="btn-primary" onclick="openClientModal(null, \'' + esc(parent.id) + '\')">+ Add sub-client</button>' : '') +
        '</div>' +
      '</div>';

      // Sub-client cards with post counts per status
      html += '<h2 style="font-size:16px;margin:16px 0 12px 0">Sub-clients (' + subs.length + ')</h2>';
      if (subs.length === 0) {
        html += '<div class="card" style="color:var(--text-soft)">No sub-clients under ' + esc(parent.name) + ' yet. Add a sub-client to create content and invoices.</div>';
      } else {
        html += '<div class="grid-cards">';
        var statuses = ['Draft', 'In Review', 'Approved', 'Scheduled', 'Published'];
        for (var i = 0; i < subs.length; i++) {
          var sub = subs[i];
          var counts = { 'Draft': 0, 'In Review': 0, 'Approved': 0, 'Scheduled': 0, 'Published': 0 };
          for (var p = 0; p < STATE.posts.length; p++) {
            if (STATE.posts[p].clientId === sub.id) {
              counts[STATE.posts[p].status] = (counts[STATE.posts[p].status] || 0) + 1;
            }
          }
          html += '<div class="card" style="cursor:pointer" onclick="selectClient(\'' + esc(sub.id) + '\')">' +
            '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">' +
              '<strong style="font-size:16px">' + esc(sub.name) + '</strong>' +
              (sub.archived ? '<span class="mini-chip">Archived</span>' : '') +
            '</div>' +
            '<div style="display:flex;flex-wrap:wrap;gap:6px">';
          for (var st = 0; st < statuses.length; st++) {
            var sName = statuses[st];
            html += '<span class="mini-chip" style="border-left:3px solid var(--st-' + sName.toLowerCase().replace('in review', 'review') + ')">' + esc(sName) + ': <strong>' + counts[sName] + '</strong></span>';
          }
          html += '</div></div>';
        }
        html += '</div>';
      }

      // Billing rollup across all sub-clients
      if (STATE.isBilling) {
        var subMap = {};
        for (var sm = 0; sm < subs.length; sm++) subMap[subs[sm].id] = subs[sm];
        var rollupInvoices = STATE.invoices.filter(function(inv) { return Boolean(subMap[inv.clientId]); });

        var invoicedByCurr = {}, receivedByCurr = {}, outstandingByCurr = {};
        var overdueCount = 0;
        for (var r = 0; r < rollupInvoices.length; r++) {
          var inv = rollupInvoices[r];
          var tot = computeInvoiceTotals(inv).total;
          var c = inv.currency || 'USD';
          invoicedByCurr[c] = (invoicedByCurr[c] || 0) + tot;
          if (inv.status === 'Paid') {
            receivedByCurr[c] = (receivedByCurr[c] || 0) + tot;
          } else {
            outstandingByCurr[c] = (outstandingByCurr[c] || 0) + tot;
            if (isInvoiceOverdue(inv)) overdueCount++;
          }
        }
        var fmtMap = function(m) {
          var ks = Object.keys(m);
          return ks.length === 0 ? '0.00' : ks.map(function(k) { return formatCurrency(m[k], k); }).join(' · ');
        };

        html += '<h2 style="font-size:16px;margin:28px 0 12px 0">Billing rollup across sub-clients</h2>' +
          '<div class="grid-cards" style="margin-bottom:16px">' +
            '<div class="card"><div style="font-size:12px;color:var(--text-muted);font-weight:600">Total invoiced</div><div style="font-size:19px;font-weight:700;margin-top:4px">' + esc(fmtMap(invoicedByCurr)) + '</div></div>' +
            '<div class="card"><div style="font-size:12px;color:var(--text-muted);font-weight:600">Total received</div><div style="font-size:19px;font-weight:700;margin-top:4px;color:var(--st-published)">' + esc(fmtMap(receivedByCurr)) + '</div></div>' +
            '<div class="card"><div style="font-size:12px;color:var(--text-muted);font-weight:600">Outstanding (' + overdueCount + ' overdue)</div><div style="font-size:19px;font-weight:700;margin-top:4px;color:var(--st-review)">' + esc(fmtMap(outstandingByCurr)) + '</div></div>' +
          '</div>';

        if (rollupInvoices.length === 0) {
          html += '<div class="card" style="color:var(--text-soft)">No invoices across sub-clients yet.</div>';
        } else {
          html += '<div class="table-wrap"><table class="data-table"><thead><tr><th>Invoice #</th><th>Sub-client</th><th>Issue date</th><th>Due date</th><th>Status</th><th>Total</th></tr></thead><tbody>';
          for (var ri = 0; ri < rollupInvoices.length; ri++) {
            var rInv = rollupInvoices[ri];
            var subC = subMap[rInv.clientId];
            var overdue = isInvoiceOverdue(rInv);
            html += '<tr class="clickable" onclick="jumpToClientInvoices(\'' + esc(rInv.clientId) + '\')">' +
              '<td style="font-weight:600">' + esc(rInv.number) + '</td>' +
              '<td>' + esc(subC ? subC.name : '') + '</td>' +
              '<td>' + esc(rInv.issueDate) + '</td>' +
              '<td>' + esc(rInv.dueDate) + '</td>' +
              '<td><span class="status-pill" style="background:' + (rInv.status === 'Paid' ? 'var(--st-published)' : (overdue ? 'var(--danger)' : 'var(--st-review)')) + '">' + esc(overdue ? 'Overdue' : rInv.status) + '</span></td>' +
              '<td style="font-weight:600">' + esc(formatCurrency(computeInvoiceTotals(rInv).total, rInv.currency)) + '</td>' +
            '</tr>';
          }
          html += '</tbody></table></div>';
        }
      }

      return html;
    }

    /* ========================================================================
       3. SUB-CLIENT PAGE (CALENDAR | BOARD | TABLE | INVOICES)
       ======================================================================== */
    function renderSubClientView(client) {
      var parent = client.parentId ? getClient(client.parentId) : null;
      var html = '<div class="view-header">' +
        '<div>' +
          '<div style="font-size:12px;color:var(--text-soft);font-weight:600">' +
            (parent ? '<a href="javascript:void(0)" onclick="selectClient(\'' + esc(parent.id) + '\')" style="color:var(--text-soft);text-decoration:none">' + esc(parent.name) + '</a> / ' : '') +
            'Sub-client' +
          '</div>' +
          '<h1 style="font-size:22px;margin:2px 0 0 0">' + esc(client.name) + (client.archived ? ' <span class="mini-chip">Archived</span>' : '') + '</h1>' +
        '</div>' +
        '<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">' +
          '<div class="sub-tabs">' +
            '<button class="sub-tab ' + (STATE.subView === 'calendar' ? 'active' : '') + '" onclick="setSubView(\'calendar\')">Calendar</button>' +
            '<button class="sub-tab ' + (STATE.subView === 'board' ? 'active' : '') + '" onclick="setSubView(\'board\')">Board</button>' +
            '<button class="sub-tab ' + (STATE.subView === 'table' ? 'active' : '') + '" onclick="setSubView(\'table\')">Table</button>' +
            (STATE.isBilling ? '<button class="sub-tab ' + (STATE.subView === 'invoices' ? 'active' : '') + '" onclick="setSubView(\'invoices\')">Invoices</button>' : '') +
          '</div>' +
          (STATE.isBilling ? '<button onclick="openShareModal(\'' + esc(client.id) + '\')">Share</button>' : '') +
          (STATE.isBilling ? '<button onclick="openClientModal(\'' + esc(client.id) + '\')">Settings</button>' : '') +
          (STATE.subView !== 'invoices' ? '<button class="btn-primary" onclick="openPostModal(null, \'' + esc(STATE.today) + '\')">+ New post</button>' : '<button class="btn-primary" onclick="openInvoiceModal(null)">+ Add invoice</button>') +
        '</div>' +
      '</div>';

      if (STATE.subView === 'invoices' && STATE.isBilling) {
        return html + renderClientInvoicesView(client);
      }

      var allClientPosts = STATE.posts.filter(function(p) { return p.clientId === client.id; });
      var filteredPosts = filterPostsList(allClientPosts, false);

      html += renderContentFilterBar(allClientPosts, filteredPosts.length, false);

      if (STATE.subView === 'board') {
        html += renderBoardView(filteredPosts, false);
      } else if (STATE.subView === 'table') {
        html += renderTableView(filteredPosts);
      } else {
        html += renderCalendarView(filteredPosts, false);
      }
      return html;
    }

    function setSubView(v) {
      STATE.subView = v;
      renderApp();
    }

    function filterPostsList(posts, isPortal) {
      var f = STATE.filters;
      var q = String(f.search || '').trim().toLowerCase();
      return posts.filter(function(p) {
        if (isPortal && STATE.portalOnlyReview && p.status !== 'In Review') return false;
        if (f.status && p.status !== f.status) return false;
        if (f.platform && p.platforms.indexOf(f.platform) === -1) return false;
        if (f.tag && p.tags.indexOf(f.tag) === -1) return false;
        if (!isPortal && f.assignee) {
          if (f.assignee === '__UNASSIGNED__' && p.assignee) return false;
          if (f.assignee !== '__UNASSIGNED__' && p.assignee !== f.assignee) return false;
        }
        if (q) {
          var hay = (p.text || '').toLowerCase() + ' ' + p.tags.join(' ').toLowerCase();
          if (hay.indexOf(q) === -1) return false;
        }
        return true;
      });
    }

    function renderContentFilterBar(allClientPosts, shownCount, isPortal) {
      var tagSet = {};
      for (var i = 0; i < allClientPosts.length; i++) {
        var tArr = allClientPosts[i].tags || [];
        for (var j = 0; j < tArr.length; j++) tagSet[tArr[j]] = true;
      }
      var allTags = Object.keys(tagSet).sort();
      var statuses = ['Draft', 'In Review', 'Approved', 'Scheduled', 'Published'];
      var platforms = ['Instagram', 'Facebook', 'LinkedIn', 'TikTok', 'YouTube', 'X'];

      var f = STATE.filters;
      var hasActive = Boolean(f.search || f.status || f.platform || f.tag || f.assignee || (isPortal && STATE.portalOnlyReview));

      var html = '<div class="filter-bar">' +
        '<input type="text" placeholder="Search copy or tags…" value="' + esc(f.search) + '" oninput="updateFilter(\'search\', this.value)">' +
        '<select aria-label="Filter by status" onchange="updateFilter(\'status\', this.value)">' +
          '<option value="">All statuses</option>' +
          statuses.map(function(s) { return '<option value="' + esc(s) + '" ' + (f.status === s ? 'selected' : '') + '>' + esc(s) + '</option>'; }).join('') +
        '</select>' +
        '<select aria-label="Filter by platform" onchange="updateFilter(\'platform\', this.value)">' +
          '<option value="">All platforms</option>' +
          platforms.map(function(pl) { return '<option value="' + esc(pl) + '" ' + (f.platform === pl ? 'selected' : '') + '>' + esc(pl) + '</option>'; }).join('') +
        '</select>' +
        '<select aria-label="Filter by tag" onchange="updateFilter(\'tag\', this.value)">' +
          '<option value="">All tags</option>' +
          allTags.map(function(tg) { return '<option value="' + esc(tg) + '" ' + (f.tag === tg ? 'selected' : '') + '>' + esc(tg) + '</option>'; }).join('') +
        '</select>';

      if (!isPortal) {
        html += '<select aria-label="Filter by assignee" onchange="updateFilter(\'assignee\', this.value)">' +
          '<option value="">All assignees</option>' +
          '<option value="__UNASSIGNED__" ' + (f.assignee === '__UNASSIGNED__' ? 'selected' : '') + '>Unassigned</option>' +
          STATE.team.map(function(tm) { return '<option value="' + esc(tm.email) + '" ' + (f.assignee === tm.email ? 'selected' : '') + '>' + esc(tm.name) + '</option>'; }).join('') +
        '</select>';
      }

      if (hasActive) {
        html += '<button class="btn-sm btn-ghost" onclick="clearAllFilters()">Clear filters</button>';
      }
      html += '<span style="margin-left:auto;font-size:12.5px;color:var(--text-muted);font-weight:600">' + shownCount + ' of ' + allClientPosts.length + ' posts</span>' +
      '</div>';
      return html;
    }

    function updateFilter(key, val) {
      STATE.filters[key] = val;
      renderApp();
    }

    function clearAllFilters() {
      STATE.filters = { search: '', status: '', platform: '', tag: '', assignee: '' };
      STATE.portalOnlyReview = false;
      renderApp();
    }

    /* ========================================================================
       CALENDAR VIEW (MONTH / WEEK / LIST + DRAG RESCHEDULE)
       ======================================================================== */
    function parseDateParts(str) {
      var p = String(str || STATE.today || '2026-01-01').split('-');
      return new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]), 12, 0, 0);
    }
    function formatDateYmd(d) {
      var y = d.getFullYear();
      var m = ('0' + (d.getMonth() + 1)).slice(-2);
      var day = ('0' + d.getDate()).slice(-2);
      return y + '-' + m + '-' + day;
    }
    function addDaysToDateStr(str, days) {
      var d = parseDateParts(str);
      d.setDate(d.getDate() + days);
      return formatDateYmd(d);
    }

    function navigateCalendar(dir) {
      var cur = parseDateParts(STATE.calCursor || STATE.today);
      if (dir === 0) {
        STATE.calCursor = STATE.today;
      } else if (STATE.calMode === 'week') {
        cur.setDate(cur.getDate() + (dir * 7));
        STATE.calCursor = formatDateYmd(cur);
      } else {
        cur.setMonth(cur.getMonth() + dir);
        STATE.calCursor = formatDateYmd(cur);
      }
      renderApp();
    }

    function setCalMode(m) {
      STATE.calMode = m;
      renderApp();
    }

    function renderCalendarView(posts, isPortal) {
      var cursorDate = parseDateParts(STATE.calCursor || STATE.today);
      var monthNames = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
      var titleLabel = monthNames[cursorDate.getMonth()] + ' ' + cursorDate.getFullYear();

      var html = '<div class="cal-controls">' +
        '<div style="display:flex;align-items:center;gap:8px">' +
          '<button class="btn-sm" onclick="navigateCalendar(-1)">Prev</button>' +
          '<button class="btn-sm" onclick="navigateCalendar(0)">Today</button>' +
          '<button class="btn-sm" onclick="navigateCalendar(1)">Next</button>' +
          '<strong style="font-size:16px;margin-left:6px">' + esc(titleLabel) + '</strong>' +
        '</div>' +
        '<div class="sub-tabs">' +
          '<button class="sub-tab ' + (STATE.calMode === 'month' ? 'active' : '') + '" onclick="setCalMode(\'month\')">Month</button>' +
          '<button class="sub-tab ' + (STATE.calMode === 'week' ? 'active' : '') + '" onclick="setCalMode(\'week\')">Week</button>' +
          '<button class="sub-tab ' + (STATE.calMode === 'list' ? 'active' : '') + '" onclick="setCalMode(\'list\')">List</button>' +
        '</div>' +
      '</div>';

      if (STATE.calMode === 'list') {
        var sorted = posts.slice().sort(function(a, b) { return (a.date + a.time).localeCompare(b.date + b.time); });
        if (sorted.length === 0) {
          return html + '<div class="card" style="color:var(--text-soft);text-align:center;padding:32px">No posts match your current filters.</div>';
        }
        html += '<div class="table-wrap"><table class="data-table"><thead><tr><th>Date &amp; time</th><th>Status</th><th>Copy</th><th>Platforms</th></tr></thead><tbody>';
        for (var i = 0; i < sorted.length; i++) {
          var p = sorted[i];
          html += '<tr class="clickable" onclick="openPostModal(\'' + esc(p.id) + '\')">' +
            '<td style="white-space:nowrap;font-weight:600">' + esc((p.date || 'Unscheduled') + (p.time ? ' ' + p.time : '')) + '</td>' +
            '<td><span class="status-pill st-bg-' + statusClass(p.status) + '">' + esc(p.status) + '</span></td>' +
            '<td>' + esc((p.text || '(No copy)').substring(0, 100)) + '</td>' +
            '<td>' + esc(p.platforms.join(', ') || '—') + '</td>' +
          '</tr>';
        }
        html += '</tbody></table></div>';
        return html;
      }

      // Build day cells for Month or Week
      var days = [];
      if (STATE.calMode === 'week') {
        var startW = new Date(cursorDate.getTime());
        startW.setDate(startW.getDate() - startW.getDay());
        for (var w = 0; w < 7; w++) {
          var wd = new Date(startW.getTime());
          wd.setDate(wd.getDate() + w);
          days.push({ dateStr: formatDateYmd(wd), dayNum: wd.getDate(), outside: false });
        }
      } else {
        var firstDay = new Date(cursorDate.getFullYear(), cursorDate.getMonth(), 1, 12, 0, 0);
        var startM = new Date(firstDay.getTime());
        startM.setDate(startM.getDate() - startM.getDay());
        for (var m = 0; m < 42; m++) {
          var md = new Date(startM.getTime());
          md.setDate(md.getDate() + m);
          days.push({
            dateStr: formatDateYmd(md),
            dayNum: md.getDate(),
            outside: md.getMonth() !== cursorDate.getMonth()
          });
        }
      }

      var postsByDate = {};
      for (var pIdx = 0; pIdx < posts.length; pIdx++) {
        var pt = posts[pIdx];
        if (!pt.date) continue;
        if (!postsByDate[pt.date]) postsByDate[pt.date] = [];
        postsByDate[pt.date].push(pt);
      }

      var dows = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
      html += '<div class="cal-grid">';
      for (var d = 0; d < 7; d++) {
        html += '<div class="cal-dow">' + dows[d] + '</div>';
      }

      for (var c = 0; c < days.length; c++) {
        var cell = days[c];
        var isToday = (cell.dateStr === STATE.today);
        var dayPosts = (postsByDate[cell.dateStr] || []).slice().sort(function(a, b) {
          return (a.time || '').localeCompare(b.time || '');
        });

        var dragAttrs = isPortal ? '' : ' ondragover="onCalDragOver(event, this)" ondragleave="onCalDragLeave(this)" ondrop="onCalDrop(event, \'' + esc(cell.dateStr) + '\')"';
        html += '<div class="cal-cell ' + (cell.outside ? 'outside ' : '') + (isToday ? 'today' : '') + '"' + dragAttrs + '>' +
          '<div class="cal-cell-top">' +
            '<span class="cal-day-num ' + (isToday ? 'is-today' : '') + '">' + cell.dayNum + '</span>' +
            (!isPortal ? '<button class="cal-add-btn" title="Create post on ' + esc(cell.dateStr) + '" onclick="openPostModal(null, \'' + esc(cell.dateStr) + '\')">+</button>' : '') +
          '</div>';

        for (var dp = 0; dp < dayPosts.length; dp++) {
          var item = dayPosts[dp];
          var thumb = (item.assets && item.assets.length > 0 && item.assets[0].thumbUrl) ? '<img class="cal-chip-thumb" src="' + esc(item.assets[0].thumbUrl) + '" alt="">' : '';
          var draggableAttr = isPortal ? '' : ' draggable="true" ondragstart="onPostDragStart(event, \'' + esc(item.id) + '\')"';
          html += '<div class="cal-chip st-border-' + statusClass(item.status) + '"' + draggableAttr + ' onclick="openPostModal(\'' + esc(item.id) + '\')" title="' + esc(item.status + (item.time ? ' • ' + item.time : '') + ' — ' + (item.text || '')) + '">' +
            thumb +
            '<span class="cal-chip-text">' + (item.time ? '<strong>' + esc(item.time) + '</strong> ' : '') + esc(item.text || '(No copy)') + '</span>' +
          '</div>';
        }
        html += '</div>';
      }
      html += '</div>';
      return html;
    }

    function onPostDragStart(e, postId) {
      e.dataTransfer.setData('text/plain', postId);
    }
    function onCalDragOver(e, el) {
      e.preventDefault();
      el.classList.add('drag-over');
    }
    function onCalDragLeave(el) {
      el.classList.remove('drag-over');
    }
    function onCalDrop(e, newDateStr) {
      e.preventDefault();
      if (e.currentTarget) e.currentTarget.classList.remove('drag-over');
      var postId = e.dataTransfer.getData('text/plain');
      if (!postId) return;
      callApi('movePost', { postId: postId, date: newDateStr })
        .then(function(res) {
          upsertLocalPost(res.post, res.activity);
          renderApp();
          showToast('Rescheduled to ' + newDateStr, 'success');
        })
        .catch(function(err) { showToast(err.message, 'error'); });
    }

    /* ========================================================================
       BOARD VIEW (KANBAN COLUMNS + DRAG STATUS CHANGE)
       ======================================================================== */
    function renderBoardView(posts, isPortal) {
      var statuses = ['Draft', 'In Review', 'Approved', 'Scheduled', 'Published'];
      var commentCounts = {};
      for (var cm = 0; cm < STATE.comments.length; cm++) {
        var pid = STATE.comments[cm].postId;
        commentCounts[pid] = (commentCounts[pid] || 0) + 1;
      }

      var html = '<div class="board-wrap">';
      for (var s = 0; s < statuses.length; s++) {
        var st = statuses[s];
        var colPosts = posts.filter(function(p) { return p.status === st; });
        var borderVar = 'var(--st-' + st.toLowerCase().replace('in review', 'review') + ')';
        var dragAttrs = isPortal ? '' : ' ondragover="onBoardDragOver(event, this)" ondragleave="onBoardDragLeave(this)" ondrop="onBoardDrop(event, \'' + esc(st) + '\')"';

        html += '<div class="board-col" style="border-top-color:' + borderVar + '"' + dragAttrs + '>' +
          '<div class="board-col-header">' +
            '<span>' + esc(st) + '</span>' +
            '<span class="mini-chip">' + colPosts.length + '</span>' +
          '</div>' +
          '<div class="board-col-body">';

        for (var i = 0; i < colPosts.length; i++) {
          var p = colPosts[i];
          var firstAsset = (p.assets && p.assets.length > 0) ? p.assets[0] : null;
          var badge = '';
          if (p.assets && p.assets.length > 1) {
            badge = '<span class="media-badge">' + p.assets.length + ' items</span>';
          } else if (firstAsset && firstAsset.type === 'video') {
            badge = '<span class="media-badge">Video</span>';
          }

          var draggableAttr = isPortal ? '' : ' draggable="true" ondragstart="onPostDragStart(event, \'' + esc(p.id) + '\')"';
          html += '<div class="board-card"' + draggableAttr + ' onclick="openPostModal(\'' + esc(p.id) + '\')">';
          if (firstAsset) {
            html += '<div class="board-card-media">' +
              (firstAsset.thumbUrl ? '<img src="' + esc(firstAsset.thumbUrl) + '" alt="" loading="lazy">' : '<div class="video-placeholder">▶ Video</div>') +
              badge + '</div>';
          }
          html += '<div class="board-card-body">' +
            '<div style="font-size:13px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden">' + esc(p.text || '(No copy)') + '</div>';

          if (p.platforms.length > 0 || p.tags.length > 0) {
            html += '<div class="chip-row">';
            for (var pl = 0; pl < p.platforms.length; pl++) {
              html += '<span class="mini-chip" style="font-weight:600">' + esc(p.platforms[pl]) + '</span>';
            }
            for (var tg = 0; tg < p.tags.length; tg++) {
              html += '<span class="mini-chip">#' + esc(p.tags[tg]) + '</span>';
            }
            html += '</div>';
          }

          html += '<div style="display:flex;align-items:center;justify-content:space-between;font-size:11.5px;color:var(--text-soft);margin-top:2px">' +
            '<span>' + esc((p.date || 'No date') + (p.time ? ' ' + p.time : '')) + '</span>' +
            '<div style="display:flex;align-items:center;gap:8px">' +
              (commentCounts[p.id] ? '<span>💬 ' + commentCounts[p.id] + '</span>' : '') +
              (!isPortal && p.assignee ? '<span class="avatar-circle" title="' + esc(p.assignee) + '">' + esc(initials(p.assignee)) + '</span>' : '') +
            '</div>' +
          '</div></div></div>';
        }
        html += '</div></div>';
      }
      html += '</div>';
      return html;
    }

    function onBoardDragOver(e, el) {
      e.preventDefault();
      el.classList.add('drag-over');
    }
    function onBoardDragLeave(el) {
      el.classList.remove('drag-over');
    }
    function onBoardDrop(e, newStatus) {
      e.preventDefault();
      if (e.currentTarget) e.currentTarget.classList.remove('drag-over');
      var postId = e.dataTransfer.getData('text/plain');
      if (!postId) return;
      callApi('movePost', { postId: postId, status: newStatus })
        .then(function(res) {
          upsertLocalPost(res.post, res.activity);
          renderApp();
          showToast('Moved to ' + newStatus, 'success');
        })
        .catch(function(err) { showToast(err.message, 'error'); });
    }

    /* ========================================================================
       TABLE VIEW
       ======================================================================== */
    function renderTableView(posts) {
      if (posts.length === 0) {
        return '<div class="card" style="color:var(--text-soft);text-align:center;padding:32px">No posts match your current filters.</div>';
      }
      var html = '<div class="table-wrap"><table class="data-table"><thead><tr>' +
        '<th style="width:52px">Media</th><th>Copy</th><th>Status</th><th>Platforms</th><th>Tags</th><th>Date</th><th>Time</th><th>Assignee</th>' +
      '</tr></thead><tbody>';

      for (var i = 0; i < posts.length; i++) {
        var p = posts[i];
        var thumb = (p.assets && p.assets.length > 0 && p.assets[0].thumbUrl)
          ? '<img src="' + esc(p.assets[0].thumbUrl) + '" alt="" style="width:38px;height:38px;object-fit:cover;border-radius:6px;background:#e2e8f0">'
          : (p.assets && p.assets.length > 0
            ? '<div style="width:38px;height:38px;border-radius:6px;background:#0f172a;color:#cbd5e1;display:flex;align-items:center;justify-content:center;font-size:11px">▶</div>'
            : '<div style="width:38px;height:38px;border-radius:6px;background:var(--surface-subtle);border:1px solid var(--border)"></div>');
        var tm = getTeamMember(p.assignee);
        html += '<tr class="clickable" onclick="openPostModal(\'' + esc(p.id) + '\')">' +
          '<td>' + thumb + '</td>' +
          '<td style="max-width:320px"><div style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + esc(p.text || '(No copy)') + '</div></td>' +
          '<td><span class="status-pill st-bg-' + statusClass(p.status) + '">' + esc(p.status) + '</span></td>' +
          '<td>' + esc(p.platforms.join(', ') || '—') + '</td>' +
          '<td>' + esc(p.tags.join(', ') || '—') + '</td>' +
          '<td style="white-space:nowrap">' + esc(p.date || '—') + '</td>' +
          '<td style="white-space:nowrap">' + esc(p.time || '—') + '</td>' +

    /* ========================================================================
       4. POST EDITOR MODAL (UPLOADS, PASTE, DRIVE LINK, COMMENTS, HISTORY)
       ======================================================================== */
    var EDITOR_POST = null;

    function openPostModal(postId, defaultDate) {
      if (STATE.mode === 'portal') {
        openPortalPostModal(postId);
        return;
      }
      var existing = null;
      if (postId) {
        for (var i = 0; i < STATE.posts.length; i++) {
          if (STATE.posts[i].id === postId) {
            existing = STATE.posts[i];
            break;
          }
        }
      }

      EDITOR_POST = existing ? JSON.parse(JSON.stringify(existing)) : {
        id: '',
        clientId: STATE.selectedClientId,
        text: '',
        status: 'Draft',
        tags: [],
        platforms: [],
        date: defaultDate || STATE.today,
        time: '10:00',
        assets: [],
        liveUrl: '',
        metrics: { reach: '', likes: '', comments: '', shares: '' },
        assignee: ''
      };
      STATE.editorDirty = false;
      STATE.activeModal = 'postEditor';
      STATE.sideTab = 'comments';
      STATE.confirmDeletePost = false;
      renderPostEditorModal();
    }

      var publishedHtml = '';
